name: StarBlox Verify Published V11

on:
  push:
    branches:
      - release/step9-step6-final-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starblox-verify-published-v11
  cancel-in-progress: true

jobs:
  verify-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact published production server boot
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
          STARBLOX_RELEASE_ID: starblox-private-step9-canonical-step6-v4
          STARBLOX_EXPECTED_VERSION: '11'
        run: node scripts/verify-roblox-production-server-boot.mjs
