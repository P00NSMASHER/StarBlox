name: StarBlox Live Replit Companion QA

on:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - 'scripts/liveReplitCompanionQa.mjs'
      - '.github/workflows/live-replit-companion-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starblox-live-replit-companion-qa
  cancel-in-progress: true

jobs:
  verify-live-companions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: starblox-playwright-${{ runner.os }}-1.55.0-chromium

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Inspect live Replit companion cards and previews
        run: node scripts/liveReplitCompanionQa.mjs
        env:
          STARBLOX_QA_URL: https://star-blox.replit.app
          STARBLOX_QA_OUTPUT: artifacts/live-replit-companion-qa

      - name: Upload authoritative companion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-replit-companion-qa-${{ github.sha }}
          path: artifacts/live-replit-companion-qa/
          retention-days: 7
          if-no-files-found: error
