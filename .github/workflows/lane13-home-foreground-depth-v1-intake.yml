name: StarBlox Lane 13 Home Foreground Depth V1 Intake

on:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - '.github/workflows/lane13-home-foreground-depth-v1-intake.yml'
      - 'docs/preproduction/visuals/lane-13-home-foreground-depth-v1-seed.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starblox-lane13-home-foreground-depth-v1-intake
  cancel-in-progress: false

jobs:
  stage-verify-readback:
    if: github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0
      - name: Install image verifier only
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download exact generated bytes and build immutable intake evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, urllib.request
          from pathlib import Path
          from PIL import Image
          seed=json.loads(Path('docs/preproduction/visuals/lane-13-home-foreground-depth-v1-seed.json').read_text())
          result={
            'schemaVersion':1,'candidateId':seed['candidateId'],'producer':seed['producer'],
            'independentArtReviewer':seed['independentArtReviewer'],'compositionPerformanceReviewer':seed['compositionPerformanceReviewer'],
            'runtimeCoordinator':seed['runtimeCoordinator'],'branch':seed['branch'],'status':'STAGED_READY_FOR_INDEPENDENT_REVIEW',
            'runtimeWired':False,'sourceHeadBeforeStaging':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'referenceEvidence':seed['referenceEvidence'],'producerPixelCheck':seed['producerPixelCheck'],'responsiveIntent':seed['responsiveIntent'],
            'ownershipIsolation':seed['ownershipIsolation'],'freeze':seed['freeze'],'assets':{},'checks':{},
            'reviews':{'01':'PENDING_INDEPENDENT_ART_REVIEW','14':'PENDING_COMPOSITION_PERFORMANCE_REVIEW','15':'PENDING_COORDINATION_BEFORE_ANY_RUNTIME_WIRING'},
            'releaseGates':'Existing regression/build failures remain external release gates for 08/14/15 and are not changed by this visual intake.'}
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'StarBlox-Lane13-Visual-Intake/1.1'})
            with urllib.request.urlopen(req,timeout=90) as r:return r.read()
          def stage(label,spec):
            p=Path(spec['path']); p.parent.mkdir(parents=True,exist_ok=True); incoming=fetch(spec['url'])
            if p.exists() and p.read_bytes()!=incoming: raise RuntimeError(f'conflicting existing bytes at {p}')
            if not p.exists(): p.write_bytes(incoming)
            with Image.open(p) as im:
              im.load(); dims=list(im.size); fmt=im.format; mode=im.mode; alpha_bbox=None; alpha_extrema=None
              if 'A' in im.getbands():
                alpha=im.getchannel('A'); alpha_bbox=list(alpha.getbbox()) if alpha.getbbox() else None; alpha_extrema=list(alpha.getextrema())
            if dims!=spec['expectedDimensions'] or fmt!=spec['expectedFormat']: raise RuntimeError(f'{p}: expected {spec["expectedFormat"]} {spec["expectedDimensions"]}, got {fmt} {dims}')
            if spec['transparentRequired'] and (alpha_extrema is None or alpha_extrema[0]>=255 or alpha_extrema[1]!=255): raise RuntimeError(f'{p}: expected meaningful alpha transparency, got {alpha_extrema}')
            b=p.read_bytes()
            return {'label':label,'path':str(p),'bytes':len(b),'dimensions':dims,'format':fmt,'mode':mode,'sha256':hashlib.sha256(b).hexdigest(),'gitBlobSha':subprocess.check_output(['git','hash-object',str(p)],text=True).strip(),'alphaBounds':alpha_bbox,'alphaExtrema':alpha_extrema,'transparentRequired':spec['transparentRequired']}
          for label in ('source','full','optimized'): result['assets'][label]=stage(label,seed['assets'][label])
          result['checks']={'sourceDecode':'PASS_PNG_2016x1152','fullDecode':'PASS_PNG_2016x1152','optimizedDecode':'PASS_PNG_1008x576','fullTransparency':'PASS_MEANINGFUL_ALPHA','optimizedTransparency':'PASS_MEANINGFUL_ALPHA','separateLayerNotFlattenedScreen':'PASS_BY_ASSET_SCOPE_AND_PIXEL_INSPECTION','uiTextButtonsAbsent':'PASS_BY_PRODUCER_PIXEL_INSPECTION','exactRepositoryReadback':'PENDING_REMOTE_READBACK','independentArtReview':'PENDING_01','compositionPerformanceReview':'PENDING_14','runtimeIntegration':'NOT_PERFORMED'}
          Path('docs/preproduction/visuals/lane-13-home-foreground-depth-v1-intake.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({'candidateId':result['candidateId'],'assets':result['assets'],'checks':result['checks']},indent=2))
          PY
      - name: Publish versioned visual candidate bytes and first-pass intake evidence
        run: |
          set -eu
          test "$GITHUB_REF" = 'refs/heads/screenshot-match-preproduction'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/preproduction/visuals/recovered-originals/home-foreground-depth-w13-v1-source.png public/assets/visuals/lane-13/home-foreground-depth-w13-v1-full.png public/assets/visuals/lane-13/home-foreground-depth-w13-v1-1008.png docs/preproduction/visuals/lane-13-home-foreground-depth-v1-intake.json
          if ! git diff --cached --quiet; then
            git commit -m 'visuals: stage Lane 13 Home foreground depth v1'
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/screenshot-match-preproduction; then break; fi
              git fetch origin screenshot-match-preproduction; git rebase origin/screenshot-match-preproduction
              if [ "$attempt" -eq 3 ]; then echo 'safe publication blocked by concurrent changes; no force push' >&2; exit 1; fi
            done
          fi
      - name: Prove exact remote repository readback and record hashes
        run: |
          set -eu
          git fetch origin screenshot-match-preproduction
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          p=Path('docs/preproduction/visuals/lane-13-home-foreground-depth-v1-intake.json'); r=json.loads(p.read_text()); remote='origin/screenshot-match-preproduction'; rb={}
          for label,a in r['assets'].items():
            data=subprocess.check_output(['git','show',f'{remote}:{a["path"]}']); sha=hashlib.sha256(data).hexdigest(); ok=(sha==a['sha256'] and len(data)==a['bytes'])
            rb[label]={'path':a['path'],'bytes':len(data),'sha256':sha,'matchesStagedBytes':ok}
            if not ok: raise RuntimeError(f'remote readback mismatch for {label}')
          r['remoteReadback']={'remoteRef':remote,'remoteHead':subprocess.check_output(['git','rev-parse',remote],text=True).strip(),'assets':rb}; r['checks']['exactRepositoryReadback']='PASS_3_OF_3_EXACT_SHA256_AND_BYTE_LENGTH'; p.write_text(json.dumps(r,indent=2)+'\n'); print(json.dumps(r['remoteReadback'],indent=2))
          PY
          git add -- docs/preproduction/visuals/lane-13-home-foreground-depth-v1-intake.json
          if ! git diff --cached --quiet; then
            git commit -m 'visuals: record Lane 13 exact remote readback'
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/screenshot-match-preproduction; then exit 0; fi
              git fetch origin screenshot-match-preproduction; git rebase origin/screenshot-match-preproduction
            done
            echo 'readback evidence publication blocked; no force push' >&2; exit 1
          fi
      - name: Retain review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane13-home-foreground-depth-v1-review-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            docs/preproduction/visuals/lane-13-home-foreground-depth-v1-seed.json
            docs/preproduction/visuals/lane-13-home-foreground-depth-v1-intake.json
            docs/preproduction/visuals/recovered-originals/home-foreground-depth-w13-v1-source.png
            public/assets/visuals/lane-13/home-foreground-depth-w13-v1-full.png
            public/assets/visuals/lane-13/home-foreground-depth-w13-v1-1008.png
