name: One-shot private publish and pilot evidence 75584c13

on:
  push:
    branches:
      - release/private-main-75584c13
    paths:
      - .github/workflows/one-shot-private-publish-evidence-75584c13.yml

permissions:
  contents: read

concurrency:
  group: starblox-final-private-release
  cancel-in-progress: false

jobs:
  release-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact verified main commit
        uses: actions/checkout@v4
        with:
          ref: 75584c13de11976c06f72d8f1d48e9c039ae1d57
          fetch-depth: 0

      - name: Prove exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "75584c13de11976c06f72d8f1d48e9c039ae1d57"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup pinned Roblox toolchain
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0
          path: .

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned Roblox runtime packages
        run: |
          cd roblox
          wally install
          test -e Packages/Matter.lua
          test -e ServerPackages/ProfileStore.lua

      - name: Run Steps 3-4 release regression gate
        run: |
          npx vitest run \
            src/robloxRuntime/pilotLearningSteps34.test.js \
            src/robloxRuntime/studyPilotMode.test.js \
            src/robloxRuntime/researchQuestionImprovements712.test.js \
            src/robloxRuntime/phase5FinalRelease.test.js \
            src/robloxRuntime/phase6QuestionBank.test.js \
            src/robloxRuntime/productionServerBootProof.test.js \
            src/robloxRuntime/privatePublish.test.js
          npm run roblox:backbone:verify

      - name: Prepare exact native-inspected release candidate
        run: |
          node scripts/prepare-step9-release-candidate.mjs \
            --source-commit "75584c13de11976c06f72d8f1d48e9c039ae1d57" \
            --out-dir artifacts/final-release
          test -s artifacts/final-release/StarBlox-Step9-Step6-Gated.rbxlx
          grep -q '"status": "private-release-gate-open"' artifacts/final-release/step6-release-gate.json
          grep -q '"nativeArtifactWorldVerified": true' artifacts/final-release/step6-release-gate.json
          grep -q '"nativeArtifactRuntimeVerified": true' artifacts/final-release/step6-release-gate.json
          grep -q '"publicAccessChangeAllowed": false' artifacts/final-release/step6-release-gate.json
          grep -q '"productionActivationAllowed": false' artifacts/final-release/step6-release-gate.json

      - name: Publish exact gated candidate privately
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
          STARBLOX_SOURCE_COMMIT: 75584c13de11976c06f72d8f1d48e9c039ae1d57
          STARBLOX_RELEASE_GATE_RECEIPT: ${{ github.workspace }}/artifacts/final-release/step6-release-gate.json
          STARBLOX_RELEASE_ARTIFACT: ${{ github.workspace }}/artifacts/final-release/StarBlox-Step9-Step6-Gated.rbxlx
          STARBLOX_PUBLISH_RECEIPT: ${{ github.workspace }}/artifacts/final-release/private-publish-receipt.json
        run: |
          npm run roblox:publish-private
          grep -q '"publicAccessChangeAttempted": false' artifacts/final-release/private-publish-receipt.json
          grep -q '"productionActivationAllowed": false' artifacts/final-release/private-publish-receipt.json

      - name: Verify exact published server boot
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
          STARBLOX_PUBLISH_RECEIPT: ${{ github.workspace }}/artifacts/final-release/private-publish-receipt.json
        run: node scripts/verify-roblox-production-server-boot.mjs > artifacts/final-release/server-boot-proof.json

      - name: Read live pilot evidence privately
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: |
          mkdir -p artifacts/pilot-private
          node scripts/fetch-live-pilot-metrics.mjs --out artifacts/pilot-private/live.json

      - name: Build live pilot baseline
        run: |
          node scripts/build-pilot-baseline.mjs \
            artifacts/pilot-private/live.json \
            docs/phase6/ABVM_GRADE2_ROTATING_QUESTION_SOURCE.json \
            --json artifacts/pilot-private/baseline.json \
            --markdown artifacts/pilot-private/baseline.md

      - name: Run live fail-closed calibration
        run: |
          node scripts/calibrate-pilot-items.mjs \
            artifacts/pilot-private/baseline.json \
            artifacts/pilot-private/live.json \
            docs/phase6/ABVM_GRADE2_ROTATING_QUESTION_SOURCE.json \
            --json artifacts/pilot-private/calibration.json \
            --markdown artifacts/pilot-private/calibration.md

      - name: Remove detailed pilot evidence
        if: ${{ always() }}
        run: rm -rf artifacts/pilot-private

      - name: Upload release evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: starblox-steps3-4-private-release-evidence
          path: |
            artifacts/final-release/step9-release-candidate.json
            artifacts/final-release/step6-release-gate.json
            artifacts/final-release/private-publish-receipt.json
            artifacts/final-release/server-boot-proof.json
          if-no-files-found: ignore
          retention-days: 30
