name: Same-Day StarBlox Prep

on:
  push:
    branches: [integration/same-day-starblox-pipeline]
    paths:
      - .github/workflows/same-day-prep.yml
      - config/same-day/**
      - scripts/same-day-pipeline.mjs
      - src/sameDayPipeline/**
      - src/robloxMigration/**
      - tools/roblox_catalog_reader/**
      - tools/roblox_migration_exporter/**
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to prepare
        required: false
        default: integration/same-day-starblox-pipeline

concurrency:
  group: same-day-prep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-staging-place:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Rojo 7.7.0
        run: |
          curl -fsSL \
            -o /tmp/rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          rm -rf /tmp/rojo-bin
          mkdir -p /tmp/rojo-bin
          unzip -q /tmp/rojo.zip -d /tmp/rojo-bin
          ROJO_BIN="$(find /tmp/rojo-bin -type f -name rojo -print -quit)"
          test -n "$ROJO_BIN"
          sudo install -m 0755 "$ROJO_BIN" /usr/local/bin/rojo
          rojo --version

      - name: Build pre-Studio same-day bundle
        run: |
          rm -rf artifacts/same-day-starblox
          npm run same-day:pipeline -- \
            --manifest config/same-day/pipeline.example.json \
            --skip-code-donors \
            --stop-after build-staging-place

      - name: Verify staged outputs
        run: |
          test -f artifacts/same-day-starblox/StarBloxSameDay.rbxlx
          test -f artifacts/same-day-starblox/same-day-pipeline-state.json
          test -f artifacts/same-day-starblox/same-day-pipeline-plan.json
          test -f artifacts/same-day-starblox/same-day-staging-report.json
          grep -q '"publicationAllowed": false' artifacts/same-day-starblox/same-day-staging-report.json
          node --input-type=module - <<'NODE'
          import {readFile,stat} from 'node:fs/promises';
          import {resolve} from 'node:path';

          const base='artifacts/same-day-starblox';
          const state=JSON.parse(await readFile(
            resolve(base,'same-day-pipeline-state.json'),
            'utf8'
          ));
          if(state.stages?.['build-staging-place']?.status !== 'complete'){
            throw new Error('build-staging-place did not complete');
          }
          for(const id of ['checkout-arnis','checkout-achassis','checkout-flex','checkout-rorooms']){
            if(state.stages?.[id]?.status !== 'pending'){
              throw new Error(id + ' should remain pending in pre-Studio prep');
            }
          }

          const report=JSON.parse(await readFile(
            resolve(base,'same-day-staging-report.json'),
            'utf8'
          ));
          if(report.publicationAllowed !== false) throw new Error('staging publication must remain disabled');
          if(report.scriptBearingUnitsMounted !== 0) throw new Error('script-bearing legacy unit was mounted');
          if(report.remoteBearingUnitsMounted !== 0) throw new Error('remote-bearing legacy unit was mounted');
          if(Number(report.sanitizedProjectionUnitsMounted || 0) < 1){
            throw new Error('no sanitized world projection was mounted');
          }

          const world=report.included.find(row =>
            row.sourceId === 'brookhaven' &&
            row.systemName === 'Workspace' &&
            row.projection?.sanitized === true
          );
          if(!world) throw new Error('sanitized Brookhaven Workspace projection is missing');
          if(world.projection.policy !== 'strip-executable-network-v1'){
            throw new Error('unexpected Brookhaven projection policy');
          }
          if(Number(world.projection.forbiddenRemaining) !== 0){
            throw new Error('Brookhaven projection contains forbidden executable/network classes');
          }
          if(Number(world.projection.strippedForbiddenInstances || 0) < 1){
            throw new Error('Brookhaven projection did not record stripped forbidden instances');
          }

          const worldPath=resolve(base,'sources/brookhaven/export',world.path);
          const worldInfo=await stat(worldPath);
          if(worldInfo.size < 10_000_000){
            throw new Error('Brookhaven staged world is implausibly small: ' + worldInfo.size);
          }
          const placeInfo=await stat(resolve(base,'StarBloxSameDay.rbxlx'));
          if(placeInfo.size < 10_000_000){
            throw new Error('generated StarBlox place is implausibly small: ' + placeInfo.size);
          }

          const xml=await readFile(worldPath,'utf8');
          const forbidden=[
            'Script','LocalScript','ModuleScript',
            'RemoteEvent','RemoteFunction','UnreliableRemoteEvent',
            'BindableEvent','BindableFunction'
          ];
          for(const className of forbidden){
            if(xml.includes('class="' + className + '"')){
              throw new Error('forbidden class survived Brookhaven projection: ' + className);
            }
          }
          const modelCount=(xml.match(/class="Model"/g) || []).length;
          const partCount=(xml.match(/class="(?:Part|MeshPart|UnionOperation)"/g) || []).length;
          if(modelCount < 500 || partCount < 2_000){
            throw new Error(
              'Brookhaven projection lacks expected physical-world density: ' +
              modelCount + ' models / ' + partCount + ' physical parts'
            );
          }
          console.log(
            'Brookhaven world projection verified: ' +
            modelCount + ' models / ' + partCount + ' physical parts / ' +
            worldInfo.size + ' bytes'
          );
          NODE

      - name: Verify exact source and export provenance
        run: |
          node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {resolve} from 'node:path';

          const base='artifacts/same-day-starblox';
          const state=JSON.parse(await readFile(resolve(base,'same-day-pipeline-state.json'),'utf8'));
          const expected={
            brookhaven:'ddc2248663770e968dfe2b27b97b577c0c12fd93177305b884bed9c929923217',
            robbing:'f413653c19d124517c4dc5409b635ae58122d4e1a63255e9aa7608fd0ba9f920'
          };

          for(const [id,sha256] of Object.entries(expected)){
            const ingest=state.stages?.['ingest-'+id]?.result;
            if(ingest?.bootstrap?.verified !== true || ingest.bootstrap.sha256 !== sha256){
              throw new Error(id+' source fingerprint is not bound to the expected authorized bytes');
            }
            const plan=JSON.parse(await readFile(
              resolve(base,'sources',id,'planning','migration-plan.json'),'utf8'
            ));
            if(!(Number(plan.summary?.selectedUnits) > 0)){
              throw new Error(id+' migration plan selected zero units');
            }
            const receipt=JSON.parse(await readFile(
              resolve(base,'sources',id,'export','migration-export-receipt.json'),'utf8'
            ));
            if(
              receipt.status !== 'exported' ||
              receipt.liveActivationAllowed !== false ||
              receipt.publicationStarted !== false ||
              receipt.studioMutationStarted !== false
            ){
              throw new Error(id+' export receipt crossed the staging-only boundary');
            }
            console.log(id, {
              sha256,
              selected:plan.summary.selectedUnits,
              staging:plan.summary.stagingUnits,
              quarantine:plan.summary.quarantineUnits,
              bytes:receipt.summary?.totalBytes
            });
          }
          NODE

      - name: Upload resumable pre-Studio bundle
        uses: actions/upload-artifact@v4
        with:
          name: starblox-same-day-pre-studio
          path: artifacts/same-day-starblox
          retention-days: 3
          if-no-files-found: error