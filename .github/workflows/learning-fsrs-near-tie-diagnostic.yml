name: Learning FSRS Near Tie Diagnostic

on:
  push:
    branches:
      - starblox-learning-factory-v1
    paths:
      - "scripts/diagnoseFsrsNearTieDevelopment.mjs"
      - ".github/workflows/learning-fsrs-near-tie-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  near-tie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false
      - name: Generate development cohort
        run: npm run generate:learning-promotion -- --out-dir=.near-tie-development --learners=48 --max-step=30 --seed=20261217
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run actual FSRS
        run: |
          cd tools/fsrs-shadow
          go mod tidy
          go run . -input ../../.near-tie-development/riff-reviews.json -out ../../.near-tie-development/fsrs-engine-receipt.json -evaluation-offset-hours 24
      - name: Sweep bounded FSRS risk margins
        run: node scripts/diagnoseFsrsNearTieDevelopment.mjs --evaluation=.near-tie-development/evaluation.json --fsrs=.near-tie-development/fsrs-engine-receipt.json --out=.near-tie-development/near-tie-diagnostic.json
      - name: Enforce development-only boundary
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('.near-tie-development/near-tie-diagnostic.json','utf8'));
          if(r.developmentOnly!==true||r.promotionBoundary?.liveSelectorAllowed!==false){
            throw new Error('near-tie diagnostic boundary broken');
          }
          console.log(JSON.stringify({
            best:r.bestDevelopmentCandidate,
            liveSelectorAllowed:false
          },null,2));
          NODE
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-fsrs-near-tie-development
          path: .near-tie-development
          if-no-files-found: error
          include-hidden-files: true
