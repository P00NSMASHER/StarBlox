name: Publish Clean Brookhaven Baseline

on:
  workflow_dispatch:
  push:
    branches: [main, repair/native-brookhaven-runtime-v51, repair/native-weather-controller-v52, repair/avatar-shop-live-path-v53]
    paths:
      - ".github/workflows/publish-clean-brookhaven.yml"
      - "brookhaven-source.json"
      - "scripts/fetch-brookhaven.mjs"
      - "scripts/publish-private.mjs"
      - "compatibility/**"
      - "tools/brookhaven_compat_patcher/**"
      - "scripts/verify-published-native-runtime.mjs"
      - "scripts/verify-compatibility-compile.luau"
      - "scripts/verify-native-ui-live-path.mjs"

permissions:
  contents: read

concurrency:
  group: clean-brookhaven-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-private:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify shop/avatar live-path contracts
        run: node scripts/verify-native-ui-live-path.mjs | tee native-ui-contract.log
      - name: Compile exact-revision Luau modules before publishing
        shell: bash
        run: |
          git rev-parse HEAD > source-revision.txt
          test "$(cat source-revision.txt)" = "$GITHUB_SHA"
          curl --fail --location --silent --show-error https://github.com/lune-org/lune/releases/download/v0.10.5/lune-0.10.5-linux-x86_64.zip -o /tmp/lune.zip
          echo '1fb5dee6a1afa1d300092805c6e660fe06144d29dd68c45cf6956f040667f791  /tmp/lune.zip' | sha256sum --check
          mkdir -p /tmp/starblox-lune
          unzip -q /tmp/lune.zip -d /tmp/starblox-lune
          chmod +x /tmp/starblox-lune/lune
          /tmp/starblox-lune/lune run scripts/verify-compatibility-compile.luau 2>&1 | tee native-compile.log
      - name: Verify exact-revision controller regressions before publishing
        shell: bash
        run: cargo test --manifest-path tools/brookhaven_compat_patcher/Cargo.toml 2>&1 | tee controller-regressions.log
      - name: Fetch pinned Brookhaven source
        run: node scripts/fetch-brookhaven.mjs
      - name: Add control and house compatibility without rebuilding the world
        run: |
          cargo run --quiet --manifest-path tools/brookhaven_compat_patcher/Cargo.toml -- \
            Brookhaven.rbxl Brookhaven-compat.rbxl brookhaven-compat-receipt.json
          test -s Brookhaven-compat.rbxl
          grep -q '"worldGeometryRebuilt": false' brookhaven-compat-receipt.json
          grep -q '"existingGuiRestyled": false' brookhaven-compat-receipt.json
          mv Brookhaven-compat.rbxl Brookhaven.rbxl
      - name: Publish private staging baseline
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: node scripts/publish-private.mjs
      - name: Verify published native Brookhaven behavior
        shell: bash
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: node scripts/verify-published-native-runtime.mjs 2>&1 | tee native-behavior.log
      - name: Upload compatibility and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brookhaven-compat-publish
          path: |
            source-revision.txt
            native-compile.log
            native-ui-contract.log
            controller-regressions.log
            native-behavior.log
            brookhaven-compat-receipt.json
            published-version.txt
            publish-response.json
            Brookhaven.rbxl
          if-no-files-found: error
          retention-days: 30
