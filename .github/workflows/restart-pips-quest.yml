name: Restart Pips Quest Servers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restart-pips-quest.yml"

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart StarBlox universe servers
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
        run: |
          test "$ROBLOX_UNIVERSE_ID" = "6027194615"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "x-api-key: $ROBLOX_OPEN_CLOUD_API_KEY" \
            -H "content-type: application/json" \
            -d '{}' \
            "https://apis.roblox.com/cloud/v2/universes/$ROBLOX_UNIVERSE_ID:restartServers"
          echo
          echo "PIPSQUEST_SERVER_RESTART_OK"
