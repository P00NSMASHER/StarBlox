name: StarBlox Staged Catalog Art QA

on:
  push:
    branches:
      - screenshot-match-preproduction
    paths:
      - 'public/assets/catalog/**'
      - 'public/assets/catalog-candidates/**'
      - 'docs/preproduction/catalog-sprint/lane-05.json'
      - 'docs/preproduction/catalog-sprint/lane-02.json'
      - 'docs/preproduction/catalog-sprint/lane-01.json'
      - 'docs/preproduction/catalog-sprint/lane-03.json'
      - 'docs/preproduction/catalog-sprint/lane-04.json'
      - 'docs/preproduction/catalog-sprint/lane-06.json'
      - 'docs/preproduction/catalog-sprint/lane-07.json'
      - 'docs/preproduction/catalog-sprint/lane-09.json'
      - 'docs/preproduction/catalog-sprint/lane-11.json'
      - 'docs/preproduction/catalog-sprint/lane-12.json'
      - 'docs/preproduction/visuals/lane-13.json'
      - 'scripts/catalog-staged-art-qa.mjs'
      - 'scripts/artReviewNormalizer.mjs'
      - 'scripts/catalogVisualPreflight.py'
      - 'scripts/catalogVisualCalibration.py'
      - '.github/workflows/catalog-staged-art-qa.yml'
  workflow_run:
    workflows:
      - 'StarBlox Art Factory CPU Generation'
      - 'StarBlox Art Factory CPU Sequential Generation'
    types: [completed]
    branches: [screenshot-match-preproduction]
  workflow_dispatch:

concurrency:
  group: starblox-staged-art-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-assigned-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: starblox-playwright-${{ runner.os }}-1.55.0-chromium

      - name: Install Playwright without changing package metadata
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render exact review scope
        id: render
        continue-on-error: true
        run: node scripts/catalog-staged-art-qa.mjs
        env:
          STARBLOX_QA_FACTORY_ONLY: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
          STARBLOX_QA_PUSH_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight visual-preflight dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Build current review corpus, calibration, and neighbor cache
        run: |
          mkdir -p artifacts/catalog-staged-art/preflight
          node scripts/artReviewNormalizer.mjs \
            --repo-root . \
            --output artifacts/catalog-staged-art/review-corpus.json
          python scripts/catalogVisualCalibration.py \
            --repo-root . \
            --corpus artifacts/catalog-staged-art/review-corpus.json \
            --output artifacts/catalog-staged-art/visual-calibration.json
          python scripts/catalogVisualPreflight.py cache \
            --neighbors public/assets/catalog \
            --output artifacts/catalog-staged-art/preflight/catalog-neighbor-cache.json

      - name: Attach calibrated report-only preflight to exact rendered candidates
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('.')
          report_path = pathlib.Path('artifacts/catalog-staged-art/report.json')
          calibration = pathlib.Path('artifacts/catalog-staged-art/visual-calibration.json')
          neighbor_cache = pathlib.Path('artifacts/catalog-staged-art/preflight/catalog-neighbor-cache.json')
          if not report_path.exists():
              print('No staged-art report exists; calibrated attachment is not applicable.')
              raise SystemExit(0)
          report = json.loads(report_path.read_text())
          items = report.get('sets', {}).get('staged-replacements', {}).get('items', [])
          out_dir = pathlib.Path('artifacts/catalog-staged-art/preflight')
          out_dir.mkdir(parents=True, exist_ok=True)

          summary = []
          raster_exts = {'.png', '.jpg', '.jpeg', '.webp'}
          for item in items:
              repo_path = item.get('repositoryPath')
              item_id = item.get('id')
              blob_sha = item.get('blobSha')
              if not repo_path or not item_id or item.get('status') != 200:
                  continue
              suffix = pathlib.Path(repo_path).suffix.lower()
              if suffix not in raster_exts:
                  summary.append({
                      'itemId': item_id,
                      'blobSha': blob_sha,
                      'repositoryPath': repo_path,
                      'preflightPath': None,
                      'calibrationApplicable': False,
                      'preflightState': 'SKIPPED_NON_RASTER_SOURCE',
                      'reason': 'Raster calibration is not transferred onto vector source metrics; exact rendered pixel evidence remains authoritative.',
                      'warningReadyFeatureCount': 0,
                      'triggeredWarningCount': 0,
                      'triggeredWarnings': [],
                      'blocking': False,
                  })
                  continue
              dest = out_dir / f"{item_id}-{str(blob_sha or '')[:8]}.json"
              subprocess.run([
                  sys.executable,
                  'scripts/catalogVisualPreflight.py',
                  'scan',
                  '--input', repo_path,
                  '--neighbor-cache', str(neighbor_cache),
                  '--calibration', str(calibration),
                  '--output', str(dest),
              ], check=True)
              preflight = json.loads(dest.read_text())
              triggered = [
                  row for row in preflight.get('calibratedWarnings', [])
                  if row.get('triggered')
              ]
              summary.append({
                  'itemId': item_id,
                  'blobSha': blob_sha,
                  'repositoryPath': repo_path,
                  'preflightPath': str(dest),
                  'calibrationApplicable': True,
                  'preflightState': 'RASTER_CALIBRATION_ATTACHED',
                  'warningReadyFeatureCount': preflight.get('calibrationEvidence', {}).get('warningReadyFeatureCount', 0),
                  'triggeredWarningCount': len(triggered),
                  'triggeredWarnings': [
                      {
                          'feature': row.get('feature'),
                          'value': row.get('value'),
                          'threshold': row.get('threshold'),
                          'direction': row.get('direction'),
                          'targetFailureCodes': row.get('targetFailureCodes', []),
                      }
                      for row in triggered
                  ],
                  'blocking': False,
              })

          report['calibratedPreflight'] = {
              'policy': 'REPORT_ONLY_HUMAN_EXACT_HASH_REVIEW_REMAINS_AUTHORITATIVE',
              'candidateCount': len(summary),
              'rasterCalibratedCount': sum(1 for row in summary if row.get('calibrationApplicable')),
              'nonRasterSkippedCount': sum(1 for row in summary if not row.get('calibrationApplicable')),
              'items': summary,
              'blockingEnabled': False,
          }
          report_path.write_text(json.dumps(report, indent=2) + '\n')
          pathlib.Path('artifacts/catalog-staged-art/preflight/index.json').write_text(
              json.dumps(report['calibratedPreflight'], indent=2) + '\n'
          )
          print(json.dumps(report['calibratedPreflight'], indent=2))
          PY

      - name: Print staged-art summary
        if: always()
        run: cat artifacts/catalog-staged-art/report.json || true

      - name: Upload staged-art screenshots, hashes, calibration, and preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-staged-art-review
          path: artifacts/catalog-staged-art
          if-no-files-found: error
          retention-days: 14

      - name: Enforce renderer gate after preserving evidence
        if: always()
        env:
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          if [ "$RENDER_OUTCOME" != "success" ]; then
            echo "Renderer gate failed; diagnostic and calibration evidence were preserved above." >&2
            exit 1
          fi
