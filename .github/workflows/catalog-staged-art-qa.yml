name: StarBlox Staged Catalog Art QA

on:
  push:
    branches:
      - screenshot-match-preproduction
    paths:
      - 'public/assets/catalog/lighting-*.svg'
      - 'docs/preproduction/catalog-sprint/reviews/14-lighting-contact-sheet.svg'
      - '.github/workflows/catalog-staged-art-qa.yml'
  workflow_dispatch:

concurrency:
  group: starblox-staged-art-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-lighting-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright without changing package metadata
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start repository-root fixture server
        run: |
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory . > /tmp/starblox-staged-art.log 2>&1 &
          echo $! > /tmp/starblox-staged-art.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/docs/preproduction/catalog-sprint/reviews/14-lighting-contact-sheet.svg >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/starblox-staged-art.log
          exit 1

      - name: Render exact lighting candidates at card and detail scale
        run: |
          mkdir -p artifacts/catalog-staged-art/lighting-detail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 1200, height: 960 }, deviceScaleFactor: 1 });
          const base = 'http://127.0.0.1:4174';
          const consoleErrors = [];
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
          page.on('pageerror', e => consoleErrors.push(String(e)));
          await page.goto(`${base}/docs/preproduction/catalog-sprint/reviews/14-lighting-contact-sheet.svg`, {waitUntil:'networkidle'});
          await page.screenshot({path:'artifacts/catalog-staged-art/lighting-contact-sheet.png', fullPage:true});
          const results = [];
          for (let i=1;i<=12;i++) {
            const p = await browser.newPage({viewport:{width:800,height:800},deviceScaleFactor:1});
            const errors = [];
            p.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            p.on('pageerror', e => errors.push(String(e)));
            const url = `${base}/public/assets/catalog/lighting-${i}.svg`;
            const response = await p.goto(url, {waitUntil:'networkidle'});
            const status = response?.status() ?? null;
            const body = await p.locator('svg').count();
            await p.screenshot({path:`artifacts/catalog-staged-art/lighting-detail/lighting-${i}.png`, fullPage:true});
            results.push({id:`lighting-${i}`,url,status,svgCount:body,errors});
            await p.close();
          }
          fs.writeFileSync('artifacts/catalog-staged-art/report.json', JSON.stringify({sourceHead:process.env.GITHUB_SHA,contactSheetErrors:consoleErrors,results}, null, 2));
          if (consoleErrors.length || results.some(r => r.status !== 200 || r.svgCount !== 1 || r.errors.length)) process.exitCode = 1;
          await browser.close();
          NODE

      - name: Print staged-art summary
        if: always()
        run: cat artifacts/catalog-staged-art/report.json || true

      - name: Upload staged-art screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-staged-art-lighting
          path: artifacts/catalog-staged-art
          if-no-files-found: error
          retention-days: 14

      - name: Print fixture server log on failure
        if: failure()
        run: cat /tmp/starblox-staged-art.log || true
