name: StarBlox Staged Catalog Art QA

on:
  push:
    branches:
      - screenshot-match-preproduction
    paths:
      - 'public/assets/catalog/**'
      - 'public/assets/catalog-candidates/**'
      - 'docs/preproduction/catalog-sprint/lane-03.json'
      - 'docs/preproduction/catalog-sprint/lane-04.json'
      - 'docs/preproduction/catalog-sprint/lane-06.json'
      - 'docs/preproduction/catalog-sprint/lane-07.json'
      - 'docs/preproduction/catalog-sprint/lane-09.json'
      - 'docs/preproduction/catalog-sprint/lane-11.json'
      - '.github/workflows/catalog-staged-art-qa.yml'
  workflow_dispatch:

concurrency:
  group: starblox-staged-art-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-assigned-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright without changing package metadata
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start repository-root fixture server
        run: |
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory . > /tmp/starblox-staged-art.log 2>&1 &
          echo $! > /tmp/starblox-staged-art.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/public/assets/catalog/wall-1.svg >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/starblox-staged-art.log
          exit 1

      - name: Render reviewer collections and every repository-staged replacement hash
        run: |
          mkdir -p artifacts/catalog-staged-art
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          const base = 'http://127.0.0.1:4174';
          const themes = ['Cloud Pop','Pixel Party','Berry Blast','Garden Glow','Galaxy Glow','Sunny Pop','Aqua Wave','Art Attack','Star Luxe','Midnight Neon','Candy Core','Adventure Club'];
          const definitions = {
            lighting: {lane:'docs/preproduction/catalog-sprint/lane-04.json', offset:0, names:['Starter Lamp','Cloud Lamp','Pixel Cube Light','Heart Lamp','Vine Light','Planet Lamp','Sun Lamp','Bubble Lamp','Color Lamp','Neon Strip Tower','Aurora Light','Crystal Chandelier']},
            wall: {lane:'docs/preproduction/catalog-sprint/lane-05.json', offset:3, names:['School Star Poster','Cloud Wall Flag','Pixel Scoreboard','Heart Gallery','Garden Garland','Planet Map','Skate Poster','Ocean Window','Art Gallery Wall','Neon City Sign','Star Mirror','Golden Crest']},
            rugs: {lane:'docs/preproduction/catalog-sprint/lane-07.json', offset:6, names:['Starter Mat','Cloud Rug','Pixel Grid Rug','Heart Rug','Leaf Rug','Orbit Rug','Checker Rug','Wave Rug','Splash Rug','Neon Grid Rug','Dream Cloud Rug','Luxe Star Rug']},
            decor: {lane:'docs/preproduction/catalog-sprint/lane-09.json', offset:9, names:['Book Crate','Cloud Shelf','Arcade Mini','Plush Stack','Plant Wall','Telescope','Skate Rack','Mini Aquarium','Easel Set','Mini Fridge','Dream Vanity Set','Trophy Wall']}
          };
          const producerLanes = [
            'docs/preproduction/catalog-sprint/lane-03.json',
            'docs/preproduction/catalog-sprint/lane-04.json',
            'docs/preproduction/catalog-sprint/lane-06.json',
            'docs/preproduction/catalog-sprint/lane-07.json',
            'docs/preproduction/catalog-sprint/lane-09.json',
            'docs/preproduction/catalog-sprint/lane-11.json'
          ];
          const tierFor = i => i < 3 ? 1 : i < 6 ? 2 : i < 9 ? 3 : i < 11 ? 4 : 5;

          function allObjects(value, out=[]) {
            if (!value || typeof value !== 'object') return out;
            if (Array.isArray(value)) { for (const v of value) allObjects(v, out); return out; }
            out.push(value);
            for (const v of Object.values(value)) allObjects(v, out);
            return out;
          }
          function normalizeRepoPath(p) {
            if (!p || typeof p !== 'string') return null;
            if (p.startsWith('/assets/')) return `public${p}`;
            return p.replace(/^\//, '');
          }
          function candidatePathFromObject(o) {
            for (const key of ['candidateRepositoryPath','repositoryPath','candidatePath','optimizedPath','publicPath','path','intendedRepositoryPath']) {
              const p = normalizeRepoPath(o?.[key]);
              if (p && fs.existsSync(p)) return p;
            }
            return null;
          }
          function candidatePathFromLane(lane, id) {
            const matches = allObjects(lane).filter(o => o.id === id);
            for (let i=matches.length-1;i>=0;i--) {
              const p = candidatePathFromObject(matches[i]);
              if (p) return p;
            }
            return null;
          }
          function blobSha(p) {
            return execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim();
          }
          function isReplacementPath(id, p) {
            return p !== `public/assets/catalog/${id}.svg`;
          }
          function stateText(o) {
            return ['status','decision','reviewStatus','candidateStatus','repositoryStatus']
              .map(k => String(o?.[k] ?? '').toUpperCase()).join(' ');
          }
          function looksReviewable(o) {
            const s = stateText(o);
            return s.includes('READY_FOR_REVIEW') || s.includes('READY_FOR_FRESH_REVIEW') || s.includes('READY_FOR_FRESH_INDEPENDENT_PIXEL_REVIEW') || s.includes('STAGED');
          }
          function replacementFileId(file) {
            const m = file.match(/^([a-z]+-\d+)-.+\.(?:svg|png|jpe?g|webp)$/i);
            return m?.[1] ?? null;
          }
          function collectReplacementCandidates() {
            const byKey = new Map();
            const metadataById = new Map();
            for (const lanePath of producerLanes) {
              if (!fs.existsSync(lanePath)) continue;
              let lane;
              try { lane = JSON.parse(fs.readFileSync(lanePath,'utf8')); } catch { continue; }
              for (const o of allObjects(lane)) {
                if (!o?.id || !/^[a-z]+-\d+$/.test(o.id)) continue;
                metadataById.set(o.id, {...(metadataById.get(o.id) ?? {}), ...o, producerLane:lanePath});
                const repositoryPath = candidatePathFromObject(o);
                if (!repositoryPath || !isReplacementPath(o.id, repositoryPath) || !looksReviewable(o)) continue;
                const sha = blobSha(repositoryPath);
                byKey.set(`${o.id}:${sha}`, {
                  id:o.id,
                  name:o.name ?? o.id,
                  tier:o.tier ?? null,
                  theme:o.theme ?? null,
                  producerLane:lanePath,
                  discovery:'lane-reviewable',
                  repositoryPath,
                  blobSha:sha
                });
              }
            }

            const root = 'public/assets/catalog';
            if (fs.existsSync(root)) {
              for (const file of fs.readdirSync(root).sort()) {
                const id = replacementFileId(file);
                if (!id) continue;
                const repositoryPath = path.posix.join(root, file);
                const sha = blobSha(repositoryPath);
                const meta = metadataById.get(id) ?? {};
                byKey.set(`${id}:${sha}`, {
                  id,
                  name:meta.name ?? id,
                  tier:meta.tier ?? null,
                  theme:meta.theme ?? null,
                  producerLane:meta.producerLane ?? null,
                  discovery:'versioned-file-scan',
                  repositoryPath,
                  blobSha:sha
                });
              }
            }
            return [...byKey.values()].sort((a,b) => a.id.localeCompare(b.id) || a.repositoryPath.localeCompare(b.repositoryPath));
          }

          async function renderSet(browser, setName, items, report) {
            const out = path.join('artifacts/catalog-staged-art', setName);
            fs.mkdirSync(path.join(out, 'detail'), {recursive:true});
            const setReport = {items:[],contactSheetErrors:[]};
            report.sets[setName] = setReport;
            if (!items.length) return;

            const page = await browser.newPage({viewport:{width:1200,height:960},deviceScaleFactor:1});
            page.on('console', m => { if (m.type()==='error') setReport.contactSheetErrors.push(m.text()); });
            page.on('pageerror', e => setReport.contactSheetErrors.push(String(e)));
            const cards = items.map(item => `<article><img src="${base}/${item.repositoryPath}" alt="${item.id}"><div><b>${item.id}</b><br>${item.name}<br><span>${item.tier ? `T${item.tier}` : ''}${item.theme ? ` · ${item.theme}` : ''} · ${item.blobSha.slice(0,8)}</span></div></article>`).join('');
            await page.setContent(`<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#081936;color:white;font:14px system-ui,sans-serif}main{box-sizing:border-box;width:1200px;padding:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}article{min-height:286px;background:#102c5d;border:2px solid #39d5ff;border-radius:18px;padding:12px;box-sizing:border-box}img{width:100%;height:210px;object-fit:contain;display:block}div{padding-top:7px;line-height:18px}span{color:#b9d8ff;font-size:12px}</style><main>${cards}</main>`);
            await page.waitForFunction(() => [...document.images].every(img => img.complete && img.naturalWidth > 0), null, {timeout:15000});
            await page.screenshot({path:path.join(out, `${setName}-contact-sheet.png`), fullPage:true, timeout:15000});
            await page.close();

            for (const item of items) {
              const p = await browser.newPage({viewport:{width:800,height:800},deviceScaleFactor:1});
              const errors = [];
              p.on('console', m => { if (m.type()==='error') errors.push(m.text()); });
              p.on('pageerror', e => errors.push(String(e)));
              const url = `${base}/${item.repositoryPath}`;
              let status = null, naturalWidth = 0, naturalHeight = 0, screenshot = false;
              try {
                const probe = await fetch(url);
                status = probe.status;
                if (status !== 200) throw new Error(`asset status ${status}`);
                await p.setContent(`<!doctype html><meta charset="utf-8"><style>html,body{margin:0;width:800px;height:800px;background:#081936;display:grid;place-items:center}img{width:800px;height:800px;object-fit:contain}</style><img id="asset" src="${url}" alt="${item.id}">`);
                await p.waitForFunction(() => { const img=document.querySelector('#asset'); return img && img.complete && img.naturalWidth>0; }, null, {timeout:15000});
                const size = await p.locator('#asset').evaluate(img => ({w:img.naturalWidth,h:img.naturalHeight}));
                naturalWidth = size.w;
                naturalHeight = size.h;
                await p.locator('#asset').screenshot({path:path.join(out, 'detail', `${item.id}-${item.blobSha.slice(0,8)}.png`), timeout:15000});
                screenshot = true;
              } catch (error) { errors.push(String(error)); }
              setReport.items.push({...item,status,naturalWidth,naturalHeight,screenshot,errors});
              await p.close();
            }
          }

          const browser = await chromium.launch({headless:true});
          const report = {sourceHead:process.env.GITHUB_SHA, sets:{}, errors:[]};

          for (const [collection, def] of Object.entries(definitions)) {
            let lane = {};
            try { lane = JSON.parse(fs.readFileSync(def.lane,'utf8')); } catch {}
            const items = def.names.map((name,i) => {
              const id = `${collection}-${i+1}`;
              const fallback = `public/assets/catalog/${id}.svg`;
              const repositoryPath = candidatePathFromLane(lane,id) ?? fallback;
              if (!fs.existsSync(repositoryPath)) throw new Error(`${id}: no staged file at ${repositoryPath}`);
              return {id,name,tier:tierFor(i),theme:themes[(i+def.offset)%themes.length],repositoryPath,blobSha:blobSha(repositoryPath)};
            });
            await renderSet(browser, collection, items, report);
          }

          const replacements = collectReplacementCandidates();
          await renderSet(browser, 'staged-replacements', replacements, report);
          report.replacementCount = replacements.length;
          report.replacementIds = replacements.map(x => `${x.id}:${x.blobSha}:${x.repositoryPath}`);

          fs.writeFileSync('artifacts/catalog-staged-art/report.json', JSON.stringify(report, null, 2));
          await browser.close();
          const failures = Object.values(report.sets).flatMap(c => [
            ...c.contactSheetErrors,
            ...c.items.flatMap(i => (i.status !== 200 || !i.screenshot || !i.naturalWidth || i.errors.length) ? [`${i.id}: ${JSON.stringify(i)}`] : [])
          ]);
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exitCode = 1;
          }
          NODE

      - name: Print staged-art summary
        if: always()
        run: cat artifacts/catalog-staged-art/report.json || true

      - name: Upload staged-art screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-staged-art-review
          path: artifacts/catalog-staged-art
          if-no-files-found: error
          retention-days: 14

      - name: Print fixture server log on failure
        if: failure()
        run: cat /tmp/starblox-staged-art.log || true
