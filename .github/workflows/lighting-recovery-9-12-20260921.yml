name: StarBlox Lighting 9-12 Byte Recovery

on:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - '.github/workflows/lighting-recovery-9-12-20260921.yml'
      - 'scripts/importLightingRecovery9to12_20260921.py'
      - 'docs/preproduction/catalog-sprint/chat-lighting-recovery-9-12-20260921.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starblox-lighting-recovery-9-12-20260921
  cancel-in-progress: false

jobs:
  recover-exact-existing-lighting:
    if: github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image validation dependency only
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Recover exact existing Lighting 9-12 bytes and verify Store metadata
        run: python3 scripts/importLightingRecovery9to12_20260921.py
      - name: Re-run importer to prove immutable repeat/readback behavior
        run: python3 scripts/importLightingRecovery9to12_20260921.py
      - name: Publish only this Lane-04 batch and evidence
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/screenshot-match-preproduction
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            public/assets/catalog/lighting-9-w04-recovered-v2.jpg \
            public/assets/catalog/lighting-10-w04-recovered-v2.jpg \
            public/assets/catalog/lighting-11-w04-recovered-v2.jpg \
            public/assets/catalog/lighting-12-w04-recovered-v2.jpg \
            docs/preproduction/catalog-sprint/recovered-originals/lighting-9-12-20260921 \
            docs/preproduction/catalog-sprint/chat-lighting-recovery-9-12-result.json
          if git diff --cached --quiet; then
            echo 'Exact Lighting 9-12 bytes already staged; no new commit.'
            exit 0
          fi
          git commit -m 'catalog: stage exact recovered Lighting 9-12 replacements'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/screenshot-match-preproduction; then exit 0; fi
            git fetch origin screenshot-match-preproduction
            git rebase origin/screenshot-match-preproduction
          done
          echo 'Concurrent branch changes prevented safe publication; no force push.' >&2
          exit 1
