name: Inspect Maze World Live Static

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-maze-world-live.yml"

permissions:
  contents: read

concurrency:
  group: maze-world-live-static-inspection
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
      EXPECTED_VERSION: "133"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect exact published Maze World version
        shell: bash
        run: |
          node <<'NODE'
          const {writeFile}=await import("node:fs/promises");
          const key=String(process.env.ROBLOX_OPEN_CLOUD_API_KEY||"").trim();
          const universe=String(process.env.ROBLOX_UNIVERSE_ID||"").trim();
          const place=String(process.env.ROBLOX_PLACE_ID||"").trim();
          const expected=Number(process.env.EXPECTED_VERSION);
          if(!key) throw new Error("ROBLOX_OPEN_CLOUD_API_KEY missing");
          if(universe!=="6027194615") throw new Error("unexpected universe "+universe);
          if(place!=="17602626136") throw new Error("unexpected place "+place);

          async function parse(response,label){
            const text=await response.text();
            let payload={};
            try{payload=text?JSON.parse(text):{};}
            catch{throw new Error(label+" non-JSON "+response.status+" "+text.slice(0,1000));}
            if(!response.ok) throw new Error(label+" HTTP "+response.status+" "+JSON.stringify(payload).slice(0,1800));
            return payload;
          }

          const script=[
            'local function childNames(parent)',
            '  local rows={}',
            '  for _,child in ipairs(parent:GetChildren()) do',
            '    table.insert(rows, child.Name..":"..child.ClassName)',
            '  end',
            '  table.sort(rows)',
            '  return table.concat(rows,"|")',
            'end',
            'assert(game.PlaceVersion==' + expected + ',"expected version '+expected+' got "..tostring(game.PlaceVersion))',
            'local RS=game:GetService("ReplicatedStorage")',
            'local SSS=game:GetService("ServerScriptService")',
            'local SP=game:GetService("StarterPlayer")',
            'print("MAZE_LIVE_VERSION="..tostring(game.PlaceVersion))',
            'print("WORKSPACE_CHILDREN="..childNames(workspace))',
            'print("REPLICATEDSTORAGE_CHILDREN="..childNames(RS))',
            'print("SERVERSCRIPTSERVICE_CHILDREN="..childNames(SSS))',
            'print("STARTERPLAYER_CHILDREN="..childNames(SP))',
            'local ServerStorage=game:GetService("ServerStorage")',
            'print("SERVERSTORAGE_CHILDREN="..childNames(ServerStorage))',
            'local modules=RS:FindFirstChild("Modules")',
            'if modules then print("MODULES_CHILDREN="..childNames(modules)) else print("MODULES_CHILDREN=<missing>") end',
            'local moduleSrc=modules and modules:FindFirstChild("src")',
            'if moduleSrc then print("MODULES_SRC_CHILDREN="..childNames(moduleSrc)) else print("MODULES_SRC_CHILDREN=<missing>") end',
            'local mazeGenerator=moduleSrc and moduleSrc:FindFirstChild("MazeGenerator")',
            'print("MAZEGENERATOR_EXISTS="..tostring(mazeGenerator~=nil))',
            'if mazeGenerator and mazeGenerator:IsA("LuaSourceContainer") then',
            '  print("MAZEGENERATOR_HAS_RS_MODELS_REF="..tostring(string.find(mazeGenerator.Source,"WaitForChild(\\\'Models\\\')",1,true)~=nil or string.find(mazeGenerator.Source,"WaitForChild(\\\"Models\\\")",1,true)~=nil))',
            '  print("MAZEGENERATOR_HAS_SERVERSTORAGE_REF="..tostring(string.find(mazeGenerator.Source,"ServerStorage",1,true)~=nil))',
            'end',
            'local thunks=moduleSrc and moduleSrc:FindFirstChild("thunks")',
            'local startGame=thunks and thunks:FindFirstChild("startGame")',
            'print("STARTGAME_EXISTS="..tostring(startGame~=nil))',
            'if startGame and startGame:IsA("LuaSourceContainer") then',
            '  print("STARTGAME_HAS_LOCATIONPART_REF="..tostring(string.find(startGame.Source,"LocationPart",1,true)~=nil))',
            '  print("STARTGAME_HAS_MAZE_GENERATE_REF="..tostring(string.find(startGame.Source,"MazeGenerator:generate",1,true)~=nil))',
            'end',
            'local models=RS:FindFirstChild("Models")',
            'print("REPLICATEDSTORAGE_MODELS="..tostring(models~=nil))',
            'local modelPaths={}',
            'for _,d in ipairs(game:GetDescendants()) do if d.Name=="Models" then table.insert(modelPaths,d:GetFullName()..":"..d.ClassName) end end',
            'table.sort(modelPaths)',
            'print("ALL_MODELS_PATHS="..table.concat(modelPaths,"|"))',
            'local serverSrc=SSS:FindFirstChild("serverSrc")',
            'if serverSrc and serverSrc:IsA("LuaSourceContainer") then',
            '  print("SERVERSRC_HAS_MODELS_REF="..tostring(string.find(serverSrc.Source,"Models",1,true)~=nil))',
            '  print("SERVERSRC_HAS_TAGITEM_REF="..tostring(string.find(serverSrc.Source,"TagItem",1,true)~=nil))',
            'end',
            'local starterScripts=SP:FindFirstChild("StarterPlayerScripts")',
            'if starterScripts then print("STARTERPLAYERSCRIPTS_CHILDREN="..childNames(starterScripts)) end',
            'local placeObj=workspace:FindFirstChild("Place")',
            'if placeObj then print("PLACE_CHILDREN="..childNames(placeObj)) else print("PLACE_CHILDREN=<missing>") end',
            'local rooms=placeObj and placeObj:FindFirstChild("Rooms")',
            'if rooms then print("ROOMS_CHILDREN="..childNames(rooms)) else print("ROOMS_CHILDREN=<missing>") end',
            'local maps=placeObj and placeObj:FindFirstChild("Maps")',
            'if maps then print("MAPS_CHILDREN="..childNames(maps)) else print("MAPS_CHILDREN=<missing>") end',
            'local easyMap=maps and maps:FindFirstChild("EasyBlocks")',
            'print("EASYMAP_LOCATIONPART="..tostring(easyMap and easyMap:FindFirstChild("LocationPart")~=nil))',
            'local locationPaths={}',
            'if maps then for _,d in ipairs(maps:GetDescendants()) do if d.Name=="LocationPart" then table.insert(locationPaths,d:GetFullName()) end end end',
            'table.sort(locationPaths)',
            'print("MAP_LOCATIONPART_PATHS="..table.concat(locationPaths,"|"))',
            'print("SERVERSTORAGE_HAS_MONEY="..tostring(ServerStorage:FindFirstChild("Money")~=nil))',
            'print("SERVERSTORAGE_HAS_PREFABS="..tostring(ServerStorage:FindFirstChild("Prefabs")~=nil))',
            'local easyRoom=rooms and rooms:FindFirstChild("EasyBlocks")',
            'print("EASYROOM_PLACEHOLDERS="..tostring(easyRoom and easyRoom:FindFirstChild("placeholders")~=nil))',
            'local CollectionService=game:GetService("CollectionService")',
            'local moneyFolder=ServerStorage:FindFirstChild("Money")',
            'local coinIds={}',
            'if moneyFolder then',
            '  for _,d in ipairs(moneyFolder:GetDescendants()) do',
            '    if d:IsA("BasePart") and CollectionService:HasTag(d,"CoinBrick") then',
            '      local id=d:FindFirstChild("itemId")',
            '      table.insert(coinIds,tostring(id and id.Value or "missing"))',
            '    end',
            '  end',
            'end',
            'table.sort(coinIds)',
            'print("LIVE_NATIVE_COIN_IDS="..table.concat(coinIds,"|"))',
            'assert(#coinIds>=1,"no native CoinBrick assets found in ServerStorage.Money")',
            'local sourceLines=string.split(mazeGenerator.Source,"\\n")',
            'for lineNumber=117,180 do print("MAZEGENERATOR_LINE_"..tostring(lineNumber).."="..tostring(sourceLines[lineNumber])) end',
            'local requireOk, MazeGenerator=pcall(require,mazeGenerator)',
            'print("MAZEGENERATOR_REQUIRE_OK="..tostring(requireOk))',
            'assert(requireOk,"MazeGenerator require failed: "..tostring(MazeGenerator))',
            'local holder=Instance.new("Part")',
            'holder.Name="_MazeWorldHeadlessSmoke"',
            'holder.Anchored=true',
            'holder.Size=Vector3.new(4,1,4)',
            'holder.CFrame=CFrame.new(50000,1000,50000)',
            'holder.Parent=workspace',
            'local smokeSettings={width=3,height=3,wallMaterial=Enum.Material.Grass,groundMaterial=Enum.Material.Sand,onlyBlocks=true,addRandomModels=false,addStartAndFinish=true,addKillBlocks=false,addCeiling=false,partThickness=3,ceilingFloorThickness=1,location=holder,blockHeight=20,blockWidth=25,randomStuffFolder="Light"}',
            'local generateOk,generateErr=pcall(function() MazeGenerator:generate(smokeSettings) end)',
            'print("MAZEGENERATOR_GENERATE_OK="..tostring(generateOk))',
            'if not generateOk then print("MAZEGENERATOR_GENERATE_ERROR="..tostring(generateErr)) end',
            'if not generateOk then print("MAZEGENERATOR_SMOKE_DIAGNOSTIC_ONLY=true") end',
            'local smokeMaze=holder:FindFirstChild("Maze")',
            'local smokeSpawn=smokeMaze and smokeMaze:FindFirstChild("SpawnPlaceholder",true)',
            'local smokeFinish=smokeMaze and smokeMaze:FindFirstChild("FinishPlaceholder",true)',
            'print("HEADLESS_MAZE_FOLDER="..tostring(smokeMaze~=nil))',
            'print("HEADLESS_MAZE_SPAWN="..tostring(smokeSpawn~=nil))',
            'print("HEADLESS_MAZE_FINISH="..tostring(smokeFinish~=nil))',
            'assert(smokeMaze and smokeSpawn and smokeFinish,"ephemeral Maze World start/finish structure incomplete")',
            'holder:Destroy()',
            'local startLines=startGame and startGame:IsA("LuaSourceContainer") and string.split(startGame.Source,"\\n") or {}',
            'for lineNumber,lineText in ipairs(startLines) do if string.find(lineText,"MazeGenerator:generate",1,true) then for j=math.max(1,lineNumber-8),math.min(#startLines,lineNumber+8) do print("STARTGAME_LINE_"..tostring(j).."="..tostring(startLines[j])) end end end',
            'local startRequireOk,startThunk=pcall(require,startGame)',
            'print("STARTGAME_REQUIRE_OK="..tostring(startRequireOk))',
            'if not startRequireOk then print("STARTGAME_REQUIRE_ERROR="..tostring(startThunk)) end',
            'print("MAZE_WORLD_HEADLESS_RUNTIME_OK version="..tostring(game.PlaceVersion))',
            'print("MAZE_WORLD_STATIC_INSPECTION_OK version="..tostring(game.PlaceVersion))'
          ].join("\n");

          let response;
          for(let attempt=0;attempt<8;attempt++){
            response=await fetch(
              `https://apis.roblox.com/cloud/v2/universes/${universe}/places/${place}/versions/${expected}/luau-execution-session-tasks`,
              {
                method:"POST",
                headers:{"x-api-key":key,"content-type":"application/json"},
                body:JSON.stringify({script,timeout:"30s"})
              }
            );
            if(response.status!==429 && response.status!==500) break;
            await new Promise(resolve=>setTimeout(resolve,2000*(attempt+1)));
          }

          let task=await parse(response,"create inspection task");
          await writeFile("maze-world-live-inspection-task.json",JSON.stringify(task,null,2)+"\n");
          const raw=String(task.path||"");
          if(!raw) throw new Error("task returned no path");
          const url="https://apis.roblox.com/cloud/v2/"+raw
            .replace(/^https:\/\/apis\.roblox\.com\/cloud\/v2\//,"")
            .replace(/^\/?cloud\/v2\//,"")
            .replace(/^\//,"");

          while(String(task.state||"")==="PROCESSING"){
            await new Promise(resolve=>setTimeout(resolve,1000));
            task=await parse(await fetch(url,{headers:{"x-api-key":key}}),"inspection status");
          }

          const logs=await parse(await fetch(url+"/logs",{headers:{"x-api-key":key}}),"inspection logs");
          await writeFile("maze-world-live-inspection-logs.json",JSON.stringify(logs,null,2)+"\n");
          const logText=JSON.stringify(logs);
          console.log(logText);
          if(task.error||/FAIL|ERROR|CANCEL/i.test(String(task.state||""))){
            throw new Error("inspection task failed "+JSON.stringify(task).slice(0,2000));
          }
          if(!logText.includes("MAZE_WORLD_STATIC_INSPECTION_OK version="+expected)){
            throw new Error("inspection sentinel missing "+logText.slice(0,4000));
          }
          console.log("MAZE_WORLD_STATIC_INSPECTION_PASS version="+expected);
          NODE

      - name: Upload inspection receipt
        uses: actions/upload-artifact@v4
        with:
          name: maze-world-live-static-inspection
          path: |
            maze-world-live-inspection-task.json
            maze-world-live-inspection-logs.json
          if-no-files-found: error
          retention-days: 30
