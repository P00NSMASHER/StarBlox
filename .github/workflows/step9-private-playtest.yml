name: StarBlox Step 9 Private Playtest

on:
  push:
    branches:
      - release/step9-joinfix2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starblox-step9-private-playtest
  cancel-in-progress: true

jobs:
  private-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pinned Roblox toolchain
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0
          path: .

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned Roblox runtime packages
        run: |
          cd roblox
          wally install
          test -e Packages/Matter
          test -e ServerPackages/ProfileStore

      - name: Prove packaged native Roblox build
        run: node scripts/verify-roblox-native-build.mjs

      - name: Run Step 9 regression tests
        run: |
          npx vitest run             src/robloxRuntime/productionServerBootProof.test.js             src/robloxRuntime/realClientPlaytestProof.test.js             src/robloxRuntime/coreLoopProof.test.js             src/robloxRuntime/verticalSliceProof.test.js

      - name: Publish private Step 9 joinability fix
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
          STARBLOX_SOURCE_COMMIT: ${{ github.sha }}
          STARBLOX_PUBLISH_RECEIPT: ${{ github.workspace }}/artifacts/starblox-step9-joinfix-receipt.json
        run: node scripts/publish-private-starblox.mjs

      - name: Prove packaged production server boot
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: node scripts/verify-roblox-production-server-boot.mjs

      - name: Verify real touch-client playtest
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: node scripts/verify-roblox-real-client-playtest.mjs

      - name: Upload private publish receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starblox-step9-joinfix-receipt
          path: artifacts/starblox-step9-joinfix-receipt.json
          if-no-files-found: ignore
          retention-days: 30
