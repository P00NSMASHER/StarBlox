name: StarBlox Lane 13 Scene Intake

on:
  push:
    branches: [screenshot-match-preproduction]
    paths: [.github/workflows/lane13-scene-intake.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starblox-lane13-scene-intake
  cancel-in-progress: false

jobs:
  stage-home-scene:
    if: github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FULL_URL: https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:c8bfba96-b6bf-4727-bb4f-f133ee181779
      OPT_URL: https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:237808dc-46db-48e0-97d8-c073d73b2803
      FULL_PATH: public/assets/visuals/lane-13/home-bedroom-w13-v1-full.png
      OPT_PATH: public/assets/visuals/lane-13/home-bedroom-w13-v1-1408x1056.png
    steps:
      - name: Checkout preproduction only
        uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0

      - name: Record inspected source head
        run: echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download exact generated scene outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FULL_PATH")" docs/preproduction/visuals
          curl -L --fail --retry 2 --connect-timeout 20 --max-time 120 "$FULL_URL" -o "$FULL_PATH"
          curl -L --fail --retry 2 --connect-timeout 20 --max-time 120 "$OPT_URL" -o "$OPT_PATH"

      - name: Verify exact PNG dimensions and create hash-bound lane evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, struct
          from datetime import datetime, timezone
          from pathlib import Path

          expected = {
              os.environ['FULL_PATH']: (2304, 1792),
              os.environ['OPT_PATH']: (1408, 1056),
          }
          assets = []
          for name, dims in expected.items():
              p = Path(name)
              data = p.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: downloaded bytes are not PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != dims:
                  raise SystemExit(f'{name}: expected {dims}, got {(width, height)}')
              assets.append({
                  'path': name,
                  'format': 'PNG',
                  'dimensions': [width, height],
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })

          report = {
              'schemaVersion': 1,
              'workstream': '13',
              'focus': 'SCENE_CHARACTER_ART',
              'status': 'READY_FOR_REVIEW',
              'branch': 'screenshot-match-preproduction',
              'sourceHeadBeforeAssetCommit': os.environ['SOURCE_HEAD'],
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'candidateId': 'home-bedroom-w13-v1',
              'candidateType': 'environment-background',
              'targetScreen': 'Home',
              'observedDefect': {
                  'runningRenderEvidence': {
                      'workflowRunId': 35663655650,
                      'artifactId': 10668287632,
                      'renderHead': 'b187186e62519ffa77bd0f7b166c601c90bdc416',
                      'file': 'home-desktop-1408x1056.png'
                  },
                  'finding': 'The current Home geometry is contract-green, but the visible environment remains a flatter high-detail vector treatment while the original reference has stronger volumetric depth, tactile materials, contact/cast lighting and cinematic room realism. Workstream 09 explicitly records that its current scene is SVG/vector and that a raster/3D pass may be needed.',
                  'scopeDecision': 'Stage a separate versioned raster environment candidate only. Do not replace or edit Workstream 09 active SVG URLs and do not touch Workstream 06 avatar implementation.'
              },
              'reference': {
                  'originalPath': 'docs/preproduction/reference-screenshots/originals/home-1448x1086.jpeg',
                  'originalSha256': '6a4b110aeaf12a6ab0c629f9181cc6cfa8d4f55a518d4f2a6adb3ac6e756c457',
                  'comparisonPath': 'docs/preproduction/reference-screenshots/home-desktop-1408x1056.png',
                  'pixelParityClaimed': False
              },
              'provenance': {
                  'generator': 'Adobe Firefly image_generate',
                  'generationRequestId': '8cd09402-ff64-41ab-ad5f-f0a638662548',
                  'fireflyAssetId': 'urn:aaid:sc:US:ec85f76f-eb61-49b8-acc4-950972ab07c3',
                  'optimizedDerivative': 'Adobe image_crop_and_resize',
                  'cropRequestId': 'b929fd71-ae94-4820-b007-7d4a4c56e6fd',
                  'creativeConstraints': [
                      'original StarBlox environment only',
                      'no character baked into background',
                      'no UI/text/buttons/logos in background',
                      'clear center foreground for separate avatar',
                      'calm top-center and right-edge overlay zones',
                      'warm pink/lilac bedroom with dimensional materials and lighting'
                  ]
              },
              'assets': assets,
              'visualInspection': {
                  'status': 'PASS_PRODUCER_INSPECTION_ONLY',
                  'notes': [
                      'No person/character or interface text is present.',
                      'Center foreground remains open for a separately composited avatar.',
                      'Bed-left / desk-right composition follows the reference hierarchy without copying its UI.',
                      'Scene has materially stronger volumetric light, depth and tactile furniture response than the current vector background.',
                      'Independent art/composition review is still required.'
                  ]
              },
              'integration': {
                  'runtimeWired': False,
                  'canonicalCatalogTouched': False,
                  'workstream06AvatarTouched': False,
                  'workstream09ActiveEnvironmentTouched': False,
                  'deploymentTouched': False,
                  'mainTouched': False
              },
              'reviewHandoff': {
                  '01': 'Independently judge the exact candidate pixels for art-direction fit and originality.',
                  '14': 'Independently judge Home composition, overlay-safe zones, performance/format and real-browser suitability before any wiring.',
                  '15': 'Coordinate any approved environment handoff to Workstream 09; no runtime integration is authorized by this candidate.'
              }
          }
          out = Path('docs/preproduction/visuals/lane-13.json')
          out.write_text(json.dumps(report, indent=2) + '\n')

          md = f"""# Workstream 13 — Scene / Character Art\n\nSTATUS: **READY_FOR_REVIEW — Home dimensional environment candidate staged; not runtime-wired**\n\n## Concrete visual defect\n\nCompared the actual Home render from workflow `35663655650` / artifact `10668287632` at runtime head `b187186e62519ffa77bd0f7b166c601c90bdc416` against the immutable original Home reference (`6a4b110a…`). Home geometry is already contract-green, but the running room remains visibly flatter/vector-like than the reference: weaker volumetric depth, tactile material response and cast/contact lighting. Workstream 09 independently records that its current environment pass is SVG/vector and may need a raster/3D realism pass.\n\n## Candidate\n\n- ID: `home-bedroom-w13-v1`\n- Full-quality: `{assets[0]['path']}` — {assets[0]['dimensions'][0]}×{assets[0]['dimensions'][1]}, {assets[0]['bytes']} bytes, SHA-256 `{assets[0]['sha256']}`\n- Desktop derivative: `{assets[1]['path']}` — {assets[1]['dimensions'][0]}×{assets[1]['dimensions'][1]}, {assets[1]['bytes']} bytes, SHA-256 `{assets[1]['sha256']}`\n- Provenance: Adobe Firefly generation request `8cd09402-ff64-41ab-ad5f-f0a638662548`; Adobe crop request `b929fd71-ae94-4820-b007-7d4a4c56e6fd`.\n- Original reference remains unchanged at `docs/preproduction/reference-screenshots/originals/home-1448x1086.jpeg`. No pixel-parity claim.\n\n## Scope safety\n\nThis is a separate candidate asset. It does **not** modify Workstream 09's active `brightside-bedroom.svg`, Workstream 06 avatar code/assets, catalog manifest/runtime mappings, saves/economy/learning, Replit, or `main`. No character, text, buttons or HUD elements are baked into the room background.\n\n## Review handoff\n\n- **01:** independent exact-pixel art-direction/originality decision.\n- **14:** independent composition, overlay-safe-zone, format/performance and real-browser suitability review.\n- **15:** only after independent acceptance, coordinate a handoff to 09 for any runtime wiring.\n\nDo not self-approve or wire this candidate from Workstream 13.\n"""
          Path('docs/preproduction/visuals/lane-13.md').write_text(md)
          PY

          git_hash_full=$(git hash-object "$FULL_PATH")
          git_hash_opt=$(git hash-object "$OPT_PATH")
          python3 - "$git_hash_full" "$git_hash_opt" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path('docs/preproduction/visuals/lane-13.json')
          d = json.loads(p.read_text())
          d['assets'][0]['gitBlobSha'] = sys.argv[1]
          d['assets'][1]['gitBlobSha'] = sys.argv[2]
          p.write_text(json.dumps(d, indent=2) + '\n')
          PY

      - name: Commit candidate and self-remove one-shot intake workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$FULL_PATH" "$OPT_PATH" docs/preproduction/visuals/lane-13.json docs/preproduction/visuals/lane-13.md
          git rm -- .github/workflows/lane13-scene-intake.yml
          git commit -m 'visuals: stage dimensional Home scene candidate for independent review'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/screenshot-match-preproduction; then
              echo "ASSET_COMMIT=$(git rev-parse HEAD)"
              exit 0
            fi
            git fetch origin screenshot-match-preproduction
            git rebase origin/screenshot-match-preproduction
          done
          echo 'Concurrent branch changes prevented safe publication; no force push.' >&2
          exit 1
