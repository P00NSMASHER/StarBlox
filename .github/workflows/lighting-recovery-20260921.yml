name: StarBlox Lighting 5-8 Byte Recovery

on:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - '.github/workflows/lighting-recovery-20260921.yml'
      - 'scripts/verifyLightingRecovery20260921.mjs'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: starblox-lighting-recovery-20260921
  cancel-in-progress: false

jobs:
  verify-stored-lighting:
    if: github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify existing bytes only without downloading or regenerating
        run: |
          test -f docs/preproduction/catalog-sprint/chat-lighting-recovery-result.json
          echo "TESTED_SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/importLightingRecovery20260921.py
      - name: Install unchanged app and isolated browser QA dependencies
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute full regression suite on this coherent candidate
        id: tests
        continue-on-error: true
        run: timeout 120s npm test -- --reporter=verbose
      - name: Build current application
        id: build
        continue-on-error: true
        run: npm run build
      - name: Render exact four stored images without loading the Vite source entrypoint
        id: render
        continue-on-error: true
        run: node scripts/verifyLightingRecovery20260921.mjs
      - name: Record isolated proof without erasing shared-fixture failure
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('docs/preproduction/catalog-sprint/chat-lighting-recovery-result.json')
          if not p.exists(): raise SystemExit('Missing stored intake; no success report')
          r=json.loads(p.read_text())
          r.setdefault('sharedFixtureFailure', {'workflowRunId':35665398592,'jobId':106549924161,'artifactId':10669425873,'status':'FAIL','reason':'Repository-root navigation loaded raw Vite main.jsx with the wrong MIME type; unrelated staged Desk 2–4 images were also fully transparent. No errors or blank-asset assertions were suppressed.','owner':'14 shared fixture; 03 desk candidates'})
          def state(key): return {'success':'PASS','failure':'FAIL','skipped':'NOT_RUN','cancelled':'CANCELLED'}.get(os.environ[key],'NOT_RUN')
          proof=Path('artifacts/lighting-recovery-isolated/report.json')
          executed=json.loads(proof.read_text()) if proof.exists() else {'status':'NOT_RUN','items':[]}
          r['isolatedVerification']={'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'testedSourceHead':os.environ['TESTED_SOURCE_HEAD'],'tests':state('TEST_OUTCOME'),'build':state('BUILD_OUTCOME'),'render':state('RENDER_OUTCOME'),'scope':'Only the exact four recovered Lighting images; not a whole-catalog or canonical Store acceptance','artifactName':'lighting-5-8-isolated-render-evidence','proof':executed}
          r['checks']['batchCardDetailRender']=executed['status']
          r['checks']['sharedCatalogFixture']='FAIL_RECORDED_SEPARATELY_NOT_RETESTED'
          r['independentVisualReview']='PENDING_WORKSTREAM_14_NOT_SELF_APPROVED'
          r['canonicalPromotionsThisIntake']=0
          p.write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r['isolatedVerification'],indent=2))
          PY
      - name: Preserve only this batch evidence on preproduction
        if: always()
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/screenshot-match-preproduction
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/preproduction/catalog-sprint/chat-lighting-recovery-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa: record isolated Lighting 5–8 rendering while retaining shared-fixture failure'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/screenshot-match-preproduction; then exit 0; fi
            git fetch origin screenshot-match-preproduction
            git rebase origin/screenshot-match-preproduction
          done
          echo 'Concurrent changes prevented safe evidence publication; no force push' >&2
          exit 1
      - name: Retain actual card and detail screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighting-5-8-isolated-render-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/lighting-recovery-isolated
            docs/preproduction/catalog-sprint/chat-lighting-recovery-result.json
      - name: Fail honestly if any scoped check did not pass
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: test "$TEST_OUTCOME" = success && test "$BUILD_OUTCOME" = success && test "$RENDER_OUTCOME" = success
