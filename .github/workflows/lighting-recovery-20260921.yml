name: StarBlox Lighting 5-8 Byte Recovery

on:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - '.github/workflows/lighting-recovery-20260921.yml'
      - 'scripts/importLightingRecovery20260921.py'
      - 'docs/preproduction/catalog-sprint/chat-lighting-recovery-20260921.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starblox-lighting-recovery-20260921
  cancel-in-progress: false

jobs:
  recover-existing-art:
    if: github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image-decoding verifier only
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Recover four existing image generations without modifying their pixels
        id: intake
        run: |
          python3 -m py_compile scripts/importLightingRecovery20260921.py
          python3 scripts/importLightingRecovery20260921.py
          python3 scripts/importLightingRecovery20260921.py
      - name: Publish only candidate bytes, retained originals and intake report
        id: publish
        run: |
          set -eu
          test "$GITHUB_REF" = 'refs/heads/screenshot-match-preproduction'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/assets/catalog/lighting-5-w04-recovered-v2.jpg public/assets/catalog/lighting-6-w04-recovered-v2.jpg public/assets/catalog/lighting-7-w04-recovered-v2.jpg public/assets/catalog/lighting-8-w04-recovered-v2.jpg docs/preproduction/catalog-sprint/recovered-originals/lighting-5-8-20260921 docs/preproduction/catalog-sprint/chat-lighting-recovery-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'catalog: stage four recovered lane-04 Lighting images and preserved source bytes'
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/screenshot-match-preproduction; then break; fi
              git fetch origin screenshot-match-preproduction
              git rebase origin/screenshot-match-preproduction
              if [ "$attempt" -eq 3 ]; then echo 'Safe publication blocked by concurrent changes; no force push' >&2; exit 1; fi
            done
          fi
          echo "TESTED_SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install existing game dependencies without metadata changes
        run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: Run existing regression suite including catalog mapping guards
        id: tests
        continue-on-error: true
        run: timeout 120s npm test -- --reporter=verbose
      - name: Build the actual preproduction application
        id: build
        continue-on-error: true
        run: npm run build
      - name: Install existing staged-art browser tooling
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render candidate contact sheets and details using the existing fixture
        id: render
        continue-on-error: true
        run: |
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory . > /tmp/starblox-lighting-recovery.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/public/assets/catalog/lighting-5-w04-recovered-v2.jpg >/dev/null; then break; fi
            sleep 0.5
          done
          node scripts/catalog-staged-art-qa.mjs
        env:
          GITHUB_SHA: ${{ env.TESTED_SOURCE_HEAD }}
      - name: Record actually executed checks, including failures
        if: always() && steps.publish.outcome == 'success'
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('docs/preproduction/catalog-sprint/chat-lighting-recovery-result.json')
          r=json.loads(p.read_text())
          def state(value):
              return {'success':'PASS','failure':'FAIL','skipped':'NOT_RUN','cancelled':'CANCELLED'}.get(value,'NOT_RUN')
          r['testedSourceHead']=os.environ['TESTED_SOURCE_HEAD']
          r['workflowRunId']=int(os.environ['GITHUB_RUN_ID'])
          r['checks'].update({'repeatBehavior':'PASS_SECOND_RUN_NO_DOWNLOAD_OR_REGENERATION','tests':state(os.environ['TEST_OUTCOME']),'build':state(os.environ['BUILD_OUTCOME']),'render':state(os.environ['RENDER_OUTCOME']),'typecheck':'NOT_APPLICABLE_NO_TYPESCRIPT_APP_CHANGES'})
          render=Path('artifacts/catalog-staged-art/report.json')
          if render.exists():
              evidence=json.loads(render.read_text())
              wanted={i['id']:i['gitBlobSha'] for i in r['items']}
              matches=[i for s in evidence.get('sets',{}).values() for i in s.get('items',[]) if wanted.get(i.get('id'))==i.get('blobSha')]
              seen={i['id'] for i in matches if i.get('screenshot') and i.get('status')==200 and not i.get('errors')}
              r['checks']['batchCardDetailRender']='PASS_4_OF_4' if len(seen)==4 else 'INCOMPLETE_'+str(len(seen))+'_OF_4'
              r['renderEvidence']={'artifactName':'lighting-5-8-recovery-evidence','reportPath':'artifacts/catalog-staged-art/report.json','matchedIds':sorted(seen),'matchedHashes':{i:wanted[i] for i in sorted(seen)}}
          r['independentVisualReview']='PENDING_WORKSTREAM_14_NOT_SELF_APPROVED'
          r['status']='STAGED_READY_FOR_INDEPENDENT_REVIEW'
          p.write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps({'items':[(i['id'],i['repositoryPath'],i['gitBlobSha']) for i in r['items']],'checks':r['checks']},indent=2))
          PY
      - name: Publish only executed-check evidence with safe concurrency handling
        if: always() && steps.publish.outcome == 'success'
        run: |
          set -eu
          git add -- docs/preproduction/catalog-sprint/chat-lighting-recovery-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'catalog: record exact Lighting recovery readback, tests, build and render evidence'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/screenshot-match-preproduction; then exit 0; fi
            git fetch origin screenshot-match-preproduction
            git rebase origin/screenshot-match-preproduction
          done
          echo 'Evidence publication blocked; artifact remains, no force push' >&2
          exit 1
      - name: Retain source bytes, candidates and real render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighting-5-8-recovery-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            docs/preproduction/catalog-sprint/chat-lighting-recovery-result.json
            docs/preproduction/catalog-sprint/recovered-originals/lighting-5-8-20260921
            public/assets/catalog/lighting-5-w04-recovered-v2.jpg
            public/assets/catalog/lighting-6-w04-recovered-v2.jpg
            public/assets/catalog/lighting-7-w04-recovered-v2.jpg
            public/assets/catalog/lighting-8-w04-recovered-v2.jpg
            artifacts/catalog-staged-art
      - name: Do not hide failed regression, build or render checks
        if: always() && steps.publish.outcome == 'success'
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: test "$TEST_OUTCOME" = success && test "$BUILD_OUTCOME" = success && test "$RENDER_OUTCOME" = success
