name: StarBlox Cloudflare Pages Artifact

on:
  push:
    branches:
      - cloudflare-pages-deploy-prep
  workflow_dispatch:

jobs:
  build-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test -- --reporter=verbose
      - name: Build production bundle
        run: npm run build
      - name: Write release identity
        run: |
          printf '%s\\n' "$GITHUB_SHA" > dist/RELEASE_SHA.txt
          printf '%s\\n' 'demo-release-candidate-2026-09-25' > dist/RELEASE_SOURCE.txt
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: starblox-cloudflare-pages-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
