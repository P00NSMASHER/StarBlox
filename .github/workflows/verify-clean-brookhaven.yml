name: Verify Clean Brookhaven Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-clean-brookhaven.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify published v47 avatar shop learning loop
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const key=process.env.ROBLOX_OPEN_CLOUD_API_KEY;
          const universe=process.env.ROBLOX_UNIVERSE_ID;
          const place=process.env.ROBLOX_PLACE_ID;
          if(!key) throw new Error("missing API key");
          if(universe!=="6027194615"||place!=="17602626136") throw new Error("unexpected target");
          const script=[
            'assert(game.PlaceVersion == 47, "expected version 47")',
            'local Workspace=game:GetService("Workspace")',
            'local StarterPlayer=game:GetService("StarterPlayer")',
            'local StarterGui=game:GetService("StarterGui")',
            'local ServerScriptService=game:GetService("ServerScriptService")',
            'local descendants=#Workspace:GetDescendants()',
            'assert(descendants == 24348, "Brookhaven workspace changed: "..tostring(descendants))',
            'local geometry=0',
            'for _,x in ipairs(Workspace:GetDescendants()) do local c=x.ClassName; if c=="Part" or c=="MeshPart" or c=="WedgePart" or c=="CornerWedgePart" or c=="UnionOperation" or c=="TrussPart" or c=="Seat" or c=="VehicleSeat" then geometry += 1 end end',
            'assert(geometry == 14459, "Brookhaven geometry changed: "..tostring(geometry))',
            'local editor=StarterGui:WaitForChild("NoResetGUIHandler"):FindFirstChild("MainEditor")',
            'assert(editor and editor.Catalog.Container.ScaleFrame.Buttons:FindFirstChild("Bigger"), "avatar editor controls missing")',
            'assert(editor.Catalog.Container:FindFirstChild("OutfitFrame"), "avatar outfit frame missing")',
            'local shop=StarterGui:WaitForChild("MainGUIHandler"):FindFirstChild("Shop")',
            'assert(shop and shop.OpenButton.MainOpen:FindFirstChild("Open"), "original Brookhaven shop missing")',
            'local client=StarterPlayer:WaitForChild("StarterPlayerScripts"):FindFirstChild("BrookhavenCompat")',
            'assert(client and client:IsA("LocalScript"), "compat client missing")',
            'assert(string.find(client.Source,"STARBLOX_AVATAR_SHOP_CLIENT_READY",1,true),"avatar/shop client marker missing")',
            'assert(string.find(client.Source,"PurchasePack",1,true),"client PurchasePack binding missing")',
            'assert(string.find(client.Source,"GetPracticeQuestion",1,true),"client practice binding missing")',
            'local server=ServerScriptService:FindFirstChild("BrookhavenHouseCompat")',
            'assert(server and server:IsA("Script"), "compat server missing")',
            'assert(string.find(server.Source,"STARBLOX_LEARNING_ECONOMY_READY",1,true),"learning economy marker missing")',
            'assert(string.find(server.Source,"PurchasePack",1,true),"purchase authority missing")',
            'assert(string.find(server.Source,"GetPracticeQuestion",1,true),"practice question authority missing")',
            'assert(string.find(server.Source,"SubmitPracticeAnswer",1,true),"practice answer authority missing")',
            'assert(string.find(server.Source,"StarBloxLearningReward",1,true),"server-only school reward hook missing")',
            'assert(string.find(server.Source,"SilverPass",1,true),"premium Brookhaven pass integration missing")',
            'assert(string.find(server.Source,"MusicPass",1,true),"music Brookhaven pass integration missing")',
            'assert(string.find(server.Source,"ColorSpeedPassLower",1,true),"vehicle Brookhaven pass integration missing")',
            'assert(string.find(server.Source,"FirePass",1,true),"fire Brookhaven pass integration missing")',
            'assert(string.find(server.Source,"HorsePass",1,true),"horse Brookhaven pass integration missing")',
            'assert(string.find(server.Source,"SpeedPass200",1,true),"speed Brookhaven pass integration missing")',
            'local lots=Workspace:FindFirstChild("001_Lots")',
            'local buyLots=0; local preloaded=0',
            'for _,lot in ipairs(lots:GetChildren()) do local buy=lot:FindFirstChild("BuyHouse",true); if buy and buy:IsA("BasePart") then buyLots+=1; local h=lot:FindFirstChild("HousePickedByPlayer"); if h and h:IsA("Model") then preloaded+=1 end end end',
            'assert(buyLots==19 and preloaded==5,"house baseline changed")',
            'print("STARBLOX_V47_AVATAR_SHOP_OK version="..tostring(game.PlaceVersion).." descendants="..tostring(descendants).." geometry="..tostring(geometry).." lots="..tostring(buyLots).." preloaded="..tostring(preloaded))'
          ].join("\n");
          async function parse(r,label){
            const text=await r.text(); let payload={};
            try{payload=text?JSON.parse(text):{};}catch{throw new Error(label+" non-JSON "+r.status);}
            if(!r.ok) throw new Error(label+" "+r.status+" "+JSON.stringify(payload).slice(0,1500));
            return payload;
          }
          let response;
          for(let attempt=0;attempt<8;attempt++){
            response=await fetch(`https://apis.roblox.com/cloud/v2/universes/${universe}/places/${place}/luau-execution-session-tasks`,{method:"POST",headers:{"x-api-key":key,"content-type":"application/json"},body:JSON.stringify({script,timeout:"30s"})});
            if(response.status!==429 && response.status!==500) break;
            await new Promise(r=>setTimeout(r,2500*(attempt+1)));
          }
          let task=await parse(response,"create");
          const raw=String(task.path||"");
          if(!raw) throw new Error("missing task path");
          const url="https://apis.roblox.com/cloud/v2/"+raw.replace(/^https:\/\/apis\.roblox\.com\/cloud\/v2\//,"").replace(/^\/?cloud\/v2\//,"").replace(/^\//,"");
          const deadline=Date.now()+90000;
          while(String(task.state||"")==="PROCESSING"){
            if(Date.now()>deadline) throw new Error("verification timeout");
            await new Promise(r=>setTimeout(r,1000));
            task=await parse(await fetch(url,{headers:{"x-api-key":key}}),"status");
          }
          const logs=await parse(await fetch(url+"/logs",{headers:{"x-api-key":key}}),"logs");
          const text=JSON.stringify(logs);
          if(task.error||/FAIL|ERROR|CANCEL/i.test(String(task.state||""))) throw new Error("task failed "+JSON.stringify(task).slice(0,2000));
          if(!text.includes("STARBLOX_V47_AVATAR_SHOP_OK")) throw new Error("v47 sentinel missing");
          console.log(text);
          NODE
