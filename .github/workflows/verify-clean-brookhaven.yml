name: Verify Clean Brookhaven Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-clean-brookhaven.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify published v41 compatibility repair
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const key=process.env.ROBLOX_OPEN_CLOUD_API_KEY;
          const universe=process.env.ROBLOX_UNIVERSE_ID;
          const place=process.env.ROBLOX_PLACE_ID;
          if(!key) throw new Error("missing API key");
          if(universe!=="6027194615"||place!=="17602626136") throw new Error("unexpected target");

          const script = [
            'assert(game.PlaceVersion == 41, "expected version 41")',
            'local Workspace=game:GetService("Workspace")',
            'local StarterPlayer=game:GetService("StarterPlayer")',
            'local StarterGui=game:GetService("StarterGui")',
            'local ServerScriptService=game:GetService("ServerScriptService")',
            'local descendants=#Workspace:GetDescendants()',
            'assert(descendants > 20000, "Brookhaven world scale regressed")',
            'local client=StarterPlayer:WaitForChild("StarterPlayerScripts"):FindFirstChild("BrookhavenCompat")',
            'assert(client and client:IsA("LocalScript"), "BrookhavenCompat LocalScript missing")',
            'assert(string.find(client.Source, "BROOKHAVEN_COMPAT_CLIENT_READY", 1, true), "client compatibility source mismatch")',
            'local server=ServerScriptService:FindFirstChild("BrookhavenHouseCompat")',
            'assert(server and server:IsA("Script"), "BrookhavenHouseCompat server Script missing")',
            'assert(string.find(server.Source, "BROOKHAVEN_COMPAT_HOUSE_READY", 1, true), "house compatibility source mismatch")',
            'local handler=StarterGui:FindFirstChild("PlayerHandler")',
            'assert(handler and handler:IsA("LocalScript"), "original PlayerHandler missing")',
            'assert(string.find(handler.Source, "pcall(function() l__PlayerGui__4:SetTopbarTransparency", 1, true), "PlayerHandler topbar guard missing")',
            'local lots=Workspace:FindFirstChild("001_Lots")',
            'assert(lots, "Brookhaven lots missing")',
            'local claimable=0',
            'for _,lot in ipairs(lots:GetChildren()) do',
            '  local buy=lot:FindFirstChild("BuyHouse", true)',
            '  local house=lot:FindFirstChild("HousePickedByPlayer")',
            '  if buy and buy:IsA("BasePart") and house then claimable += 1 end',
            'end',
            'assert(claimable >= 6, "expected Brookhaven claimable house lots")',
            'print("BROOKHAVEN_COMPAT_V41_OK version="..tostring(game.PlaceVersion).." descendants="..tostring(descendants).." claimable="..tostring(claimable))'
          ].join("\n");

          async function parse(r,label){
            const text=await r.text();
            let payload={};
            try{payload=text?JSON.parse(text):{};}catch{throw new Error(label+" non-JSON "+r.status);}
            if(!r.ok) throw new Error(label+" "+r.status+" "+JSON.stringify(payload).slice(0,1500));
            return payload;
          }

          let response;
          for(let attempt=0;attempt<6;attempt++){
            response=await fetch(
              `https://apis.roblox.com/cloud/v2/universes/${universe}/places/${place}/luau-execution-session-tasks`,
              {method:"POST",headers:{"x-api-key":key,"content-type":"application/json"},body:JSON.stringify({script,timeout:"30s"})}
            );
            if(response.status!==429) break;
            await new Promise(r=>setTimeout(r,2000*(attempt+1)));
          }
          let task=await parse(response,"create");
          const raw=String(task.path||"");
          const url="https://apis.roblox.com/cloud/v2/"+raw.replace(/^https:\/\/apis\.roblox\.com\/cloud\/v2\//,"").replace(/^\/?cloud\/v2\//,"").replace(/^\//,"");
          const deadline=Date.now()+90000;
          while(String(task.state||"")==="PROCESSING"){
            if(Date.now()>deadline) throw new Error("verification timeout");
            await new Promise(r=>setTimeout(r,1000));
            task=await parse(await fetch(url,{headers:{"x-api-key":key}}),"status");
          }
          const logs=await parse(await fetch(url+"/logs",{headers:{"x-api-key":key}}),"logs");
          const text=JSON.stringify(logs);
          if(task.error||/FAIL|ERROR|CANCEL/i.test(String(task.state||""))) throw new Error("task failed "+JSON.stringify(task).slice(0,1500));
          if(!text.includes("BROOKHAVEN_COMPAT_V41_OK")) throw new Error("v41 compatibility sentinel missing");
          console.log(text);
          NODE
