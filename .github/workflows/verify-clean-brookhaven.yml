name: Verify Clean Brookhaven Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-clean-brookhaven.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify private place boot
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const key=process.env.ROBLOX_OPEN_CLOUD_API_KEY;
          const universe=process.env.ROBLOX_UNIVERSE_ID;
          const place=process.env.ROBLOX_PLACE_ID;
          if(!key) throw new Error("missing API key");
          if(universe!=="6027194615"||place!=="17602626136") throw new Error("unexpected target");

          const script = [
            'local Workspace = game:GetService("Workspace")',
            'assert(game.PlaceVersion == 40, "expected version 40")',
            'local descendants = Workspace:GetDescendants()',
            'local scripts = 0',
            'local localScripts = 0',
            'local spawns = 0',
            'for _,x in game:GetDescendants() do',
            '  if x:IsA("Script") then scripts += 1 end',
            '  if x:IsA("LocalScript") then localScripts += 1 end',
            '  if x:IsA("SpawnLocation") then spawns += 1 end',
            'end',
            'assert(#descendants > 20000, "world too small")',
            'assert(scripts > 0, "no server scripts")',
            'assert(localScripts > 0, "no client scripts")',
            'assert(spawns > 0, "no spawns")',
            'print("CLEAN_BROOKHAVEN_BOOT_OK version=" .. tostring(game.PlaceVersion) .. " descendants=" .. tostring(#descendants) .. " scripts=" .. tostring(scripts) .. " localScripts=" .. tostring(localScripts) .. " spawns=" .. tostring(spawns))'
          ].join("\n");

          async function parse(r,label){
            const t=await r.text();
            let p={};
            try{p=t?JSON.parse(t):{};}catch{throw new Error(label+" non-JSON "+r.status);}
            if(!r.ok) throw new Error(label+" "+r.status+" "+JSON.stringify(p).slice(0,1500));
            return p;
          }

          let task=await parse(await fetch(
            `https://apis.roblox.com/cloud/v2/universes/${universe}/places/${place}/luau-execution-session-tasks`,
            {method:"POST",headers:{"x-api-key":key,"content-type":"application/json"},body:JSON.stringify({script,timeout:"30s"})}
          ),"create");

          const raw=String(task.path||"");
          if(!raw) throw new Error("missing task path");
          const url="https://apis.roblox.com/cloud/v2/"+raw.replace(/^https:\/\/apis\.roblox\.com\/cloud\/v2\//,"").replace(/^\/?cloud\/v2\//,"").replace(/^\//,"");
          const deadline=Date.now()+90000;
          while(String(task.state||"")==="PROCESSING"){
            if(Date.now()>deadline) throw new Error("verification timeout");
            await new Promise(r=>setTimeout(r,1000));
            task=await parse(await fetch(url,{headers:{"x-api-key":key}}),"status");
          }
          const logs=await parse(await fetch(url+"/logs",{headers:{"x-api-key":key}}),"logs");
          const text=JSON.stringify(logs);
          if(task.error||/FAIL|ERROR|CANCEL/i.test(String(task.state||""))) throw new Error("task failed "+JSON.stringify(task).slice(0,1500));
          if(!text.includes("CLEAN_BROOKHAVEN_BOOT_OK")) throw new Error("verification sentinel missing");
          console.log(text);
          NODE

      - name: Diagnose Brookhaven UI and house wiring
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const key=process.env.ROBLOX_OPEN_CLOUD_API_KEY;
          const universe=process.env.ROBLOX_UNIVERSE_ID;
          const place=process.env.ROBLOX_PLACE_ID;
          async function parse(r,label){
            const t=await r.text(); let p={};
            try{p=t?JSON.parse(t):{};}catch{throw new Error(label+" non-JSON "+r.status);}
            if(!r.ok) throw new Error(label+" "+r.status+" "+JSON.stringify(p).slice(0,1500));
            return p;
          }
          const lines=[
            'assert(game.PlaceVersion == 40, "expected v40")',
            'local function pathOf(x)',
            '  local p={x.Name}; local n=x.Parent',
            '  while n and n~=game do table.insert(p,1,n.Name); n=n.Parent end',
            '  return table.concat(p,"/")',
            'end',
            'local StarterGui=game:GetService("StarterGui")',
            'local ReplicatedStorage=game:GetService("ReplicatedStorage")',
            'local Workspace=game:GetService("Workspace")',
            'print("DIAG_BEGIN")',
            'for _,x in StarterGui:GetDescendants() do',
            '  local lower=string.lower(x.Name)',
            '  local isButton=x:IsA("ImageButton") or x:IsA("TextButton")',
            '  local interesting=string.find(lower,"house") or string.find(lower,"home") or string.find(lower,"vehicle") or string.find(lower,"avatar") or string.find(lower,"tool") or string.find(lower,"emote") or string.find(lower,"menu")',
            '  if isButton and interesting then',
            '    print("GUI_BUTTON "..pathOf(x).." active="..tostring(x.Active).." visible="..tostring(x.Visible).." selectable="..tostring(x.Selectable))',
            '  end',
            'end',
            'for _,x in game:GetDescendants() do',
            '  local lower=string.lower(x.Name)',
            '  local p=string.lower(pathOf(x))',
            '  if x:IsA("RemoteEvent") or x:IsA("RemoteFunction") then',
            '    if string.find(lower,"house") or string.find(lower,"home") or string.find(lower,"lot") or string.find(lower,"vehicle") or string.find(lower,"tool") or string.find(lower,"avatar") then',
            '      print("REMOTE "..x.ClassName.." "..pathOf(x))',
            '    end',
            '  elseif x:IsA("Script") or x:IsA("LocalScript") or x:IsA("ModuleScript") then',
            '    if string.find(lower,"house") or string.find(lower,"home") or string.find(lower,"lot") or string.find(p,"mainui") or string.find(p,"maingui") then',
            '      local disabled="na"; pcall(function() disabled=tostring(x.Disabled) end)',
            '      print("SCRIPT "..x.ClassName.." "..pathOf(x).." disabled="..disabled)',
            '    end',
            '  end',
            'end',
            'local lots=Workspace:FindFirstChild("001_Lots")',
            'if lots then',
            '  print("LOTS childCount="..tostring(#lots:GetChildren()))',
            '  for _,x in lots:GetChildren() do',
            '    local buy=x:FindFirstChild("BuyHouse",true)',
            '    print("LOT "..x.Name.." buyHouse="..tostring(buy~=nil).." buyClass="..tostring(buy and buy.ClassName or "none"))',
            '  end',
            'else print("LOTS missing") end',
            'local rem=ReplicatedStorage:FindFirstChild("RemoteEvents")',
            'print("REMOTE_FOLDER "..tostring(rem~=nil).." count="..tostring(rem and #rem:GetChildren() or 0))',
            'print("DIAG_END")'
          ];
          const script=lines.join("\n");
          let task=await parse(await fetch(
            `https://apis.roblox.com/cloud/v2/universes/${universe}/places/${place}/luau-execution-session-tasks`,
            {method:"POST",headers:{"x-api-key":key,"content-type":"application/json"},body:JSON.stringify({script,timeout:"30s"})}
          ),"create");
          const raw=String(task.path||"");
          const url="https://apis.roblox.com/cloud/v2/"+raw.replace(/^https:\/\/apis\.roblox\.com\/cloud\/v2\//,"").replace(/^\/?cloud\/v2\//,"").replace(/^\//,"");
          const deadline=Date.now()+90000;
          while(String(task.state||"")==="PROCESSING"){
            if(Date.now()>deadline) throw new Error("diagnostic timeout");
            await new Promise(r=>setTimeout(r,1000));
            task=await parse(await fetch(url,{headers:{"x-api-key":key}}),"status");
          }
          const logs=await parse(await fetch(url+"/logs",{headers:{"x-api-key":key}}),"logs");
          console.log(JSON.stringify(logs));
          NODE

      - name: Diagnose top-level client controller
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const key=process.env.ROBLOX_OPEN_CLOUD_API_KEY, universe=process.env.ROBLOX_UNIVERSE_ID, place=process.env.ROBLOX_PLACE_ID;
          async function parse(r,l){const t=await r.text();let p={};try{p=t?JSON.parse(t):{};}catch{throw new Error(l+" non-json");}if(!r.ok)throw new Error(l+" "+r.status+" "+t.slice(0,1200));return p;}
          const script=[
            'assert(game.PlaceVersion==40,"expected v40")',
            'local StarterGui=game:GetService("StarterGui")',
            'local function p(x) local a={x.Name}; local n=x.Parent; while n and n~=game do table.insert(a,1,n.Name); n=n.Parent end; return table.concat(a,"/") end',
            'print("CLIENT_DIAG_BEGIN")',
            'for _,x in StarterGui:GetDescendants() do',
            ' if x:IsA("LocalScript") then print("LOCAL "..p(x).." disabled="..tostring(x.Disabled)) end',
            'end',
            'local main=StarterGui:FindFirstChild("MainGUIHandler")',
            'local buttons=main and main:FindFirstChild("MainButtons") and main.MainButtons:FindFirstChild("Buttons")',
            'if buttons then for _,x in buttons:GetChildren() do',
            ' local active="na"; local visible="na"; if x:IsA("GuiObject") then active=tostring(x.Active); visible=tostring(x.Visible) end',
            ' print("MAIN_BUTTON "..x.Name.." class="..x.ClassName.." active="..active.." visible="..visible)',
            'end end',
            'local ph=StarterGui:FindFirstChild("PlayerHandler")',
            'print("PLAYER_HANDLER "..tostring(ph~=nil).." class="..tostring(ph and ph.ClassName or "none").." disabled="..tostring(ph and ph.Disabled or "na"))',
            'if ph then for _,x in ph:GetDescendants() do print("PH_CHILD "..p(x).." class="..x.ClassName) end end',
            'print("CLIENT_DIAG_END")'
          ].join("\n");
          let task=await parse(await fetch(`https://apis.roblox.com/cloud/v2/universes/${universe}/places/${place}/luau-execution-session-tasks`,{method:"POST",headers:{"x-api-key":key,"content-type":"application/json"},body:JSON.stringify({script,timeout:"30s"})}),"create");
          const raw=String(task.path||""), url="https://apis.roblox.com/cloud/v2/"+raw.replace(/^https:\/\/apis\.roblox\.com\/cloud\/v2\//,"").replace(/^\/?cloud\/v2\//,"").replace(/^\//,"");
          while(String(task.state||"")==="PROCESSING"){await new Promise(r=>setTimeout(r,1000));task=await parse(await fetch(url,{headers:{"x-api-key":key}}),"status");}
          console.log(JSON.stringify(await parse(await fetch(url+"/logs",{headers:{"x-api-key":key}}),"logs")));
          NODE

      - name: Extract original Brookhaven controller sources
        uses: actions/checkout@v4
        with:
          ref: main
          path: current

      - name: Checkout archived parser tools
        uses: actions/checkout@v4
        with:
          ref: archive/pre-reset-2026-09-27
          path: legacy-tools

      - name: Use Rust stable for RBXL inspection
        uses: dtolnay/rust-toolchain@stable

      - name: Parse pinned RBXL and inspect relevant script source
        shell: bash
        run: |
          set -euo pipefail
          node current/scripts/fetch-brookhaven.mjs
          cargo run --quiet --manifest-path legacy-tools/tools/roblox_catalog_reader/Cargo.toml -- Brookhaven.rbxl > brookhaven-dom.json
          node <<'NODE'
          const fs=require('fs');
          const dom=JSON.parse(fs.readFileSync('brookhaven-dom.json','utf8'));
          const rows=[];
          function cls(n){return String(n?.class??n?.className??'');}
          function name(n){return String(n?.name??n?.properties?.Name??cls(n));}
          function kids(n){return Array.isArray(n?.children)?n.children:[];}
          function walk(n,path=[]){
            if(!n||typeof n!=='object') return;
            const next=[...path,name(n)];
            const c=cls(n);
            if(c==='Script'||c==='LocalScript'||c==='ModuleScript'){
              rows.push({node:n,path:next.join('/')});
            }
            for(const ch of kids(n)) walk(ch,next);
          }
          walk(dom);
          function sourceText(node){
            const props=node?.properties||{};
            const direct=props.Source;
            if(typeof direct==='string') return direct;
            if(direct&&typeof direct==='object'){
              for(const k of ['value','Value','text','Text','source','Source']){
                if(typeof direct[k]==='string') return direct[k];
              }
            }
            return JSON.stringify(direct??'');
          }
          const needles=['MainButtons','AvatarEditor','BackPack','PlayerHouseChoice','GettingHouse','PlayersHouse','BuyHouse','MainHouseMenu','HouseControl'];
          console.log('SOURCE_DIAG_BEGIN scripts='+rows.length);
          let matched=0;
          for(const r of rows){
            const src=sourceText(r.node);
            const hay=(r.path+'\n'+src).toLowerCase();
            const hits=needles.filter(n=>hay.includes(n.toLowerCase()));
            if(!hits.length) continue;
            matched++;
            console.log('SOURCE_MATCH path='+r.path+' hits='+hits.join(',')+' sourceLen='+src.length);
            if(src.length){
              const relevant=src.split(/\r?\n/).filter(line=>needles.some(n=>line.toLowerCase().includes(n.toLowerCase())));
              console.log('SOURCE_LINES '+JSON.stringify(relevant.slice(0,120)));
            }
          }
          console.log('SOURCE_DIAG_END matched='+matched);
          NODE

      - name: Check PlayerHandler startup dependencies
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const key=process.env.ROBLOX_OPEN_CLOUD_API_KEY,universe=process.env.ROBLOX_UNIVERSE_ID,place=process.env.ROBLOX_PLACE_ID;
          async function parse(r,l){const t=await r.text();let p={};try{p=t?JSON.parse(t):{};}catch{throw new Error(l+" non-json");}if(!r.ok)throw new Error(l+" "+r.status+" "+t.slice(0,1200));return p;}
          const script=[
            'assert(game.PlaceVersion==40,"expected v40")',
            'local R=game:GetService("ReplicatedStorage")',
            'local S=game:GetService("StarterGui")',
            'local W=game:GetService("Workspace")',
            'local rem=R:FindFirstChild("RemoteEvents")',
            'local names={"PlayerHouseChoice","ChatAnimations","PlayerTriggerEvent","RPNameEvent","RPNameEventColor","GettingHouse","PlayersHouse","Tools","KeyFab","ClearTools","NoMotorVehicles","Car","Clothes","Messages","PlayersCar","Flying","Pass","GiveAnimationTools","BabyFollow","Jobs"}',
            'for _,n in ipairs(names) do local x=rem and rem:FindFirstChild(n); print("DEP_REMOTE "..n.."="..tostring(x~=nil).." class="..tostring(x and x.ClassName or "none")) end',
            'print("DEP_REPL NoCarsRegions="..tostring(R:FindFirstChild("NoCarsRegions")~=nil))',
            'local wc=W:FindFirstChild("WorkspaceCom")',
            'print("DEP_WORLD WorkspaceCom="..tostring(wc~=nil).." mapCameras="..tostring(wc and wc:FindFirstChild("001_MapCameras")~=nil).." houseTeleports="..tostring(wc and wc:FindFirstChild("001_MapHouseTeleports")~=nil))',
            'local paths={"MainGUIHandler","NoResetGUIHandler","IntroGui"}',
            'for _,n in ipairs(paths) do print("DEP_GUI "..n.."="..tostring(S:FindFirstChild(n)~=nil)) end',
            'local m=S:FindFirstChild("MainGUIHandler"); local nr=S:FindFirstChild("NoResetGUIHandler")',
            'for _,n in ipairs({"MainVehicleMenu","MainAnimationsMenu","MainAvatarMenu","MainHouseMenu","MainNoHouseMenu","MainMotelMenu","MainButtons","Client2Client","Menu","Shop","HouseSpinner","BuyHouse","Messages","CarControl","NoMotorControl","HouseControl","HorseControl","HouseControlMotel","CarControlSiren"}) do print("DEP_MAIN "..n.."="..tostring(m and m:FindFirstChild(n)~=nil)) end',
            'for _,n in ipairs({"MainEditor","MainToolMenu","JobMenuWorkspace","HouseKey"}) do print("DEP_NORESET "..n.."="..tostring(nr and nr:FindFirstChild(n)~=nil)) end',
            'local startup=R:FindFirstChild("PlayersStartup"); print("PLAYERS_STARTUP="..tostring(startup~=nil).." children="..tostring(startup and #startup:GetChildren() or 0))',
            'if startup then for _,x in startup:GetDescendants() do local n=string.lower(x.Name); if string.find(n,"house") or string.find(n,"bag") then print("STARTUP_CHILD "..x:GetFullName().." class="..x.ClassName) end end end'
          ].join("\n");
          let task=await parse(await fetch(`https://apis.roblox.com/cloud/v2/universes/${universe}/places/${place}/luau-execution-session-tasks`,{method:"POST",headers:{"x-api-key":key,"content-type":"application/json"},body:JSON.stringify({script,timeout:"30s"})}),"create");
          const raw=String(task.path||""),url="https://apis.roblox.com/cloud/v2/"+raw.replace(/^https:\/\/apis\.roblox\.com\/cloud\/v2\//,"").replace(/^\/?cloud\/v2\//,"").replace(/^\//,"");
          while(String(task.state||"")==="PROCESSING"){await new Promise(r=>setTimeout(r,1000));task=await parse(await fetch(url,{headers:{"x-api-key":key}}),"status");}
          console.log(JSON.stringify(await parse(await fetch(url+"/logs",{headers:{"x-api-key":key}}),"logs")));
          NODE
