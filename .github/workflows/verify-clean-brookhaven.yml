            'print("DEP_REMOTE Tools="..tostring(rem and rem:FindFirstChild("Tools")~=nil))',
            'print("DEP_REMOTE KeyFab="..tostring(rem and rem:FindFirstChild("KeyFab")~=nil))',
            'print("DEP_REMOTE ClearTools="..tostring(rem and rem:FindFirstChild("ClearTools")~=nil))',
            'print("DEP_REMOTE NoMotorVehicles="..tostring(rem and rem:FindFirstChild("NoMotorVehicles")~=nil))',
            'print("DEP_REMOTE Car="..tostring(rem and rem:FindFirstChild("Car")~=nil))',
            'print("DEP_REMOTE Clothes="..tostring(rem and rem:FindFirstChild("Clothes")~=nil))',
            'print("DEP_REMOTE Messages="..tostring(rem and rem:FindFirstChild("Messages")~=nil))',
            'print("DEP_REMOTE PlayersCar="..tostring(rem and rem:FindFirstChild("PlayersCar")~=nil))',
            'print("DEP_REMOTE Flying="..tostring(rem and rem:FindFirstChild("Flying")~=nil))',
            'print("DEP_REMOTE Pass="..tostring(rem and rem:FindFirstChild("Pass")~=nil))',
