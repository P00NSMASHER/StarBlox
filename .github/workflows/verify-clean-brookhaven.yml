            'local function findPath(root,path) local cur=root; for part in string.gmatch(path,"[^/]+") do cur=cur and cur:FindFirstChild(part) end; return cur end',
            'print("DEP_GUI MainGUIHandler="..tostring(findPath(SG,"MainGUIHandler")~=nil))',
