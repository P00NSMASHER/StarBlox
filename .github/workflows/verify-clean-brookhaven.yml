name: Verify Clean Brookhaven Baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-clean-brookhaven.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify published v43 functional compatibility
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const key=process.env.ROBLOX_OPEN_CLOUD_API_KEY;
          const universe=process.env.ROBLOX_UNIVERSE_ID;
          const place=process.env.ROBLOX_PLACE_ID;
          if(!key) throw new Error("missing API key");
          if(universe!=="6027194615"||place!=="17602626136") throw new Error("unexpected target");

          const script=[
            'assert(game.PlaceVersion == 43, "expected version 43")',
            'local Workspace=game:GetService("Workspace")',
            'local StarterPlayer=game:GetService("StarterPlayer")',
            'local StarterGui=game:GetService("StarterGui")',
            'local ServerScriptService=game:GetService("ServerScriptService")',
            'local ServerStorage=game:GetService("ServerStorage")',
            'local ReplicatedStorage=game:GetService("ReplicatedStorage")',
            'local descendants=#Workspace:GetDescendants()',
            'assert(descendants == 24348, "Brookhaven workspace descendant count changed: "..tostring(descendants))',
            'local client=StarterPlayer:WaitForChild("StarterPlayerScripts"):FindFirstChild("BrookhavenCompat")',
            'assert(client and client:IsA("LocalScript"), "BrookhavenCompat LocalScript missing")',
            'assert(string.find(client.Source, "task.delay(0.08", 1, true), "native-first right-rail fallback missing")',
            'assert(string.find(client.Source, "menuSignature", 1, true), "native-state guard missing")',
            'assert(string.find(client.Source, "STARBLOX_BROOKHAVEN_COMPAT_CLIENT_READY", 1, true), "client compatibility marker missing")',
            'local server=ServerScriptService:FindFirstChild("BrookhavenHouseCompat")',
            'assert(server and server:IsA("Script"), "BrookhavenHouseCompat Script missing")',
            'assert(string.find(server.Source, "gettingHouse.OnServerEvent:Connect", 1, true), "native GettingHouse backend missing")',
            'assert(string.find(server.Source, "PickingCustomHouse", 1, true), "house style handler missing")',
            'assert(string.find(server.Source, "ensureBag", 1, true), "PlayersBag bootstrap missing")',
            'assert(string.find(server.Source, "STARBLOX_BROOKHAVEN_COMPAT_SERVER_READY", 1, true), "server compatibility marker missing")',
            'local handler=StarterGui:FindFirstChild("PlayerHandler")',
            'assert(handler and handler:IsA("LocalScript"), "original PlayerHandler missing")',
            'assert(string.find(handler.Source, "pcall(function() l__PlayerGui__4:SetTopbarTransparency", 1, true), "PlayerHandler startup guard missing")',
            'local lots=Workspace:FindFirstChild("001_Lots")',
            'assert(lots, "Brookhaven lots missing")',
            'local buyLots=0',
            'local wiredLots=0',
            'for _,lot in ipairs(lots:GetChildren()) do',
            '  local buy=lot:FindFirstChild("BuyHouse", true)',
            '  if buy and buy:IsA("BasePart") then',
            '    buyLots += 1',
            '    if buy:FindFirstChild("CompatibilityHouseNumber") and buy:FindFirstChildOfClass("ClickDetector") then wiredLots += 1 end',
            '  end',
            'end',
            'assert(buyLots >= 19, "expected original Brookhaven buy lots; got "..tostring(buyLots))',
            'assert(wiredLots == buyLots, "not all Brookhaven lots wired: "..tostring(wiredLots).."/"..tostring(buyLots))',
            'local hidden=ServerStorage:FindFirstChild("StarBloxBrookhavenCompatibility")',
            'assert(hidden, "compatibility runtime state missing")',
            'local templates=hidden:FindFirstChild("HouseTemplates")',
            'assert(templates and #templates:GetChildren() >= 5, "authentic house template pool missing")',
            'local remotes=ReplicatedStorage:FindFirstChild("RemoteEvents")',
            'assert(remotes and remotes:FindFirstChild("GettingHouse") and remotes:FindFirstChild("PlayerHouseChoice") and remotes:FindFirstChild("PlayersHouse"), "Brookhaven house remotes missing")',
            'print("BROOKHAVEN_COMPAT_V43_OK version="..tostring(game.PlaceVersion).." descendants="..tostring(descendants).." buyLots="..tostring(buyLots).." wiredLots="..tostring(wiredLots).." templates="..tostring(#templates:GetChildren()))'
          ].join("\n");

          async function parse(r,label){
            const text=await r.text();
            let payload={};
            try{payload=text?JSON.parse(text):{};}catch{throw new Error(label+" non-JSON "+r.status);}
            if(!r.ok) throw new Error(label+" "+r.status+" "+JSON.stringify(payload).slice(0,1500));
            return payload;
          }

          let response;
          for(let attempt=0;attempt<8;attempt++){
            response=await fetch(
              `https://apis.roblox.com/cloud/v2/universes/${universe}/places/${place}/luau-execution-session-tasks`,
              {method:"POST",headers:{"x-api-key":key,"content-type":"application/json"},body:JSON.stringify({script,timeout:"30s"})}
            );
            if(response.status!==429 && response.status!==500) break;
            await new Promise(r=>setTimeout(r,2500*(attempt+1)));
          }
          let task=await parse(response,"create");
          const raw=String(task.path||"");
          if(!raw) throw new Error("missing task path");
          const url="https://apis.roblox.com/cloud/v2/"+raw.replace(/^https:\/\/apis\.roblox\.com\/cloud\/v2\//,"").replace(/^\/?cloud\/v2\//,"").replace(/^\//,"");
          const deadline=Date.now()+90000;
          while(String(task.state||"")==="PROCESSING"){
            if(Date.now()>deadline) throw new Error("verification timeout");
            await new Promise(r=>setTimeout(r,1000));
            task=await parse(await fetch(url,{headers:{"x-api-key":key}}),"status");
          }
          const logs=await parse(await fetch(url+"/logs",{headers:{"x-api-key":key}}),"logs");
          const text=JSON.stringify(logs);
          if(task.error||/FAIL|ERROR|CANCEL/i.test(String(task.state||""))) throw new Error("task failed "+JSON.stringify(task).slice(0,2000));
          if(!text.includes("BROOKHAVEN_COMPAT_V43_OK")) throw new Error("v43 compatibility sentinel missing");
          console.log(text);
          NODE
