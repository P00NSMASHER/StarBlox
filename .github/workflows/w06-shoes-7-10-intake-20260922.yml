name: W06 Shoes 7-10 candidate intake

on:
  push:
    branches: [screenshot-match-preproduction]
    paths: [.github/workflows/w06-shoes-7-10-intake-20260922.yml]

permissions:
  contents: write

concurrency:
  group: starblox-w06-shoes-7-10-intake
  cancel-in-progress: false

jobs:
  import-shoe-candidates:
    if: github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preproduction only
        uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0
      - name: Download and verify exact generated bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, struct, urllib.request, zlib

          batch = Path('public/assets/catalog-candidates/w06-shoes-20260922')
          batch.mkdir(parents=True, exist_ok=True)
          catalog = Path('public/assets/catalog')
          catalog.mkdir(parents=True, exist_ok=True)

          records = [
            {
              'itemId':'shoes-7','name':'Chunky Sneakers','tier':3,'theme':'Cloud Pop',
              'sourceUrl':'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:20f676c6-4b86-4338-9c07-cea6fef96a20',
              'reviewUrl':'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:5697f9fa-696c-4a7d-87ef-27e38317a6cf',
            },
            {
              'itemId':'shoes-8','name':'Trainers','tier':3,'theme':'Pixel Party',
              'sourceUrl':'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:b3b5cdc3-ce20-4773-af00-c0dbfbb2c145',
              'reviewUrl':'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:42ac6694-d05a-4c9f-ab2b-531922c91779',
            },
            {
              'itemId':'shoes-9','name':'Paint Kicks','tier':3,'theme':'Berry Blast',
              'sourceUrl':'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:fcbd5678-8710-4893-a212-9b806f1cf551',
              'reviewUrl':'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:21e5e30f-d48c-4b91-953d-bc6db0082d6f',
            },
            {
              'itemId':'shoes-10','name':'Light Shoes','tier':4,'theme':'Garden Glow',
              'sourceUrl':'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:c8b071d9-3a96-45c2-a2b6-8dafffeb5d2c',
              'reviewUrl':'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:f06129fd-c0f3-4f5e-b6bf-344c9e83a78b',
            },
          ]

          def download(url, limit=12_000_000):
              req = urllib.request.Request(url, headers={'User-Agent':'StarBlox-W06-Art-Intake/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  if not r.geturl().startswith('https://'):
                      raise ValueError('non-HTTPS redirect')
                  data = r.read(limit + 1)
              if len(data) > limit:
                  raise ValueError('image exceeds size cap')
              return data

          def png_dimensions(data):
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise ValueError('not PNG')
              length = struct.unpack('>I', data[8:12])[0]
              if data[12:16] != b'IHDR' or length != 13:
                  raise ValueError('invalid IHDR')
              width, height = struct.unpack('>II', data[16:24])
              pos = 8
              saw_end = False
              while pos < len(data):
                  if pos + 12 > len(data): raise ValueError('truncated PNG')
                  n = struct.unpack('>I', data[pos:pos+4])[0]
                  end = pos + 12 + n
                  if end > len(data): raise ValueError('truncated chunk')
                  kind = data[pos+4:pos+8]
                  payload = data[pos+8:pos+8+n]
                  crc = struct.unpack('>I', data[pos+8+n:end])[0]
                  if zlib.crc32(kind + payload) & 0xffffffff != crc:
                      raise ValueError('PNG CRC mismatch')
                  pos = end
                  if kind == b'IEND':
                      saw_end = True
                      break
              if not saw_end or pos != len(data): raise ValueError('invalid PNG termination')
              return width, height

          manifest = {
            'batchId':'w06-shoes-7-10-20260922',
            'status':'READY_FOR_REVIEWER02',
            'canonicalManifestChanged':False,
            'runtimeChanged':False,
            'playerDataChanged':False,
            'reviewer':'02',
            'integrator':'08',
            'provenance':'Adobe Firefly generation followed by Adobe subject-preserving square resize; exact bytes downloaded by this branch-scoped intake and hash-verified before commit.',
            'items':[]
          }
          for rec in records:
              source = download(rec['sourceUrl'])
              review = download(rec['reviewUrl'])
              sw, sh = png_dimensions(source)
              rw, rh = png_dimensions(review)
              if (sw, sh) != (1024, 1024):
                  raise ValueError(f"{rec['itemId']} source dimensions changed: {(sw, sh)}")
              if (rw, rh) != (768, 768):
                  raise ValueError(f"{rec['itemId']} review dimensions changed: {(rw, rh)}")
              source_path = batch / f"{rec['itemId']}-source-v3.png"
              review_path = catalog / f"{rec['itemId']}-w06-v3.png"
              for path, data in ((source_path, source), (review_path, review)):
                  if path.exists() and path.read_bytes() != data:
                      raise ValueError(f'refusing to overwrite differing {path}')
                  if not path.exists():
                      path.write_bytes(data)
              manifest['items'].append({
                'itemId':rec['itemId'],'name':rec['name'],'tier':rec['tier'],'theme':rec['theme'],
                'source':{'path':str(source_path),'sha256':hashlib.sha256(source).hexdigest(),'bytes':len(source),'dimensions':[sw,sh]},
                'review':{'path':str(review_path),'sha256':hashlib.sha256(review).hexdigest(),'bytes':len(review),'dimensions':[rw,rh]},
                'status':'READY_FOR_REVIEWER02'
              })
          (batch / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Commit candidates only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/screenshot-match-preproduction"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/assets/catalog/shoes-7-w06-v3.png public/assets/catalog/shoes-8-w06-v3.png public/assets/catalog/shoes-9-w06-v3.png public/assets/catalog/shoes-10-w06-v3.png public/assets/catalog-candidates/w06-shoes-20260922
          if git diff --cached --quiet; then
            echo 'Exact candidate bytes already present; no new commit.'
            exit 0
          fi
          git commit -m 'art(w06): stage Shoes 7-10 review candidates'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/screenshot-match-preproduction; then
              exit 0
            fi
            git fetch origin screenshot-match-preproduction
            git rebase origin/screenshot-match-preproduction
          done
          echo 'Concurrent branch changes prevented safe publication; no force push.' >&2
          exit 1
