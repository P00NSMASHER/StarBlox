name: StarBlox Workstream 08 Exact-Hash Integration

on:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - '.github/workflows/workstream08-integrate-current-accepts.yml'

permissions:
  contents: write

concurrency:
  group: starblox-workstream08-exact-hash-integration
  cancel-in-progress: false

jobs:
  integrate-qualified-accepts:
    if: github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout preproduction with history
        uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0

      - name: Fast-forward to latest branch head without force
        run: |
          set -eu
          git fetch origin screenshot-match-preproduction
          git merge --ff-only origin/screenshot-match-preproduction
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install existing app dependencies and image verifier
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Validate reviewer-02 exact accepts and prepare coherent canonical update
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { gameModel } from './src/gameModel.js';

          const wantedIds = [
            'shoes-1','shoes-2','shoes-3','shoes-4','shoes-5','shoes-6',
            'seating-7','seating-8','seating-9','seating-10'
          ];
          const sourceHead = process.env.SOURCE_HEAD;
          const manifestPath = 'catalog-art-manifest.json';
          const runtimePath = 'src/catalogArtRuntime.js';
          const reviewPath = 'docs/preproduction/catalog-sprint/reviews/02.json';
          const integrationPath = 'docs/preproduction/catalog-sprint/integration.json';
          const integrationMdPath = 'docs/preproduction/catalog-sprint/integration.md';
          const workstreamPath = 'docs/preproduction/workstreams/08-catalog-art.md';
          const lane06Path = 'docs/preproduction/catalog-sprint/lane-06.json';
          const shoe14Path = 'docs/preproduction/catalog-sprint/chat-shoes-recovery-1-4-result.json';
          const shoe56Path = 'docs/preproduction/catalog-sprint/chat-shoes-recovery-5-6-result.json';

          const json = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const gitBlob = p => execFileSync('git', ['hash-object', p], { encoding:'utf8' }).trim();
          const sha256 = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const repoPath = assetPath => assetPath.startsWith('/assets/') ? `public${assetPath}` : assetPath.replace(/^\//,'');
          const reviewBlobSha = gitBlob(reviewPath);
          const manifestBeforeBlob = gitBlob(manifestPath);
          const runtimeBeforeBlob = gitBlob(runtimePath);
          const manifestBefore = json(manifestPath);
          const previousIntegration = json(integrationPath);
          const review = json(reviewPath);
          const lane06 = json(lane06Path);
          const shoe14 = json(shoe14Path);
          const shoe56 = json(shoe56Path);
          const storeById = new Map(gameModel.store.map(x => [x.id, x]));

          if (review.reviewer !== '02') throw new Error('Reviewer shard identity mismatch');
          const reviewById = new Map((review.reviews ?? []).map(r => [r.itemId, r]));
          const lane06Items = new Map((lane06.secondaryRepairBatch?.items ?? []).map(x => [x.id, x]));
          const shoeItems = new Map([...(shoe14.items ?? []), ...(shoe56.items ?? [])].map(x => [x.id, x]));

          function decodeRaster(p) {
            const py = "from PIL import Image; import sys,json; im=Image.open(sys.argv[1]); im.verify(); im=Image.open(sys.argv[1]); print(json.dumps({'format':im.format,'width':im.width,'height':im.height}))";
            return JSON.parse(execFileSync('python3', ['-c', py, p], { encoding:'utf8' }));
          }

          const verified = [];
          for (const id of wantedIds) {
            const r = reviewById.get(id);
            if (!r || r.decision !== 'ACCEPT') throw new Error(`${id}: current reviewer-02 ACCEPT missing`);
            if (String(r.producer) === '02') throw new Error(`${id}: self-review forbidden`);
            if (r.hashAlgorithm !== 'git-blob-sha1') throw new Error(`${id}: unsupported review hash algorithm ${r.hashAlgorithm}`);
            if (!Array.isArray(r.evidenceRefs) || r.evidenceRefs.length === 0) throw new Error(`${id}: no visual evidence refs`);
            const item = storeById.get(id);
            if (!item) throw new Error(`${id}: absent from authoritative Store`);
            if (r.name !== item.name || Number(r.tier) !== Number(item.tier) || r.theme !== item.theme) {
              throw new Error(`${id}: review metadata differs from Store`);
            }
            const p = repoPath(r.assetPath);
            if (!fs.existsSync(p)) throw new Error(`${id}: accepted bytes missing at ${p}`);
            const actualBlob = gitBlob(p);
            if (actualBlob !== r.assetHash) throw new Error(`${id}: review hash ${r.assetHash} != stored blob ${actualBlob}`);
            const decode = decodeRaster(p);
            if (!['JPEG','PNG','WEBP'].includes(decode.format)) throw new Error(`${id}: unsupported raster ${decode.format}`);
            if (!decode.width || !decode.height) throw new Error(`${id}: zero image dimensions`);

            const producerEvidence = id.startsWith('shoes-') ? shoeItems.get(id) : lane06Items.get(id);
            if (!producerEvidence) throw new Error(`${id}: producer handoff missing`);
            const producerPath = producerEvidence.repositoryPath ?? producerEvidence.candidateRepositoryPath;
            const producerHash = producerEvidence.gitBlobSha ?? producerEvidence.candidateGitBlobSha;
            if (producerPath !== p || producerHash !== actualBlob) throw new Error(`${id}: producer path/hash handoff mismatch`);

            verified.push({
              itemId:id, name:item.name, collectionId:item.collectionId, collectionName:item.collectionName,
              type:item.type, tier:item.tier, theme:item.theme, price:item.price, starReq:item.starReq,
              assetPath:r.assetPath, repositoryPath:p, assetBlobSha:actualBlob, sha256:sha256(p),
              bytes:fs.statSync(p).size, width:decode.width, height:decode.height, format:decode.format,
              producer:String(r.producer), reviewer:'02', reviewFile:reviewPath, reviewBlobSha,
              evidenceRefs:r.evidenceRefs
            });
          }

          if (new Set(verified.map(v => v.assetPath)).size !== verified.length) throw new Error('New accepted batch contains duplicate paths');
          if (new Set(verified.map(v => v.assetBlobSha)).size !== verified.length) throw new Error('New accepted batch contains duplicate content hashes');

          // Reject candidate content collisions with any other canonical item.
          const canonicalHashOwner = new Map();
          for (const [id, meta] of Object.entries(manifestBefore.items ?? {})) {
            const p = repoPath(meta.assetPath);
            if (!fs.existsSync(p)) throw new Error(`Existing canonical mapping ${id} missing at ${p}`);
            const h = gitBlob(p);
            const old = canonicalHashOwner.get(h);
            if (old && old !== id) throw new Error(`Existing canonical content collision: ${old} and ${id}`);
            canonicalHashOwner.set(h,id);
          }
          for (const v of verified) {
            const owner = canonicalHashOwner.get(v.assetBlobSha);
            if (owner && owner !== v.itemId) throw new Error(`${v.itemId}: accepted content duplicates canonical ${owner}`);
          }

          // Ensure no same-hash reviewer disagreement in any current shard.
          for (const shard of ['01','02','05','14']) {
            const p = `docs/preproduction/catalog-sprint/reviews/${shard}.json`;
            if (!fs.existsSync(p)) continue;
            const s = json(p);
            const rows = [...(s.reviews ?? []), ...(s.newReplacementReviews ?? [])];
            for (const v of verified) {
              for (const d of rows) {
                const did = d.itemId ?? d.id;
                const dh = d.assetHash ?? d.candidateBlobSha ?? d.hash;
                if (did === v.itemId && dh === v.assetBlobSha && ['REWORK','BLOCKED'].includes(d.decision)) {
                  throw new Error(`${v.itemId}: same-hash disagreement in reviewer ${shard}`);
                }
              }
            }
            if (s.decisions && typeof s.decisions === 'object') {
              for (const v of verified) {
                const d=s.decisions[v.itemId];
                if (d?.hash === v.assetBlobSha && ['REWORK','BLOCKED'].includes(d.decision)) throw new Error(`${v.itemId}: same-hash disagreement in reviewer ${shard}`);
              }
            }
          }

          const manifest = structuredClone(manifestBefore);
          const changed = [];
          for (const v of verified) {
            const current = manifest.items[v.itemId];
            if (current?.assetPath === v.assetPath && current?.status === 'final-portable') continue;
            manifest.items[v.itemId] = {
              name:v.name, assetPath:v.assetPath, tier:v.tier, theme:v.theme, status:'final-portable'
            };
            changed.push(v);
          }
          if (changed.length !== wantedIds.length) throw new Error(`Expected 10 new canonical changes, got ${changed.length}`);

          const paths = Object.entries(manifest.items).map(([id,m]) => [id,m.assetPath]);
          const pathOwners = new Map();
          for (const [id,p] of paths) {
            if (pathOwners.has(p)) throw new Error(`Duplicate canonical path ${p}: ${pathOwners.get(p)} and ${id}`);
            pathOwners.set(p,id);
          }
          const contentOwners = new Map();
          for (const [id,p0] of paths) {
            const p=repoPath(p0); const h=gitBlob(p);
            if (contentOwners.has(h)) throw new Error(`Duplicate canonical content ${h}: ${contentOwners.get(h)} and ${id}`);
            contentOwners.set(h,id);
          }

          const finalPortable = Object.values(manifest.items).filter(x => x.status === 'final-portable').length;
          const interimNotVerified = Object.values(manifest.items).filter(x => x.status === 'interim-not-verified').length;
          manifest.version = Number(manifest.version ?? 0) + 1;
          manifest.target = 192;
          manifest.finalCount = finalPortable;
          manifest.remaining = 192 - finalPortable;
          manifest.duplicateAssetPaths = [];
          manifest.note = `Delivery Protocol V2 incremental integration: exact-hash independent ACCEPT batch integrated for ${changed.map(x=>x.itemId).join(', ')}. Prior asset versions remain in Git history; Replit/Floot/main/player data untouched.`;
          fs.writeFileSync(manifestPath, JSON.stringify(manifest) + '\n');

          // Regenerate only the explicit mapping body from the validated manifest; preserve imports and runtime behavior.
          const runtime = fs.readFileSync(runtimePath,'utf8');
          const marker='const portableCatalogArt = Object.freeze({';
          const start=runtime.indexOf(marker);
          const bodyStart=start+marker.length;
          const end=runtime.indexOf('\n});',bodyStart);
          if (start < 0 || end < 0) throw new Error('catalogArtRuntime map markers not found');
          const ordered = gameModel.store.filter(x => manifest.items[x.id]).map(x => `  '${x.id}': '${manifest.items[x.id].assetPath}'`).join(',\n');
          const nextRuntime = runtime.slice(0,bodyStart) + '\n' + ordered + runtime.slice(end);
          fs.writeFileSync(runtimePath,nextRuntime);

          const manifestAfterBlob = gitBlob(manifestPath);
          const runtimeAfterBlob = gitBlob(runtimePath);
          const stagedIds = new Set();
          const walk = dir => {
            if (!fs.existsSync(dir)) return;
            for (const ent of fs.readdirSync(dir,{withFileTypes:true})) {
              const p=path.join(dir,ent.name);
              if (ent.isDirectory()) walk(p);
              else {
                const m=ent.name.match(/^([a-z]+-\d+)(?:-|\.)/i);
                if (m && (ent.name.includes('-v') || p.includes('catalog-candidates') || ent.name.includes('-w'))) stagedIds.add(m[1]);
              }
            }
          };
          walk('public/assets/catalog'); walk('public/assets/catalog-candidates');

          const prevAccepted = Number(previousIntegration.counts?.acceptedCurrentReplacementHashes ?? 17);
          const prevCoverage = Number(previousIntegration.counts?.independentlyReviewedUniqueCatalogIds ?? 180);
          const strictAccepted = prevAccepted + changed.length;
          const strictRemaining = 192 - strictAccepted;
          const integration = {
            schemaVersion:8,
            workstream:'08', phase:'CATALOG_SPRINT', status:'CANONICAL_BATCH_PRECOMMIT_TESTS_PENDING',
            branch:'screenshot-match-preproduction', auditedSourceHead:sourceHead,
            canonicalBefore:{
              manifestVersion:manifestBefore.version, manifestBlobSha:manifestBeforeBlob, runtimeBlobSha:runtimeBeforeBlob,
              manifestEntries:Object.keys(manifestBefore.items??{}).length,
              finalPortable:Object.values(manifestBefore.items??{}).filter(x=>x.status==='final-portable').length
            },
            canonicalAfter:{
              manifestVersion:manifest.version, manifestBlobSha:manifestAfterBlob, runtimeBlobSha:runtimeAfterBlob,
              catalogTarget:192, manifestEntries:Object.keys(manifest.items).length,
              runtimeMappings:Object.keys(manifest.items).length, finalPortable, interimNotVerified,
              nonFinal:192-finalPortable, duplicateAssetPaths:0, duplicateContentHashes:0
            },
            integratedThisRun:changed,
            validationBeforeCommit:{
              exactIdNameCollectionCategoryTierTheme:`PASS_${changed.length}_OF_${changed.length}_AGAINST_CURRENT_GAME_MODEL`,
              storedPathAndBlobReadback:`PASS_${changed.length}_OF_${changed.length}_EXACT_GIT_BLOB_SHA`,
              safeDecode:`PASS_${changed.length}_OF_${changed.length}_PILLOW_PLUS_HASH_BOUND_RENDER_EVIDENCE`,
              reviewerIndependence:`PASS_${changed.length}_OF_${changed.length}_REVIEWER_02_VS_PRODUCERS_04_06`,
              reviewerDisagreement:'PASS_NONE_ON_ACCEPTED_EXACT_HASHES',
              canonicalUniqueness:`PASS_${Object.keys(manifest.items).length}_UNIQUE_PATHS_AND_CONTENT_HASHES`,
              runtimeManifestAgreement:`PASS_${Object.keys(manifest.items).length}_OF_${Object.keys(manifest.items).length}`,
              stablePricesUnlocksOwnership:'UNCHANGED_BY_SCOPE'
            },
            postCommitValidation:{catalogTests:'PENDING_EXECUTION',productionBuild:'PENDING_EXECUTION',storeSmoke:'PENDING_EXECUTION',referenceComparison:'HANDOFF_14_AFTER_GREEN_CANONICAL_COMMIT'},
            counts:{
              generatedLocalKnown:Number(previousIntegration.counts?.generatedLocalKnown ?? 0),
              generatedRemoteNotStagedKnown:Number(previousIntegration.counts?.generatedRemoteNotStagedKnown ?? 0),
              preservedBlobOnlyKnown:Number(previousIntegration.counts?.preservedBlobOnlyKnown ?? 0),
              branchStagedRepairIdsKnown:stagedIds.size,
              independentlyReviewedUniqueCatalogIds:prevCoverage,
              acceptedCurrentReplacementHashes:strictAccepted,
              canonicalWiredAcceptedHashesAfterCommit:strictAccepted,
              catalogReleaseClearedIds:0,
              newlyAcceptedAndWiredThisRun:changed.length,
              strictAcceptedRemaining:strictRemaining
            },
            nextReviewDependencies:[
              '14: independently review exact staged Lighting 5-8 replacement hashes and retain release-gate ownership.',
              '05: review fresh companion replacements and only visible Desk hashes; transparent/corrupt Desk evidence remains ineligible.',
              '01: prioritize fresh Tops/Bottoms/Headwear/Facegear replacement hashes.',
              '02: next fresh Seating 1-6/11-12 and Shoes 7-12 replacement hashes.',
              '08: integrate every next qualified exact-hash ACCEPT immediately.'
            ],
            blockers:[
              `${strictRemaining} catalog IDs are not yet current-hash accepted/canonically wired under strict V2 review.`,
              'Catalog release still requires all 192 current hashes accepted plus final duplicate/near-duplicate, Store/mobile and independent release verification.',
              'Physical-device and screen-reader release evidence remain outside this canonical batch; do not infer them from emulation.'
            ],
            freeze:{replitTouched:false,flootTouched:false,mainMergedOrModified:false,playerDataTouched:false,phaseChanged:false}
          };
          fs.writeFileSync(integrationPath, JSON.stringify(integration,null,2)+'\n');

          const rows=changed.map(x=>`| ${x.itemId} | ${x.name} | T${x.tier} · ${x.theme} | \`${x.assetPath}\` | \`${x.assetBlobSha}\` | ${x.format} ${x.width}×${x.height} |`).join('\n');
          const md=`# Workstream 08 catalog integration\n\nStatus: **10 NEW EXACT-HASH ACCEPTS CANONICALLY PREPARED; TEST/BUILD/STORE SMOKE PENDING**\n\nSource head before canonical write: \`${sourceHead}\`  \nReviewer shard: \`${reviewPath}\` @ \`${reviewBlobSha}\`  \nBranch: \`screenshot-match-preproduction\` only. Replit/Floot/main/player data untouched.\n\n## Newly integrated exact-hash ACCEPTs\n\n| ID | Name | Tier/theme | Canonical asset | Git blob | Decode |\n|---|---|---|---|---|---|\n${rows}\n\nReviewer 02 is independent from producers 04/06. Each accepted file was re-read from the repository, its Git blob was matched to the review decision and producer handoff, metadata was checked against the actual Store model, raster decode succeeded, and canonical path/content uniqueness was recomputed. Historical REWORK hashes do not block these replacement hashes.\n\n## Accounting\n\n- Legacy manifest final-portable labels after this batch: **${finalPortable}/192**. This is not the strict visual-acceptance count.\n- Current exact-hash independently accepted and canonical-wired replacements: **${strictAccepted}/192**.\n- Strict accepted/wired remaining: **${strictRemaining}**.\n- Interim-not-verified manifest entries: **${interimNotVerified}**.\n- Canonical manifest/runtime mappings: **${Object.keys(manifest.items).length}**.\n- Canonical duplicate paths: **0**; canonical duplicate content hashes: **0**.\n- Catalog release-cleared IDs: **0** until reviewer 14 completes the independent release gate.\n\n## Verification and handoff\n\nFull catalog tests, production build and strict Store/mobile smoke execute before publication by the Workstream-08 integration job. The earlier beds-1 metadata defect is already fixed in the current canonical manifest (Garden Glow) and remains protected by the strict catalog metadata test. After a green canonical commit, reviewer 14 should run the fresh Home/Store/Quest reference comparison against the committed originals; Workstream 08 does not self-approve reference parity.\n`;
          fs.writeFileSync(integrationMdPath,md);

          const wsExisting=fs.existsSync(workstreamPath)?fs.readFileSync(workstreamPath,'utf8'):'';
          const stamp=`## Current exact-hash integration — reviewer 02 Shoes 1–6 + Seating 7–10\n\nPrepared from source \`${sourceHead}\`. Ten qualified replacement hashes passed exact Store metadata, stored-byte/hash, decode, reviewer-independence and uniqueness checks and are being canonically wired as one coherent batch. Strict accepted/wired count becomes **${strictAccepted}/192**; legacy final-portable label count becomes **${finalPortable}/192**. Reviewer 14 retains catalog release-gate authority; no deployment or phase change is implied.\n\nExact IDs: ${changed.map(x=>`\`${x.itemId}\``).join(', ')}.\n\n`;
          fs.writeFileSync(workstreamPath, stamp + wsExisting);

          fs.writeFileSync('/tmp/workstream08-plan.json',JSON.stringify({sourceHead,changed:changed.map(x=>x.itemId),strictAccepted,finalPortable,manifestAfterBlob,runtimeAfterBlob},null,2));
          console.log(fs.readFileSync('/tmp/workstream08-plan.json','utf8'));
          NODE

      - name: Run full catalog/application regression suite
        run: timeout 150s npm test -- --reporter=verbose

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright for strict Store/mobile smoke
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run strict Store/mobile smoke against prepared canonical files
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/starblox-w08-preview.log 2>&1 &
          echo $! > /tmp/starblox-w08-preview.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          STARBLOX_QA_URL=http://127.0.0.1:4173 STARBLOX_QA_OUTPUT=artifacts/workstream08-catalog-mobile-qa STARBLOX_QA_STRICT=1 node scripts/catalogMobileQa.mjs

      - name: Mark executed validation PASS and preserve exact candidate hashes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='docs/preproduction/catalog-sprint/integration.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          r.status='INTEGRATED_ACCEPTED_INCREMENT_ALL_SCOPED_CHECKS_PASS_PENDING_PUSH';
          r.postCommitValidation.catalogTests='PASS_FULL_NPM_TEST';
          r.postCommitValidation.productionBuild='PASS_VITE_PRODUCTION_BUILD';
          r.postCommitValidation.storeSmoke='PASS_STRICT_CATALOG_MOBILE_QA_PRECOMMIT';
          r.postCommitValidation.referenceComparison='HANDOFF_14_FRESH_REFERENCE_CAPTURE_AFTER_PUSH';
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          const md='docs/preproduction/catalog-sprint/integration.md';
          fs.appendFileSync(md,'\n## Executed validation\n\n**PASS:** full npm regression, Vite production build, and strict catalog Store/mobile QA all succeeded against the coherent prepared canonical files before commit. Fresh original-reference comparison remains independently owned by 14 and is not claimed here.\n');
          NODE

      - name: Commit canonical manifest/runtime and evidence coherently, then push without force
        run: |
          set -eu
          test "$GITHUB_REF" = 'refs/heads/screenshot-match-preproduction'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalog-art-manifest.json src/catalogArtRuntime.js docs/preproduction/catalog-sprint/integration.json docs/preproduction/catalog-sprint/integration.md docs/preproduction/workstreams/08-catalog-art.md
          test -n "$(git diff --cached --name-only)"
          git commit -m 'catalog: wire reviewer-accepted Shoes 1-6 and Seating 7-10'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/screenshot-match-preproduction; then
              echo "CANONICAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
            git fetch origin screenshot-match-preproduction
            if ! git rebase origin/screenshot-match-preproduction; then
              git rebase --abort || true
              echo 'Concurrent canonical conflict; no force push and no stale overwrite.' >&2
              exit 1
            fi
          done
          echo 'Safe canonical publication failed after retries; no force push.' >&2
          exit 1

      - name: Print canonical result
        if: always()
        run: |
          cat /tmp/workstream08-plan.json || true
          cat docs/preproduction/catalog-sprint/integration.json || true
          cat artifacts/workstream08-catalog-mobile-qa/summary.txt || true
