name: Sync StarBlox questions from ABVM

on:
  schedule:
    - cron: '17 13 * * *'
      timezone: 'America/New_York'
    - cron: '47 15 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
  push:
    branches:
      - questions/daily-abvm-star-sync-economy
    paths:
      - scripts/sync-question-bank-from-abvm.mjs
      - .github/workflows/sync-abvm-starblox-questions.yml

permissions:
  contents: write

concurrency:
  group: starblox-abvm-question-sync
  cancel-in-progress: false

jobs:
  refresh-question-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout StarBlox
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout the ABVM calendar/planner source pipeline
        uses: actions/checkout@v4
        with:
          repository: P00NSMASHER/abvmschoolstarworld
          ref: main
          path: abvm-source
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the exact ABVM teacher-page scanner
        working-directory: abvm-source
        run: node scripts/refresh-teacher-pages.mjs

      - name: Require the same ABVM refresh-health gate
        working-directory: abvm-source
        run: node scripts/check-refresh-health.mjs --require-today --max-age-hours 1

      - name: Record exact scanner revision
        id: scanner
        shell: bash
        run: echo "sha=$(git -C abvm-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Regenerate current-material and STAR questions together
        run: |
          node scripts/sync-question-bank-from-abvm.mjs \
            --pack abvm-source/pages/data/study-pack.json \
            --pack-out docs/phase6/ABVM_CURRENT_STUDY_PACK.json \
            --source-out docs/phase6/ABVM_GRADE2_ROTATING_QUESTION_SOURCE.json \
            --lua-out roblox/src/server/CoreQuestionBank.luau \
            --scanner-commit "${{ steps.scanner.outputs.sha }}"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Validate generated question bank
        run: |
          npx vitest run \
            src/robloxRuntime/phase6QuestionBank.test.js \
            src/robloxRuntime/dailyQuestionSync.test.js \
            src/robloxRuntime/coreLoopProof.test.js

      - name: Commit only when the verified curriculum snapshot changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/phase6/ABVM_CURRENT_STUDY_PACK.json \
            docs/phase6/ABVM_GRADE2_ROTATING_QUESTION_SOURCE.json \
            roblox/src/server/CoreQuestionBank.luau
          if git diff --cached --quiet; then
            echo "No verified teacher-material change; question snapshot remains current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "Refresh StarBlox questions from verified ABVM material"
          git push
