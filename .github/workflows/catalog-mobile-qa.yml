name: StarBlox Catalog Mobile QA

on:
  push:
    branches:
      - screenshot-match-preproduction
    paths:
      - 'src/**'
      - 'public/assets/catalog/**'
      - 'catalog-art-manifest.json'
      - 'scripts/catalogMobileQa.mjs'
      - '.github/workflows/catalog-mobile-qa.yml'
  workflow_dispatch:

concurrency:
  group: starblox-catalog-mobile-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-mobile-accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright without changing package metadata
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start local production preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/starblox-catalog-preview.log 2>&1 &
          echo $! > /tmp/starblox-catalog-preview.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/starblox-catalog-preview.log
          exit 1

      - name: Run catalog mobile accessibility gate
        run: node scripts/catalogMobileQa.mjs
        env:
          STARBLOX_QA_URL: http://127.0.0.1:4173
          STARBLOX_QA_OUTPUT: artifacts/catalog-mobile-qa
          STARBLOX_QA_STRICT: '1'

      - name: Print catalog QA summary
        if: always()
        run: |
          cat artifacts/catalog-mobile-qa/summary.txt || true
          if [ -f artifacts/catalog-mobile-qa/report.json ]; then
            node -e "const r=require('./artifacts/catalog-mobile-qa/report.json'); console.log(JSON.stringify({status:r.status,sourceHead:r.sourceHead,releaseBlockingCount:r.releaseBlockingCount,emulation:r.emulation,failures:r.results.filter(x=>x.status==='FAIL').map(x=>({viewport:x.viewport,collection:x.collection,check:x.check,message:x.message,metrics:x.metrics}))},null,2))"
          fi

      - name: Upload catalog mobile screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-mobile-qa
          path: artifacts/catalog-mobile-qa
          if-no-files-found: warn
          retention-days: 7

      - name: Print preview log on failure
        if: failure()
        run: cat /tmp/starblox-catalog-preview.log || true
