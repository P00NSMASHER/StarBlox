            },
            'handoff':'14: independently review only these exact staged Wall5-8 hashes after actual card/detail render evidence. 08: integrate only independently accepted exact hashes. 05: do not self-approve and do not start Wall9-12 until reviewer14 dispositions are published.'
          }
          RESULT.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({'storedCandidateCount':len(stored),'skipped':skipped,'items':[{'id':r['id'],'sha256':r['sha256'],'gitBlobSha':r['gitBlobSha'],'bytes':r['bytes']} for r in stored]},indent=2))
          PY

      - name: Publish only produced Wall candidate bytes and intake evidence
        id: publish
        run: |
          set -eu
          test "$GITHUB_REF" = "refs/heads/screenshot-match-preproduction"
          STORED=$(python3 - <<'PY'
          import json
          print(json.load(open('docs/preproduction/catalog-sprint/chat-wall-5-8-w05-v2-result.json'))['storedCandidateCount'])
          PY
          )
          if [ "$STORED" -eq 0 ]; then
            echo 'No new owned Wall bytes produced; preserving newer staged candidates.'
            echo 'NO_ASSETS=true' >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in public/assets/catalog/wall-{5,6,7,8}-w05-v2.png; do test ! -f "$f" || git add -- "$f"; done
          git add -- docs/preproduction/catalog-sprint/chat-wall-5-8-w05-v2-result.json
          git commit -m 'catalog: stage physical Wall 5-8 W05 v2 pilot'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/screenshot-match-preproduction; then break; fi
            git fetch origin screenshot-match-preproduction
            git rebase origin/screenshot-match-preproduction
            if [ "$attempt" -eq 3 ]; then echo 'Concurrent branch changes prevented safe publication; no force push.' >&2; exit 1; fi
          done
          echo "TESTED_SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install app and Playwright dependencies
        if: env.NO_ASSETS != 'true'
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run full regression suite
        if: env.NO_ASSETS != 'true'
        id: tests
        continue-on-error: true
        run: timeout 120s npm test -- --reporter=verbose

      - name: Build actual preproduction application
        if: env.NO_ASSETS != 'true'
        id: build
        continue-on-error: true
        run: npm run build

      - name: Render staged candidates with shared file-backed fixture
        if: env.NO_ASSETS != 'true'
        id: render
        continue-on-error: true
        run: node scripts/catalog-staged-art-qa.mjs
        env:
          GITHUB_SHA: ${{ env.TESTED_SOURCE_HEAD }}

      - name: Record scoped Wall evidence honestly
        if: always() && steps.publish.outcome == 'success' && env.NO_ASSETS != 'true'
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('docs/preproduction/catalog-sprint/chat-wall-5-8-w05-v2-result.json')
          r=json.loads(p.read_text())
          def state(x): return {'success':'PASS','failure':'FAIL','skipped':'NOT_RUN','cancelled':'CANCELLED'}.get(x,'NOT_RUN')
          r['testedSourceHead']=os.environ.get('TESTED_SOURCE_HEAD')
          r['workflowRunId']=int(os.environ['GITHUB_RUN_ID'])
          r['checks'].update({
            'tests':state(os.environ['TEST_OUTCOME']),
            'build':state(os.environ['BUILD_OUTCOME']),
            'sharedRenderOverall':state(os.environ['RENDER_OUTCOME']),
            'typecheck':'NOT_APPLICABLE_NO_APP_SOURCE_CHANGES'
          })
          report=Path('artifacts/catalog-staged-art/report.json')
          seen={}; screenshots={}
          if report.exists():
              ev=json.loads(report.read_text())
              wanted={i['id']:i['gitBlobSha'] for i in r['items']}
              matches=[i for s in ev.get('sets',{}).values() for i in s.get('items',[]) if wanted.get(i.get('id'))==i.get('blobSha')]
              for i in matches:
                  if i.get('screenshot') and i.get('status')==200 and i.get('naturalWidth') and not i.get('errors'):
                      seen[i['id']]=i['blobSha']
                      screenshots[i['id']]={'blobSha':i['blobSha'],'screenshot':i.get('screenshot'),'status':i.get('status'),'naturalWidth':i.get('naturalWidth'),'naturalHeight':i.get('naturalHeight'),'errors':i.get('errors') or []}
              r['renderEvidence']={
                'artifactName':'wall-5-8-w05-v2-recovery-evidence',
                'reportPath':'artifacts/catalog-staged-art/report.json',
                'matchedIds':sorted(seen),
                'matchedHashes':{i:seen[i] for i in sorted(seen)},
                'screenshots':screenshots
              }
          expected=len(r['items'])
          r['checks']['wallCardDetailRender']=f"PASS_{len(seen)}_OF_{expected}" if len(seen)==expected else f"INCOMPLETE_{len(seen)}_OF_{expected}"
          r['status']='READY_FOR_REVIEW_14' if len(seen)==expected else 'STAGED_READBACK_PASS__RENDER_INCOMPLETE'
          p.write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps({'wallCardDetailRender':r['checks']['wallCardDetailRender'],'matched':seen,'overall':r['checks']['sharedRenderOverall']},indent=2))
          PY

      - name: Publish scoped evidence update without touching mappings
        if: always() && steps.publish.outcome == 'success' && env.NO_ASSETS != 'true'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/preproduction/catalog-sprint/chat-wall-5-8-w05-v2-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'catalog: record Wall 5-8 W05 v2 render evidence'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/screenshot-match-preproduction; then break; fi
            git fetch origin screenshot-match-preproduction
            git rebase origin/screenshot-match-preproduction
            if [ "$attempt" -eq 3 ]; then echo 'Concurrent branch changes prevented safe evidence publication; no force push.' >&2; exit 1; fi
          done

      - name: Upload Wall 5-8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-5-8-w05-v2-recovery-evidence
          path: |
            docs/preproduction/catalog-sprint/chat-wall-5-8-w05-v2-result.json
            artifacts/w05-wall-5-8/
            artifacts/catalog-staged-art/
          retention-days: 14
          if-no-files-found: warn
