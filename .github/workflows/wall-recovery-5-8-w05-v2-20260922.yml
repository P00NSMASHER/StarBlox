              negativePromptSha256='62095645ffa6eaf18ef0922215229846799ab4bde0b9f3acebc6dc67ab2f3d47',
              prompt='StarBlox catalog asset for exact item Ocean Window, Wall category, Tier 3, Candy Core theme. Create a premium original physical recessed ocean window clearly mounted into a wall, shown in three-quarter collectible product presentation. The object must visibly sit inside a wall opening with a thick rounded candy-colored frame, glossy pastel coral, aqua and pink enamel accents, a deep recessed jamb, metal/glass edge construction, visible fasteners and believable cast/contact shadow on the wall. Behind thick reflective glass, show layered blue water, fish silhouettes, bubbles and caustic light with convincing refraction and foreground/mid/background depth. Candy Core reads through playful glossy pastel material treatment, no text. Tier 3 richness, clean strong card silhouette, no floor-standing object.',
