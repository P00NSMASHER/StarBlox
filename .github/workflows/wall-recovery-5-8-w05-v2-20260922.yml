              producerPixelCheck='PASS — actual selected pixels show thick candy-enamel frame construction, recessed multi-layer jamb, visible fasteners, reflective glass, layered water/fish depth and strong contact shadow. Candy Core is physical and playful rather than a flat recolor.',
              variants=[
                dict(label='A',seed=239320889,requestId='9a805e49-22c6-45fc-9d45-87033bfede10',assetId='urn:aaid:sc:US:be14319c-4c08-4359-9cca-e82304fd4631',sourceUrl='https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:dc85df61-efc8-4aa2-93d5-ee83eb006e49',promptSha256='87111e677bd9ec2ea97ad61da40eeb50703277f40547393e6f0a3f7c8b198125',disposition='NOT_SELECTED__READS_TOO_FREESTANDING_PORTABLE'),
                dict(label='B',seed=1854681775,requestId='0491e021-02f4-4588-890f-4c96d6e22894',assetId='urn:aaid:sc:US:254b0a1b-b62f-4007-8b5e-76fbbe85f80c',sourceUrl='https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:17c83863-a861-476a-925d-0dcfa88be1b7',promptSha256='286e6b4016634aee79705eebce7da53c004c72f56ee9bf56d5bf6fe62ec9610f',disposition='SELECTED_FOR_STAGING'),
              ],
            ),
