              'artFactoryJobReason':'scripts/artFactoryJob.mjs correctly requires exact modelId+revision; Adobe connector did not expose these values, so no fake identity/revision was supplied.',
              'boundedVariantCounts':{i['id']:len(i['variants']) for i in items},
              'selectedFromActualPixelInspection':True
            },
            'checks':{
              'exactByteReadback':f'PASS_{len(stored)}_OF_{len(stored)}',
