          def sha256(b): return hashlib.sha256(b).hexdigest()
          def git_blob_sha(b):
              h=hashlib.sha1(); h.update(f'blob {len(b)}\0'.encode()); h.update(b); return h.hexdigest()
          def png_dimensions(data):
              if data[:8] != b'\x89PNG\r\n\x1a\n': raise ValueError('not PNG')
              pos=8; dims=None; ended=False
              while pos < len(data):
                  if pos+12>len(data): raise ValueError('truncated PNG')
                  n=struct.unpack('>I',data[pos:pos+4])[0]; end=pos+12+n
                  if end>len(data): raise ValueError('truncated PNG content')
                  kind=data[pos+4:pos+8]; payload=data[pos+8:pos+8+n]
                  expected=struct.unpack('>I',data[pos+8+n:end])[0]
                  if zlib.crc32(kind+payload)&0xffffffff != expected: raise ValueError('PNG CRC mismatch')
                  if kind==b'IHDR':
                      if n!=13 or dims is not None: raise ValueError('invalid IHDR')
                      dims=struct.unpack('>II',payload[:8])
                  pos=end
                  if kind==b'IEND': ended=True; break
              if not ended or pos!=len(data) or dims is None: raise ValueError('invalid PNG structure')
              return dims
          def download(url,limit=8_000_000):
              req=urllib.request.Request(url,headers={'User-Agent':'StarBlox-W05-Wall58-Recovery/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  if not r.geturl().startswith('https://'): raise ValueError('non-HTTPS redirect')
                  b=r.read(limit+1)
              if len(b)>limit: raise ValueError('download too large')
              return b

          stored=[]; skipped=[]
          for meta in items:
              iid=meta['id']
              target=ROOT/f"public/assets/catalog/{iid}-w05-v2.png"
              other=sorted((ROOT/'public/assets/catalog').glob(f'{iid}-*.*'))
              other=[p for p in other if p!=target]
              if other and not target.exists():
                  skipped.append({'id':iid,'reason':'EXISTING_VERSIONED_CANDIDATE_PRESERVED','paths':[p.as_posix() for p in other]})
                  continue
              data=download(meta['sourceUrl'])
              dims=png_dimensions(data)
              if dims!=(1024,1024): raise ValueError(f'{iid}: expected 1024x1024, got {dims}')
              if target.exists() and target.read_bytes()!=data:
                  raise ValueError(f'{iid}: refusing to overwrite differing staged candidate')
              target.parent.mkdir(parents=True,exist_ok=True)
              if not target.exists(): target.write_bytes(data)
              rb=target.read_bytes()
              if rb!=data or png_dimensions(rb)!=(1024,1024): raise ValueError(f'{iid}: readback mismatch')
              rec={**meta,
                   'collectionId':'wall','collectionName':'Wall Decor','type':'room','format':'PNG',
                   'repositoryPath':target.as_posix(),'assetPath':'/'+target.as_posix().removeprefix('public/'),
                   'dimensions':[1024,1024],'bytes':len(rb),'sha256':sha256(rb),'gitBlobSha':git_blob_sha(rb),
