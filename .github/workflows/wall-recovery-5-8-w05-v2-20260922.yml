              producerPixelCheck='PASS — actual selected pixels show a deep physical frame, visible side thickness/corner hardware, glazed reflections, original skateboard/half-pipe graphic, clean no-text treatment, neon material spill and wall shadow. Midnight Neon reads clearly at Tier 3.',
              variants=[
                dict(label='A',seed=1627744890,requestId='18410689-dc3a-4020-b364-0c8a32530838',assetId='urn:aaid:sc:US:9cf7eb93-56bc-46ba-8f5c-62b984cfec74',sourceUrl='https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:20603d03-ec53-4a31-bd6a-6c5b3c56a914',promptSha256='bed9e81ae87468a155025a8453b62a17321adc86c5f954eec5a3cff88f9cdf4d',disposition='NOT_SELECTED__TINY_TEXT_LIKE_MARKS'),
                dict(label='B',seed=1916001742,requestId='dfd6e1b5-97e4-42d5-be64-d66fb372e2c5',assetId='urn:aaid:sc:US:b3140ee7-8b0d-4f0b-8187-a413dbfb8aec',sourceUrl='https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:33f83978-370c-436f-a2a2-de22e73dcc3b',promptSha256='b8b7140fd53d90dc39d6d11e70907b9e81c276452282b304302c3af2d8240a6f',disposition='SELECTED_FOR_STAGING'),
