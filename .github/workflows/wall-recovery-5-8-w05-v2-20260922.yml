name: StarBlox Wall 5-8 W05 v2 Recovery

on:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - '.github/workflows/wall-recovery-5-8-w05-v2-20260922.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starblox-wall-recovery-5-8-w05-v2-20260922
  cancel-in-progress: false

jobs:
  recover-wall-pilot:
    if: github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout preproduction only
        uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0

      - name: Record inspected source head
        run: echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Revalidate live W05 assignment and exact reviewer defects
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          active=json.loads(Path('docs/preproduction/art-factory/ACTIVE_BATCH.json').read_text())
          batch=next((b for b in active.get('batches',[]) if b.get('producer')=='05'),None)
          expected=['wall-5','wall-6','wall-7','wall-8']
          if not batch or batch.get('batchId')!='w05-wall-5-8-v2' or batch.get('scope')!=expected:
              raise SystemExit(f'W05 allocation changed; refusing write: {batch}')
          if batch.get('reviewer')!='14' or batch.get('state')!='ACTIONABLE_REWORK_FACTORY_PILOT':
              raise SystemExit(f'W05 batch no longer actionable: {batch}')
          wanted={
            'wall-5':'e9db285a837784a875642c0b56a7964873d79a5d',
            'wall-6':'d31b39482cce122c9030e8105592d89be3f6fd33',
            'wall-7':'f291c8368d4218603e3afe957662c3d37c5ca62a',
            'wall-8':'d50201ae8eb39ea26cffc8b7c85686cf6b4b7baa',
          }
          text=Path('docs/preproduction/catalog-sprint/reviews/14.json').read_text()
          for iid,blob in wanted.items():
              if iid not in text or blob not in text:
                  raise SystemExit(f'{iid}: exact legacy review hash changed; refusing write')
          print(json.dumps({'batch':batch['batchId'],'scope':expected,'reviewHashes':wanted},indent=2))
          PY

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run prompt optimizer and factory-contract validation
        run: |
          mkdir -p artifacts/w05-wall-5-8
          node scripts/artPromptOptimizer.mjs validate --repo-root .
          node scripts/artPromptOptimizer.mjs train --repo-root . --output artifacts/w05-wall-5-8/optimizer-model.json
          node scripts/artPromptOptimizer.mjs recommend --repo-root . --all-rework --variants 2 --output artifacts/w05-wall-5-8/optimizer-recommendations.json
          node --test scripts/artFactoryJob.node-test.mjs
          sha256sum artifacts/w05-wall-5-8/optimizer-recommendations.json > artifacts/w05-wall-5-8/optimizer-recommendations.sha256

