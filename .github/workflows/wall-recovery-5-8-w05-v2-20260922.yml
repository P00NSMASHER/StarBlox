              sourceGenerationRequestId='0491e021-02f4-4588-890f-4c96d6e22894',
              sourceUrl='https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:17c83863-a861-476a-925d-0dcfa88be1b7',
              generatorAssetId='urn:aaid:sc:US:254b0a1b-b62f-4007-8b5e-76fbbe85f80c',
