              ],
            ),
            dict(
              id='wall-7',name='Skate Poster',tier=3,theme='Midnight Neon',price=348,starReq=2,
              legacyBlobSha='f291c8368d4218603e3afe957662c3d37c5ca62a',
              sourceGenerationRequestId='dfd6e1b5-97e4-42d5-be64-d66fb372e2c5',
              sourceUrl='https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:33f83978-370c-436f-a2a2-de22e73dcc3b',
              generatorAssetId='urn:aaid:sc:US:b3140ee7-8b0d-4f0b-8187-a413dbfb8aec',
              seed=1916001742,
              promptSha256='b8b7140fd53d90dc39d6d11e70907b9e81c276452282b304302c3af2d8240a6f',
              negativePromptSha256='3f628d96db35a75bf1c072247dbf1f0595919d29ca050762dac895abae3fb849',
              prompt='StarBlox catalog asset for exact item Skate Poster, Wall category, Tier 3, Midnight Neon theme. Create a premium original physical framed skate poster as a wall-mounted collectible in three-quarter product presentation. Use a deep charcoal/navy dimensional frame with visible thickness, glazing and paper inset, real hanging/mounting hardware and a cast wall shadow. Inside, show one original stylized skateboard silhouette crossing abstract half-pipe arcs made only from bold fluorescent cyan, magenta and violet painted shapes, with restrained neon edge accents. Absolutely no writing or typography anywhere. Tier 3 should feel richer than a starter poster through layered glass reflections, metallic corner hardware, luminous ink/neon spill and material depth while remaining card-readable and clearly a poster.',
