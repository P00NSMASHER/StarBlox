              prompt='StarBlox catalog asset for exact item Garden Garland, Wall category, Tier 2, Art Attack theme. Create a premium original physical wall-mounted handmade garland in a three-quarter collectible product presentation: a real braided cord/twine hanging in a relaxed arc from two visible mounting hooks, layered dimensional leaves, stars and small craft shapes with paper, painted wood and stitched fabric material variation, tiny clips/beads, overlapping pieces and believable cast/contact shadows. Express Art Attack through playful hand-painted brush marks, color-blocked craft pieces and tactile maker details, not through text. Warm studio wall backdrop, controlled soft key light, strong card-scale silhouette, tasteful Tier-2 richness, centered object, no UI.',
