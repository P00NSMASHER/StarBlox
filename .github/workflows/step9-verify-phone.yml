name: StarBlox Step 9 Verify Phone Playtest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starblox-step9-phone-proof
  cancel-in-progress: true

jobs:
  verify-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify real touch-client playtest telemetry
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: node scripts/verify-roblox-real-client-playtest.mjs
