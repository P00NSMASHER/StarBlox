name: High School Integration

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-character commit SHA to rebuild"
        required: false
        type: string
  push:
    branches:
      - rebuild/high-school-integration
    paths:
      - "school/**"
      - ".github/workflows/high-school-integration.yml"
  pull_request:
    paths:
      - "school/**"
      - ".github/workflows/high-school-integration.yml"

permissions:
  contents: read

jobs:
  integration-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_SOURCE_SHA: ${{ github.event.inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_ARTIFACT_NAME: high-school-integration-candidate-${{ github.event.inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - name: Validate immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi

      - name: Check out exact integration candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify checked-out candidate identity
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [[ "$CHECKED_OUT_SHA" != "$CANDIDATE_SOURCE_SHA" ]]; then
            echo "::error::checked-out HEAD does not match the requested candidate SHA"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run release evidence guard
        run: python school/tests/release/release_evidence_static_guard.py

      - name: Run Foundation guard
        run: python school/tests/foundation/foundation_static_guard.py

      - name: Run Class & Education guard
        run: python school/tests/class_education/class_education_static_guard.py

      - name: Run Progression guard
        run: python school/tests/progression/progression_static_guard.py

      - name: Run Mobile guard
        run: python school/tests/mobile/mobile_static_guard.py

      - name: Run Integration guard
        run: python school/tests/integration/integration_static_guard.py

      - name: Install pinned Luau CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 "https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip" --output luau.zip
          echo "7d4035db01816f977f6e4c42e3d5e8ef4235d95e9afe63a3c38905b42dde60f2  luau.zip" | sha256sum --check --strict -
          unzip -q luau.zip -d luau-bin
          chmod +x luau-bin/luau*
          test -x luau-bin/luau

      - name: Execute pure Luau logic tests
        run: luau-bin/luau school/tests/logic/pure_logic_spec.luau

      - name: Install pinned portable Rojo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 "https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip" --output rojo.zip
          echo "22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  rojo.zip" | sha256sum --check --strict -
          unzip -q rojo.zip -d rojo-bin
          chmod +x rojo-bin/rojo
          rojo-bin/rojo --version

      - name: Build canonical school place
        shell: bash
        run: |
          set -euo pipefail
          rojo-bin/rojo build school/default.project.json -o HighSchool-Integration.rbxlx
          test -s HighSchool-Integration.rbxlx
          rojo-bin/rojo build school/default.project.json -o HighSchool-Integration-Repeat.rbxlx
          test -s HighSchool-Integration-Repeat.rbxlx
          cmp -s HighSchool-Integration.rbxlx HighSchool-Integration-Repeat.rbxlx
          rm HighSchool-Integration-Repeat.rbxlx
          BYTES="$(stat -c%s HighSchool-Integration.rbxlx)"
          test "$BYTES" -gt 1000
          BUILD_SHA256="$(sha256sum HighSchool-Integration.rbxlx | tee high-school-integration.sha256 | awk '{print $1}')"
          test "${#BUILD_SHA256}" -eq 64
          grep -q 'SchoolClockService' HighSchool-Integration.rbxlx
          grep -q 'ClassSessionService' HighSchool-Integration.rbxlx
          grep -q 'ProgressionService' HighSchool-Integration.rbxlx
          grep -q 'SchoolClient' HighSchool-Integration.rbxlx
          BYTES="$BYTES" BUILD_SHA256="$BUILD_SHA256" python -c 'import json,os; print(json.dumps({"sourceSha":os.environ["CANDIDATE_SOURCE_SHA"],"workflowSha":os.environ["GITHUB_WORKFLOW_SHA"],"workflowRef":os.environ["GITHUB_WORKFLOW_REF"],"workflowEvent":os.environ["GITHUB_EVENT_NAME"],"repository":os.environ["GITHUB_REPOSITORY"],"workflowRunId":int(os.environ["GITHUB_RUN_ID"]),"workflowRunAttempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"artifactName":os.environ["CANDIDATE_ARTIFACT_NAME"],"projectPath":"school/default.project.json","rojoVersion":"7.7.0","sha256":os.environ["BUILD_SHA256"],"bytes":int(os.environ["BYTES"])},indent=2),file=open("high-school-build-receipt.json","w",encoding="utf-8"))'

      - name: Verify build receipt binding
        run: |
          python school/tests/release/verify_build_receipt.py \
            --artifact HighSchool-Integration.rbxlx \
            --digest high-school-integration.sha256 \
            --receipt high-school-build-receipt.json \
            --expected-source-sha "$CANDIDATE_SOURCE_SHA" \
            --expected-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --expected-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --expected-workflow-event "$GITHUB_EVENT_NAME" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-workflow-run-id "$GITHUB_RUN_ID" \
            --expected-workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-artifact-name "$CANDIDATE_ARTIFACT_NAME" \
            --expected-project-path "school/default.project.json" \
            --expected-rojo-version "7.7.0"

      - name: Upload deterministic candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: |
            HighSchool-Integration.rbxlx
            high-school-integration.sha256
            high-school-build-receipt.json
          if-no-files-found: error
          retention-days: 30
