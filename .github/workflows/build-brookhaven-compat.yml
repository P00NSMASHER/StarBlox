name: Build Brookhaven Compatibility Patch

on:
  push:
    branches:
      - fix/brookhaven-v40-controls-houses
      - repair/native-brookhaven-runtime-v51
    paths:
      - "compatibility/**"
      - "tools/brookhaven_compat_patcher/**"
      - ".github/workflows/build-brookhaven-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Parse native compatibility Luau
        shell: bash
        run: |
          set +e
          npx --yes @johnnymorganz/stylua-bin@2.5.2 --syntax Luau --check compatibility/server/BrookhavenHouseCompat.server.luau compatibility/server/BrookhavenNativeRuntimeCore.luau > /tmp/stylua-check.log 2>&1
          status=$?
          set -e
          cat /tmp/stylua-check.log
          if [ "$status" -gt 1 ]; then
            echo "Luau parse failed with status $status"
            exit "$status"
          fi
          echo "Luau parsed successfully (format-only diff status=$status)"
      - name: Fetch exact clean Brookhaven baseline
        run: node scripts/fetch-brookhaven.mjs
      - name: Inject compatibility scripts without rebuilding world geometry
        run: |
          cargo run --quiet --manifest-path tools/brookhaven_compat_patcher/Cargo.toml -- \
            Brookhaven.rbxl Brookhaven-compat.rbxl brookhaven-compat-receipt.json
          test -s Brookhaven-compat.rbxl
          grep -q '"status": "brookhaven-compat-patched"' brookhaven-compat-receipt.json
          grep -q '"worldGeometryRebuilt": false' brookhaven-compat-receipt.json
          grep -q '"existingGuiRestyled": false' brookhaven-compat-receipt.json
      - name: Upload patch proof
        uses: actions/upload-artifact@v4
        with:
          name: brookhaven-compat-build
          path: brookhaven-compat-receipt.json
          if-no-files-found: error
          retention-days: 7
