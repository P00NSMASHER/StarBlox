name: StarBlox Mastery Shadow Evaluation

on:
  workflow_dispatch:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - 'src/masteryShadowModel.js'
      - 'src/masteryShadowModel.test.js'
      - 'scripts/masteryShadowSimulation.mjs'
      - 'src/gameModel.js'
      - 'src/questionQualityRuntime.js'
      - '.github/workflows/mastery-shadow-eval.yml'

permissions:
  contents: read

jobs:
  shadow-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Run mastery shadow tests
        run: npx vitest run src/masteryShadowModel.test.js

      - name: Generate deterministic comparison artifact
        run: |
          node scripts/masteryShadowSimulation.mjs artifacts/mastery-shadow/simulation.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/mastery-shadow/simulation.json','utf8'));
          if(r.mode!=='SHADOW_ONLY_NO_RUNTIME_SELECTION_CHANGE') throw new Error('shadow safety marker missing');
          if(!(r.questionCount>0&&r.skillCount>0)) throw new Error('empty question/skill corpus');
          if(!Array.isArray(r.scenarios)||r.scenarios.length<2) throw new Error('insufficient shadow scenarios');
          console.log(JSON.stringify({
            questionCount:r.questionCount,
            skillCount:r.skillCount,
            scenarios:r.scenarios.map(x=>({
              id:x.id,
              currentSkills:x.currentHeuristic.map(q=>q.skill),
              microChallenge:x.microChallenge?.skill??null
            }))
          },null,2));
          NODE

      - name: Upload shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: starblox-mastery-shadow-${{ github.sha }}
          path: artifacts/mastery-shadow/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
