name: StarBlox Lane 06 Seating 7-10 Intake

on:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - '.github/workflows/lane06-seating-7-10-intake.yml'
      - 'docs/preproduction/catalog-sprint/lane-06-seating-7-10-intake-seed.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starblox-lane06-seating-7-10-intake
  cancel-in-progress: false

jobs:
  stage-and-render:
    if: github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image verifier only
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Stage exact generated source and 768px candidate bytes
        run: |
          python3 - <<'PY'
          import json, hashlib, subprocess, urllib.request
          from pathlib import Path
          from PIL import Image

          seed_path=Path('docs/preproduction/catalog-sprint/lane-06-seating-7-10-intake-seed.json')
          seed=json.loads(seed_path.read_text())
          store_json=subprocess.check_output(['node','--input-type=module','-e',"import {store} from './src/gameModel.js'; console.log(JSON.stringify(store));"],text=True)
          store={x['id']:x for x in json.loads(store_json)}
          result={
            'schemaVersion':1,
            'batchId':seed['batchId'],
            'producer':'06',
            'independentReviewer':'02',
            'canonicalWriter':'08',
            'branch':'screenshot-match-preproduction',
            'status':'STAGED_READY_FOR_INDEPENDENT_REVIEW',
            'sourceHead':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'newGenerationCount':4,
            'storedCandidateCount':0,
            'storedOriginalCount':0,
            'independentAcceptsThisIntake':0,
            'canonicalPromotionsThisIntake':0,
            'items':[],
            'checks':{},
            'freeze':seed['freeze']
          }
          expected_fields=['name','collectionId','collectionName','type','tier','theme','price','starReq']
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'StarBlox-Lane06-Intake/1.0'})
            with urllib.request.urlopen(req,timeout=60) as r: return r.read()
          def git_blob(p):
            return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          def stage_bytes(url,path,expected_size):
            p=Path(path); p.parent.mkdir(parents=True,exist_ok=True)
            incoming=fetch(url)
            if p.exists() and p.read_bytes()!=incoming:
              raise RuntimeError(f'conflicting existing bytes at {p}')
            if not p.exists(): p.write_bytes(incoming)
            with Image.open(p) as im:
              dims=list(im.size); fmt=im.format
              im.verify()
            if dims != [expected_size,expected_size] or fmt != 'PNG':
              raise RuntimeError(f'{p}: expected PNG {expected_size}x{expected_size}, got {fmt} {dims}')
            b=p.read_bytes()
            return {'path':str(p),'bytes':len(b),'dimensions':dims,'sha256':hashlib.sha256(b).hexdigest(),'gitBlobSha':git_blob(p),'format':'PNG'}

          for item in seed['items']:
            actual=store.get(item['id'])
            if not actual: raise RuntimeError(f"missing Store item {item['id']}")
            for k in expected_fields:
              if actual.get(k)!=item.get(k): raise RuntimeError(f"{item['id']} {k}: seed={item.get(k)!r} store={actual.get(k)!r}")
            source=stage_bytes(item['sourceUrl'],item['sourcePath'],1024)
            candidate=stage_bytes(item['optimizedUrl'],item['candidatePath'],768)
            result['items'].append({
              'id':item['id'],'name':item['name'],'collectionId':item['collectionId'],'collectionName':item['collectionName'],'type':item['type'],'tier':item['tier'],'theme':item['theme'],'price':item['price'],'starReq':item['starReq'],
              'candidateRepositoryPath':candidate['path'],'candidateGitBlobSha':candidate['gitBlobSha'],'candidateSha256':candidate['sha256'],'bytes':candidate['bytes'],'dimensions':candidate['dimensions'],'format':candidate['format'],
              'sourcePath':source['path'],'sourceGitBlobSha':source['gitBlobSha'],'sourceSha256':source['sha256'],'sourceBytes':source['bytes'],'sourceDimensions':source['dimensions'],
              'generationRequestId':item['generationRequestId'],'resizeRequestId':item['resizeRequestId'],'provenance':'Generated for Lane 06 secondary Seating repair capacity; full-resolution source and Adobe 768x768 resize retained as exact repository bytes.',
              'producerPixelCheck':item['producerPixelCheck'],'independentDecision':'PENDING_02','status':'READY_FOR_REVIEW'
            })
          cand_hashes=[x['candidateSha256'] for x in result['items']]
          result['storedCandidateCount']=len(result['items'])
          result['storedOriginalCount']=len(result['items'])
          result['checks']={
            'metadata':'PASS_4_OF_4_AGAINST_CURRENT_GAME_MODEL',
            'sourceDecode':'PASS_4_OF_4_PNG_1024',
            'candidateDecode':'PASS_4_OF_4_PNG_768',
            'uniqueCandidateContent':'PASS_4_OF_4' if len(set(cand_hashes))==4 else 'FAIL',
            'exactRepositoryReadback':'PASS_8_OF_8',
            'isolatedBrowserRender':'PENDING',
            'independentVisualReview':'PENDING_02',
            'canonicalIntegration':'NOT_PERFORMED'
          }
          if result['checks']['uniqueCandidateContent']=='FAIL': raise RuntimeError('candidate duplicate content detected')
          Path('docs/preproduction/catalog-sprint/lane-06-seating-7-10-intake.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({'items':[(x['id'],x['candidateRepositoryPath'],x['candidateGitBlobSha']) for x in result['items']],'checks':result['checks']},indent=2))
          PY
      - name: Publish candidate bytes and immutable intake evidence
        run: |
          set -eu
          test "$GITHUB_REF" = 'refs/heads/screenshot-match-preproduction'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/assets/catalog/seating-7-w06-v2.png public/assets/catalog/seating-8-w06-v2.png public/assets/catalog/seating-9-w06-v2.png public/assets/catalog/seating-10-w06-v2.png docs/preproduction/catalog-sprint/recovered-originals/seating-7-10-20260921 docs/preproduction/catalog-sprint/lane-06-seating-7-10-intake.json
          if ! git diff --cached --quiet; then
            git commit -m 'catalog: stage Lane 06 Seating 7-10 premium repair candidates'
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/screenshot-match-preproduction; then break; fi
              git fetch origin screenshot-match-preproduction
              git rebase origin/screenshot-match-preproduction
              if [ "$attempt" -eq 3 ]; then echo 'safe publication blocked by concurrent changes; no force push' >&2; exit 1; fi
            done
          fi
          echo "STAGED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install isolated browser renderer
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render exact Seating candidates at card and detail scale
        run: |
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory . > /tmp/lane06-seating-render.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/public/assets/catalog/seating-7-w06-v2.png >/dev/null; then break; fi
            sleep 0.5
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const intake=JSON.parse(fs.readFileSync('docs/preproduction/catalog-sprint/lane-06-seating-7-10-intake.json','utf8'));
          const root='artifacts/lane06-seating-7-10'; fs.mkdirSync(path.join(root,'detail'),{recursive:true});
          const browser=await chromium.launch({headless:true});
          const report={sourceHead:process.env.STAGED_HEAD,items:[],errors:[]};
          try {
            const page=await browser.newPage({viewport:{width:1200,height:740},deviceScaleFactor:1});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const cards=intake.items.map(i=>`<article><img src="http://127.0.0.1:4174/${i.candidateRepositoryPath}"><b>${i.id}</b><span>${i.name} · T${i.tier} · ${i.theme}</span></article>`).join('');
            await page.setContent(`<!doctype html><style>html,body{margin:0;background:#f0eafa;font:18px system-ui;color:#2b2450}main{padding:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}article{background:white;border-radius:20px;padding:14px;box-shadow:0 8px 30px #7357a433}img{width:100%;aspect-ratio:1;object-fit:contain;display:block;border-radius:14px}b,span{display:block;margin-top:8px}span{font-size:14px}</style><main>${cards}</main>`);
            await page.waitForFunction(()=>[...document.images].every(x=>x.complete&&x.naturalWidth>0));
            const dims=await page.evaluate(()=>[...document.images].map(x=>[x.naturalWidth,x.naturalHeight]));
            if(dims.some(([w,h])=>w!==768||h!==768)) errors.push(`unexpected card source dimensions ${JSON.stringify(dims)}`);
            await page.screenshot({path:path.join(root,'seating-7-10-card-contact-sheet.png'),fullPage:true});
            await page.close();
            if(errors.length) report.errors.push(...errors);
            for(const item of intake.items){
              const p=await browser.newPage({viewport:{width:800,height:800},deviceScaleFactor:1}); const errs=[]; p.on('pageerror',e=>errs.push(String(e))); p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
              const url=`http://127.0.0.1:4174/${item.candidateRepositoryPath}`;
              await p.setContent(`<!doctype html><style>html,body{margin:0;width:800px;height:800px;background:#f0eafa;display:grid;place-items:center}img{width:768px;height:768px;object-fit:contain}</style><img id="asset" src="${url}">`);
              await p.waitForFunction(()=>{const x=document.querySelector('#asset');return x&&x.complete&&x.naturalWidth>0});
              const d=await p.locator('#asset').evaluate(x=>[x.naturalWidth,x.naturalHeight]);
              if(d[0]!==768||d[1]!==768) errs.push(`unexpected ${d}`);
              const out=path.join(root,'detail',`${item.id}-${item.candidateGitBlobSha.slice(0,8)}.png`); await p.locator('#asset').screenshot({path:out});
              const shot=fs.readFileSync(out); report.items.push({id:item.id,candidateGitBlobSha:item.candidateGitBlobSha,repositoryPath:item.candidateRepositoryPath,naturalDimensions:d,screenshotPath:out,screenshotSha256:crypto.createHash('sha256').update(shot).digest('hex'),errors:errs});
              await p.close();
            }
          } finally { await browser.close(); }
          fs.writeFileSync(path.join(root,'report.json'),JSON.stringify(report,null,2));
          if(report.errors.length||report.items.some(x=>x.errors.length)) process.exitCode=1;
          NODE
      - name: Record isolated render evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/preproduction/catalog-sprint/lane-06-seating-7-10-intake.json')
          r=json.loads(p.read_text())
          rp=Path('artifacts/lane06-seating-7-10/report.json')
          if rp.exists():
            ev=json.loads(rp.read_text())
            good=[x for x in ev.get('items',[]) if not x.get('errors')]
            r['checks']['isolatedBrowserRender']='PASS_4_OF_4' if len(good)==4 and not ev.get('errors') else f'FAIL_{len(good)}_OF_4'
            r['renderEvidence']={'reportPath':str(rp),'contactSheet':'artifacts/lane06-seating-7-10/seating-7-10-card-contact-sheet.png','items':good}
          else:
            r['checks']['isolatedBrowserRender']='NOT_RUN'
          p.write_text(json.dumps(r,indent=2)+'\n')
          PY
          git add -- docs/preproduction/catalog-sprint/lane-06-seating-7-10-intake.json
          if ! git diff --cached --quiet; then
            git commit -m 'catalog: record Lane 06 Seating 7-10 render evidence'
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/screenshot-match-preproduction; then exit 0; fi
              git fetch origin screenshot-match-preproduction
              git rebase origin/screenshot-match-preproduction
            done
            echo 'render evidence publication blocked; no force push' >&2
            exit 1
          fi
      - name: Retain rendered review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane06-seating-7-10-review-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            docs/preproduction/catalog-sprint/lane-06-seating-7-10-intake.json
            public/assets/catalog/seating-7-w06-v2.png
            public/assets/catalog/seating-8-w06-v2.png
            public/assets/catalog/seating-9-w06-v2.png
            public/assets/catalog/seating-10-w06-v2.png
            artifacts/lane06-seating-7-10
