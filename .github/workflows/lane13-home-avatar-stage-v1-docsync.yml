name: StarBlox Lane 13 Home Avatar Stage v1 Docsync

on:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - '.github/workflows/lane13-home-avatar-stage-v1-docsync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starblox-lane13-home-avatar-stage-v1-docsync
  cancel-in-progress: false

jobs:
  sync-lane13-evidence:
    if: github.repository == 'P00NSMASHER/StarBlox' && github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0

      - name: Update lane 13 ledgers from exact readback evidence
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import json

          intake_path=Path('docs/preproduction/visuals/lane-13-home-avatar-stage-v1-intake.json')
          lane_json_path=Path('docs/preproduction/visuals/lane-13.json')
          lane_md_path=Path('docs/preproduction/visuals/lane-13.md')
          intake=json.loads(intake_path.read_text())
          if intake.get('originReadback') != 'PASS_3_OF_3_EXACT_SHA256':
            raise SystemExit('refusing docs update before exact 3/3 origin readback')

          lane=json.loads(lane_json_path.read_text())
          lane['schemaVersion']=max(int(lane.get('schemaVersion',1)),7)
          lane['status']='READY_FOR_REVIEW_SCENES_CHARACTER_BUDDY_AND_HOME_STAGE'
          bucket=lane.setdefault('foregroundLayerCandidates',[])
          if not any(x.get('candidateId')=='home-avatar-stage-w13-v1' for x in bucket):
            files={x['role']:x for x in intake['files']}
            bucket.append({
              'candidateId':'home-avatar-stage-w13-v1',
              'candidateType':'foreground-avatar-buddy-grounding-layer',
              'targetScreen':'Home',
              'status':intake['status'],
              'observedDefect':intake['defectBasis']['observedGap'],
              'reference':{
                'path':intake['defectBasis']['referencePath'],
                'sha256':intake['defectBasis']['referenceSha256']
              },
              'runningRenderEvidence':{
                'workflowRunId':intake['defectBasis']['currentRenderArtifactRun'],
                'file':intake['defectBasis']['currentRenderPath']
              },
              'sourcePath':files['source']['path'],
              'sourceDimensions':files['source']['dimensions'],
              'sourceBytes':files['source']['bytes'],
              'sourceSha256':files['source']['sha256'],
              'sourceGitBlobSha':files['source']['gitBlobSha'],
              'fullPath':files['full']['path'],
              'fullDimensions':files['full']['dimensions'],
              'fullBytes':files['full']['bytes'],
              'fullSha256':files['full']['sha256'],
              'fullGitBlobSha':files['full']['gitBlobSha'],
              'fullAlphaBbox':files['full']['alphaBbox'],
              'optimizedPath':files['optimized']['path'],
              'optimizedDimensions':files['optimized']['dimensions'],
              'optimizedBytes':files['optimized']['bytes'],
              'optimizedSha256':files['optimized']['sha256'],
              'optimizedGitBlobSha':files['optimized']['gitBlobSha'],
              'optimizedAlphaBbox':files['optimized']['alphaBbox'],
              'intakeEvidence':str(intake_path),
              'originReadback':intake['originReadback'],
              'runtimeWired':False,
              'canonicalCatalogTouched':False,
              'workstream06AvatarTouched':False,
              'workstream09ActiveEnvironmentTouched':False,
              'physicalDeviceTested':False,
              'screenshotParityClaimed':False,
              'independentReview':'PENDING'
            })
          lane['latestForegroundReviewHandoff']={
            'candidateId':'home-avatar-stage-w13-v1',
            '01':'Judge the exact full/optimized pixels as art against the immutable Home reference; producer inspection is not acceptance.',
            '14':'Judge responsive composition, alpha quality, foreground occlusion risk and runtime/performance suitability.',
            '15':'Do not runtime-wire until 01/14 acceptance; if accepted, coordinate with 06/09 so this separate grounding layer does not replace their in-flight avatar/environment assets.'
          }
          lane_json_path.write_text(json.dumps(lane,indent=2)+'\n')

          md=lane_md_path.read_text()
          marker='## Foreground avatar/buddy grounding layer — `home-avatar-stage-w13-v1`'
          if marker not in md:
            f={x['role']:x for x in intake['files']}
            section=f'''\n\n{marker}\n\nThe current Home desktop render from workflow run `35663655650` was inspected beside the immutable Home reference before production. The visible foreground gap is grounding: the running avatar/buddy read flatter and less physically planted than the target's dimensional plush rug/contact-depth treatment. Lane 13 therefore produced a **separate foreground staging layer** rather than changing Workstream 06 avatar assets or Workstream 09 environment assets.\n\nComposition intent:\n\n- plush pink/lilac/cream star-cloud platform with restrained cyan piping and tiny warm-gold accents;\n- broad uncluttered center reserved for the separately composited equipped avatar and player-selected buddy;\n- warm dappled window-light cues and tactile depth to bridge the dimensional gap visible in the reference;\n- no people, creatures, UI, text, buttons, logos, furniture, branded imagery or third-party IP;\n- no runtime wiring, catalog mapping, save/schema/reward/curriculum change, Replit/Floot use, deployment or `main` change.\n\n### Exact staged foreground assets\n\n- Preserved source: `{f['source']['path']}` — **1536×1536**, {f['source']['bytes']:,} bytes, SHA-256 `{f['source']['sha256']}`, Git blob `{f['source']['gitBlobSha']}`.\n- Full transparent layer: `{f['full']['path']}` — **1536×1536**, {f['full']['bytes']:,} bytes, SHA-256 `{f['full']['sha256']}`, Git blob `{f['full']['gitBlobSha']}`; alpha bbox `{f['full']['alphaBbox']}`.\n- Optimized transparent derivative: `{f['optimized']['path']}` — **768×768**, {f['optimized']['bytes']:,} bytes, SHA-256 `{f['optimized']['sha256']}`, Git blob `{f['optimized']['gitBlobSha']}`; alpha bbox `{f['optimized']['alphaBbox']}`.\n- Exact origin readback: **PASS 3/3 exact SHA-256**; intake evidence: `{intake_path}`.\n\nProvenance: Adobe generation request `61fc0ea8-925b-4bf4-bfa7-6e5d701eef39`, center-fill edit request `d8e3db7e-9208-4b5b-a5e6-12c0def9a642`, background-removal request `c12b8574-7643-433a-a893-f70e4e328ca6`, optimized-resize request `540026d2-da28-49bc-b1a3-ae7478790d5d`. The immutable Home source remains `docs/preproduction/reference-screenshots/originals/home-1448x1086.jpeg` at SHA-256 `6a4b110aeaf12a6ab0c629f9181cc6cfa8d4f55a518d4f2a6adb3ac6e756c457`.\n\n### Review state\n\nThis is **producer-staged only**. Reviewer 01 must independently judge art quality against the exact reference pixels; reviewer 14 must independently judge responsive composition, alpha/occlusion behavior and performance. Reviewer 15 may coordinate runtime wiring only after those acceptances and must keep Workstreams 06/09 authoritative for their in-flight avatar/environment assets. No physical-device test or screenshot-parity claim has been made. Existing regression/build/release blockers remain open for their assigned owners.\n'''
            lane_md_path.write_text(md.rstrip()+section+'\n')
          PY

      - name: Commit ledger handoff and remove transient intake workflows
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/preproduction/visuals/lane-13.json docs/preproduction/visuals/lane-13.md
          git rm -f --ignore-unmatch .github/workflows/lane13-home-avatar-stage-v1-intake.yml .github/workflows/lane13-home-avatar-stage-v1-docsync.yml
          if ! git diff --cached --quiet; then
            git commit -m 'visuals(13): hand off Home avatar-stage v1 for independent review'
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/screenshot-match-preproduction; then exit 0; fi
              git fetch origin screenshot-match-preproduction
              git rebase origin/screenshot-match-preproduction
            done
            echo 'lane-13 docs handoff blocked by concurrent edits; no force push' >&2
            exit 1
          fi
