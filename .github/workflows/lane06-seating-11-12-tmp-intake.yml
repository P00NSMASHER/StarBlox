name: StarBlox Lane 06 Seating 11-12 Temporary Intake

on:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - '.github/workflows/lane06-seating-11-12-tmp-intake.yml'
      - 'docs/preproduction/catalog-sprint/lane-06-seating-11-12-tmp-seed.json'

permissions:
  contents: write

concurrency:
  group: starblox-lane06-seating-11-12-intake
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image verifier
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch exact generated bytes, verify Store metadata, retain sources and make 768px derivatives
        run: |
          python3 - <<'PY'
          import io, json, hashlib, subprocess, urllib.request
          from pathlib import Path
          from PIL import Image

          seed_path=Path('docs/preproduction/catalog-sprint/lane-06-seating-11-12-tmp-seed.json')
          seed=json.loads(seed_path.read_text())
          store=json.loads(subprocess.check_output(['node','--input-type=module','-e',"import {store} from './src/gameModel.js'; console.log(JSON.stringify(store));"],text=True))
          by_id={x['id']:x for x in store}
          fields=['name','collectionId','collectionName','type','tier','theme','price','starReq']
          report=[]
          for item in seed['items']:
            actual=by_id.get(item['id'])
            if not actual: raise RuntimeError(f"missing Store item {item['id']}")
            for k in fields:
              if actual.get(k)!=item.get(k): raise RuntimeError(f"{item['id']} {k}: seed={item.get(k)!r} store={actual.get(k)!r}")
            req=urllib.request.Request(item['sourceUrl'],headers={'User-Agent':'StarBlox-Lane06-Seating-Intake/1.0'})
            with urllib.request.urlopen(req,timeout=60) as r: raw=r.read()
            with Image.open(io.BytesIO(raw)) as im:
              im.load()
              if im.format!='PNG' or im.size!=(1024,1024):
                raise RuntimeError(f"{item['id']} expected PNG 1024x1024; got {im.format} {im.size}")
              source_path=Path(item['sourcePath']); source_path.parent.mkdir(parents=True,exist_ok=True)
              if source_path.exists() and source_path.read_bytes()!=raw: raise RuntimeError(f'conflicting existing source {source_path}')
              source_path.write_bytes(raw)
              candidate_path=Path(item['candidatePath']); candidate_path.parent.mkdir(parents=True,exist_ok=True)
              resized=im.convert('RGB').resize((768,768),Image.Resampling.LANCZOS)
              resized.save(candidate_path,format='PNG',optimize=True,compress_level=9)
            def info(p):
              b=p.read_bytes()
              with Image.open(p) as chk:
                chk.load(); dims=list(chk.size); fmt=chk.format
              git_sha=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
              return {'path':str(p),'bytes':len(b),'dimensions':dims,'format':fmt,'sha256':hashlib.sha256(b).hexdigest(),'gitBlobSha':git_sha}
            report.append({'id':item['id'],'source':info(source_path),'candidate':info(candidate_path),'producerPixelCheck':item['producerPixelCheck']})
          if len({x['candidate']['sha256'] for x in report}) != len(report): raise RuntimeError('duplicate candidate bytes')
          print(json.dumps({'metadata':'PASS_2_OF_2','sourceDecode':'PASS_2_OF_2_PNG_1024','candidateDecode':'PASS_2_OF_2_PNG_768','items':report},indent=2))
          PY
      - name: Commit only assigned versioned Seating assets, then remove temporary intake tooling
        run: |
          set -eu
          test "$GITHUB_REF" = 'refs/heads/screenshot-match-preproduction'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/assets/catalog/seating-11-w06-v2.png public/assets/catalog/seating-12-w06-v2.png docs/preproduction/catalog-sprint/recovered-originals/seating-11-12-20260921
          git rm -f -- .github/workflows/lane06-seating-11-12-tmp-intake.yml docs/preproduction/catalog-sprint/lane-06-seating-11-12-tmp-seed.json
          git commit -m 'catalog: stage Lane 06 Seating 11-12 premium repair candidates'
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/screenshot-match-preproduction; then exit 0; fi
            git fetch origin screenshot-match-preproduction
            git rebase origin/screenshot-match-preproduction
            if [ "$attempt" -eq 3 ]; then echo 'safe publication blocked; no force push' >&2; exit 1; fi
          done
