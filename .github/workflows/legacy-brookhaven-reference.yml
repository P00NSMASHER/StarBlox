name: Legacy Brookhaven Reference Analysis

on:
  push:
    branches:
      - feature/brookhaven-exact-parity-shell
    paths:
      - research-inputs/brookhaven/legacy-reference/SOURCE.json
      - scripts/fetch-legacy-brookhaven-reference.mjs
      - scripts/analyze-legacy-brookhaven-reference.mjs
      - package.json
      - .github/workflows/legacy-brookhaven-reference.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch pinned legacy Brookhaven place
        run: |
          npm run roblox:brookhaven-legacy:fetch -- \
            --out .legacy-brookhaven/Brookhaven-2024-github.rbxl \
            --receipt docs/roblox-world/LEGACY_BROOKHAVEN_ACQUISITION.json
          test -s .legacy-brookhaven/Brookhaven-2024-github.rbxl
          test "$(stat -c%s .legacy-brookhaven/Brookhaven-2024-github.rbxl)" = "1276795"
          test "$(git hash-object .legacy-brookhaven/Brookhaven-2024-github.rbxl)" = "c0f49a326ab670ffe6bd8218e5aff680eb5df863"

      - name: Deserialize legacy Brookhaven place
        run: |
          cargo run --manifest-path tools/roblox_catalog_reader/Cargo.toml --quiet -- \
            .legacy-brookhaven/Brookhaven-2024-github.rbxl \
            > .legacy-brookhaven/legacy-dom.json
          test -s .legacy-brookhaven/legacy-dom.json

      - name: Generate current StarBlox world baseline
        run: |
          npm run roblox:brookhaven-world:generate -- \
            --out .legacy-brookhaven/StarBloxBaseline.rbxmx \
            --receipt .legacy-brookhaven/starblox-generation.json
          test -s .legacy-brookhaven/StarBloxBaseline.rbxmx
          cargo run --manifest-path tools/roblox_catalog_reader/Cargo.toml --quiet -- \
            .legacy-brookhaven/StarBloxBaseline.rbxmx \
            > .legacy-brookhaven/starblox-dom.json
          test -s .legacy-brookhaven/starblox-dom.json

      - name: Extract legacy Brookhaven town-center spawn evidence
        run: |
          npm run roblox:brookhaven-legacy:spawn-reference -- \
            --legacy-dom .legacy-brookhaven/legacy-dom.json \
            --starblox-dom .legacy-brookhaven/starblox-dom.json \
            --out docs/roblox-world/LEGACY_BROOKHAVEN_SPAWN_REFERENCE.json
          test -s docs/roblox-world/LEGACY_BROOKHAVEN_SPAWN_REFERENCE.json
          grep -q '"status": "legacy-spawn-reference-extracted"' docs/roblox-world/LEGACY_BROOKHAVEN_SPAWN_REFERENCE.json

      - name: Build legacy profile, diff, and 7B work plan
        run: |
          npm run roblox:brookhaven-legacy:analyze -- \
            --legacy-dom .legacy-brookhaven/legacy-dom.json \
            --starblox-dom .legacy-brookhaven/starblox-dom.json \
            --acquisition docs/roblox-world/LEGACY_BROOKHAVEN_ACQUISITION.json \
            --profile docs/roblox-world/LEGACY_BROOKHAVEN_PROFILE.json \
            --diff docs/roblox-world/LEGACY_VS_STARBLOX_WORLD_DIFF.json \
            --plan docs/roblox-world/LEGACY_BROOKHAVEN_7B_WORKPLAN.json
          test -s docs/roblox-world/LEGACY_BROOKHAVEN_PROFILE.json
          test -s docs/roblox-world/LEGACY_VS_STARBLOX_WORLD_DIFF.json
          test -s docs/roblox-world/LEGACY_BROOKHAVEN_7B_WORKPLAN.json
          grep -q '"status": "legacy-reference-profiled"' docs/roblox-world/LEGACY_BROOKHAVEN_PROFILE.json
          grep -q '"status": "legacy-vs-starblox-compared"' docs/roblox-world/LEGACY_VS_STARBLOX_WORLD_DIFF.json
          grep -q '"status": "legacy-reference-7b-development-plan-generated"' docs/roblox-world/LEGACY_BROOKHAVEN_7B_WORKPLAN.json

      - name: Verify legacy Brookhaven pipeline receipts
        run: npx vitest run src/robloxRuntime/legacyBrookhavenReferencePipeline.test.js

      - name: Commit deterministic analysis receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/roblox-world/LEGACY_BROOKHAVEN_ACQUISITION.json \
            docs/roblox-world/LEGACY_BROOKHAVEN_SPAWN_REFERENCE.json \
            docs/roblox-world/LEGACY_BROOKHAVEN_PROFILE.json \
            docs/roblox-world/LEGACY_VS_STARBLOX_WORLD_DIFF.json \
            docs/roblox-world/LEGACY_BROOKHAVEN_7B_WORKPLAN.json
          if git diff --cached --quiet; then
            echo "Legacy Brookhaven receipts already current."
          else
            git commit -m "Generate legacy Brookhaven analysis receipts [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
