name: Bootstrap Art Prompt Optimizer
on:
  push:
    branches: [art-prompt-optimizer-build-20260921]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact optimizer payload
        env:
          PAYLOAD: 
        run: |
          printf '%s' "$PAYLOAD" | base64 -d > /tmp/art-prompt.tar.gz
          tar -xzf /tmp/art-prompt.tar.gz -C .
      - name: Test against synthetic guards
        run: node --test scripts/artPromptOptimizer.test.mjs
      - name: Validate against current StarBlox review corpus
        run: node scripts/artPromptOptimizer.mjs validate --repo-root .
      - name: Build real-corpus model and repair queue
        run: |
          mkdir -p /tmp/optimizer-evidence
          node scripts/artPromptOptimizer.mjs train --repo-root . --output /tmp/optimizer-evidence/model.json
          node scripts/artPromptOptimizer.mjs recommend --repo-root . --all-rework --variants 4 --output /tmp/optimizer-evidence/recommendations.json
          cat /tmp/optimizer-evidence/model.json
      - name: Commit additive optimizer files to build branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/artPromptOptimizer.mjs scripts/artPromptOptimizer.test.mjs docs/preproduction/art-prompt-optimizer .github/workflows/art-prompt-optimizer.yml
          git commit -m "art: add review-driven prompt optimizer"
          git push
      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: art-prompt-optimizer-bootstrap-${{ github.sha }}
          path: /tmp/optimizer-evidence/
          retention-days: 7
