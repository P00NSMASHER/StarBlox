name: Diagnose Legacy Brookhaven Runtime

on:
  push:
    branches:
      - main
    paths:
      - scripts/diagnose-legacy-brookhaven-runtime.mjs
      - .github/workflows/diagnose-legacy-brookhaven-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run published StarBlox runtime diagnostic
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
          STARBLOX_RUNTIME_DIAGNOSTIC_OUT: ${{ github.workspace }}/runtime-diagnostic.json
        run: node scripts/diagnose-legacy-brookhaven-runtime.mjs

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starblox-legacy-runtime-diagnostic
          path: runtime-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7
