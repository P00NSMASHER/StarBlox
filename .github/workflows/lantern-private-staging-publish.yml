name: Lantern Private Staging Publish

on:
  push:
    branches: [lantern-private-staging-release-20260929]
    paths:
      - "lantern-island/release/PUBLISH_REQUEST.json"

permissions:
  contents: read

concurrency:
  group: lantern-private-staging-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate immutable publish request
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('lantern-island/release/PUBLISH_REQUEST.json','utf8'));
          const expected={
            productionSourceCommit:'95eb213339a775e340816e9f75eaee149860b988',
            sourceFingerprint:'378ec64d8122fc782b6ce796829dfd8cc879c2b0b7a303662177ea191197f332',
            artifactSha256:'1b3032a38c69293f1347430a4342dd100efddbaf3c9ae9e3614b86e8c154bb0d',
            universeId:'6027194615',
            placeId:'17602626136',
            channel:'private-staging'
          };
          for(const [k,v] of Object.entries(expected)){
            if(String(r[k]??'')!==v) throw new Error('publish request mismatch '+k);
          }
          if(r.visibilityChangeAllowed!==false) throw new Error('visibility changes must remain forbidden');
          if(r.publicAccessChangeAllowed!==false) throw new Error('public access changes must remain forbidden');
          console.log('LANTERN_PUBLISH_REQUEST_OK');
          NODE

      - name: Prove production source did not drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 95eb213339a775e340816e9f75eaee149860b988 --             lantern-island/default.project.json             lantern-island/src             lantern-island/tests             lantern-island/tools/build.mjs             lantern-island/tools/test-profile.mjs

      - name: Confirm stored authority and exact target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_OPEN_CLOUD_API_KEY"
          test "$ROBLOX_UNIVERSE_ID" = "6027194615"
          test "$ROBLOX_PLACE_ID" = "17602626136"
          echo "LANTERN_PUBLISH_AUTHORITY_OK"

      - name: Install official Rojo 7.7.0 Linux binary
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip"
          curl -fL "$url" -o /tmp/rojo.zip
          echo "22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  /tmp/rojo.zip" | sha256sum -c -
          rm -rf /tmp/rojo-unpack
          mkdir -p /tmp/rojo-unpack "$HOME/.local/bin"
          unzip -q /tmp/rojo.zip -d /tmp/rojo-unpack
          binary="$(find /tmp/rojo-unpack -type f -name rojo -print -quit)"
          test -n "$binary"
          install -m 755 "$binary" "$HOME/.local/bin/rojo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rojo" --version

      - name: Reproduce exact Studio-tested artifact
        run: node scripts/build-lantern-tested-artifact.mjs

      - name: Publish exact artifact to existing private staging place and verify server boot
        run: node scripts/publish-lantern-private-staging.mjs

      - name: Upload publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lantern-private-staging-publish
          path: |
            lantern-island/dist/ci-repro-receipt.json
            lantern-island/dist/private-staging-publish-receipt.json
          if-no-files-found: warn
          retention-days: 30
