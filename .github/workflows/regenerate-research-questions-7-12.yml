name: Regenerate research question bank 7-12

on:
  push:
    branches:
      - questions/research-improvements-7-12
    paths:
      - scripts/sync-question-bank-from-abvm.mjs
      - .github/workflows/regenerate-research-questions-7-12.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: questions/research-improvements-7-12
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate current certified bank with research improvements 7-12
        shell: bash
        run: |
          set -euo pipefail
          SCANNER_COMMIT=$(node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const source=JSON.parse(readFileSync('docs/phase6/ABVM_GRADE2_ROTATING_QUESTION_SOURCE.json','utf8'));
          process.stdout.write(String(source?.generatedFrom?.scannerCommit||'unknown'));
          NODE
          )
          node scripts/sync-question-bank-from-abvm.mjs \
            --pack docs/phase6/ABVM_CURRENT_STUDY_PACK.json \
            --pack-out docs/phase6/ABVM_CURRENT_STUDY_PACK.json \
            --source-out docs/phase6/ABVM_GRADE2_ROTATING_QUESTION_SOURCE.json \
            --lua-out roblox/src/server/CoreQuestionBank.luau \
            --scanner-commit "$SCANNER_COMMIT"

      - name: Validate independent Grade 2 alignment
        run: node scripts/validate-question-alignment.mjs

      - name: Run focused question-engine tests
        run: |
          npm install --no-audit --no-fund
          npx vitest run \
            src/robloxRuntime/phase6QuestionBank.test.js \
            src/robloxRuntime/dailyQuestionSync.test.js \
            src/robloxRuntime/questionAlignmentValidator.test.js \
            src/robloxRuntime/questionItemReview.test.js \
            src/robloxRuntime/researchQuestionImprovements.test.js \
            src/robloxRuntime/researchQuestionImprovements712.test.js \
            src/robloxRuntime/coreLoopProof.test.js \
            src/robloxRuntime/phase6Retention.test.js \
            src/robloxRuntime/phase7EconomyHomes.test.js

      - name: Commit generated bank and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/regenerate-research-questions-7-12.yml
          git add \
            docs/phase6/ABVM_GRADE2_ROTATING_QUESTION_SOURCE.json \
            roblox/src/server/CoreQuestionBank.luau
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Grade 2 bank with research improvements 7-12"
          git push origin HEAD:questions/research-improvements-7-12
