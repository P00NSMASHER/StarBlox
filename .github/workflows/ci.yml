name: StarBlox CI

on:
  push:
    branches: [main, screenshot-match-preproduction]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'public/assets/catalog-candidates/**'
  pull_request:
    branches: [main]

concurrency:
  group: starblox-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: timeout 120s npm test -- --reporter=verbose
      - name: Run art factory contract tests
        run: |
          node --test \
            scripts/artPromptOptimizer.node-test.mjs \
            scripts/artFactoryJob.node-test.mjs \
            scripts/artReviewNormalizer.node-test.mjs \
            scripts/artFactoryState.node-test.mjs \
            scripts/artFactoryStagedHandoff.node-test.mjs \
            scripts/artQaWorkflowContract.node-test.mjs \
            scripts/catalogFallbackBacklog.node-test.mjs \
            scripts/artRegenerationQueue.node-test.mjs \
            scripts/artWorkflowAudit.node-test.mjs
          python3 scripts/artPromptTokenPreflight.py --self-test
      - name: Build production bundle
        run: npm run build
