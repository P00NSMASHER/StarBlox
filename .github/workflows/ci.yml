name: StarBlox CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test Roblox file reader
        run: npm run roblox:catalog:reader:test
      - name: Smoke-test Roblox capability catalog
        run: |
          npm run roblox:catalog -- --input tools/roblox_catalog_reader/fixtures/sample.rbxmx --out /tmp/roblox-catalog.json --report /tmp/roblox-catalog.md
          grep -q "Licensed House System" /tmp/roblox-catalog.md
          grep -q '"instanceCount"' /tmp/roblox-catalog.json
          grep -q '"schemaVersion": 2' /tmp/roblox-catalog.json
          grep -q '"inventory"' /tmp/roblox-catalog.json
          grep -q '"uiTrees"' /tmp/roblox-catalog.json
      - name: Test Roblox migration exporter
        run: npm run roblox:migration:exporter:test
      - name: Smoke-test Brookhaven migration staging compiler
        run: |
          npm run roblox:migrate -- --catalog /tmp/roblox-catalog.json --source-root tools/roblox_catalog_reader/fixtures --out-dir /tmp/roblox-migration --min-score 0
          test -f /tmp/roblox-migration/migration-plan.json
          test -f /tmp/roblox-migration/migration-bundle.json
          grep -q '"liveActivationAllowed": false' /tmp/roblox-migration/migration-bundle.json
          grep -q '"activation": "staging-only"' /tmp/roblox-migration/migration-bundle.json
          find /tmp/roblox-migration -name '*.rbxmx' -print -quit | grep -q .
      - name: Smoke-test automated content expansion planning
        run: |
          npm run content:expand -- --brief tools/content_expansion/fixtures/brief.json --catalog /tmp/roblox-catalog.json --chunks tools/content_expansion/fixtures/chunks.json --out /tmp/content-expansion-plan.json
          grep -q '"expansionId"' /tmp/content-expansion-plan.json
          grep -q '"levelHash"' /tmp/content-expansion-plan.json
          grep -q '"liveActivationAllowed"' /tmp/content-expansion-plan.json || true
      - name: Run tests
        run: npm test
      - name: Run certification gate
        run: npm run certification:gate
      - name: Run balance gate
        run: npm run balance:gate
      - name: Build production bundle
        run: npm run build
