name: StarBlox CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Setup pinned Roblox toolchain
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0
          path: .
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prove native Roblox build
        run: npm run roblox:native:build-proof
      - name: Prove Roblox Studio sync baseline
        run: npm run roblox:studio-sync-proof
      - name: Test Roblox file reader
        run: npm run roblox:catalog:reader:test
      - name: Smoke-test Roblox source preflight
        run: |
          npm run roblox:source:preflight -- --input tools/roblox_catalog_reader/fixtures --out /tmp/roblox-source-preflight.json --handoff /tmp/roblox-catalog-handoff.json
          grep -q '"ready": true' /tmp/roblox-source-preflight.json
          grep -q '"fileCount": 1' /tmp/roblox-source-preflight.json
          grep -Eq '"sha256": "[a-f0-9]{64}"' /tmp/roblox-source-preflight.json
          grep -q '"version": "starblox-roblox-catalog-handoff-v1"' /tmp/roblox-catalog-handoff.json
          grep -q '"ready": true' /tmp/roblox-catalog-handoff.json
          mkdir -p /tmp/no-roblox-sources
          if npm run roblox:source:preflight -- --input /tmp/no-roblox-sources --out /tmp/no-roblox-sources.json --handoff /tmp/no-roblox-handoff.json; then
            echo "expected empty source preflight to fail"
            exit 1
          fi
          grep -q '"ready": false' /tmp/no-roblox-handoff.json
      - name: Smoke-test safe Roblox ingestion command
        run: |
          rm -rf /tmp/roblox-safe-ingest
          npm run roblox:ingest -- --input tools/roblox_catalog_reader/fixtures --out-dir /tmp/roblox-safe-ingest --source-id ci-authorized
          test -f /tmp/roblox-safe-ingest/source-preflight.json
          test -f /tmp/roblox-safe-ingest/catalog-handoff.json
          test -f /tmp/roblox-safe-ingest/capability-catalog.json
          test -f /tmp/roblox-safe-ingest/capability-catalog.md
          test -f /tmp/roblox-safe-ingest/ingestion-receipt.json
          grep -q '"status": "cataloged"' /tmp/roblox-safe-ingest/ingestion-receipt.json
          grep -q '"migrationStarted": false' /tmp/roblox-safe-ingest/ingestion-receipt.json
          if npm run roblox:ingest -- --input tools/roblox_catalog_reader/fixtures --out-dir tools/roblox_catalog_reader/fixtures/generated-ingest; then
            echo "expected in-source output rejection"
            exit 1
          fi
          if npm run roblox:ingest -- --input tools/roblox_catalog_reader/fixtures --out-dir /tmp/roblox-safe-ingest; then
            echo "expected existing-output rejection"
            exit 1
          fi
      - name: Prove real binary RBXL ingestion from pinned BloxForge source
        run: |
          rm -rf /tmp/bloxforge-real-source /tmp/bloxforge-real-ingest
          mkdir -p /tmp/bloxforge-real-source
          base64 --decode tools/roblox_catalog_reader/fixtures/external/bloxforge-baseplate-ef98c370.rbxl.b64 > /tmp/bloxforge-real-source/Baseplate.rbxl
          test "$(git hash-object /tmp/bloxforge-real-source/Baseplate.rbxl)" = "710aa68f25ae659157493d386a9d6508e0331e10"
          npm run roblox:ingest -- --input /tmp/bloxforge-real-source/Baseplate.rbxl --out-dir /tmp/bloxforge-real-ingest --source-id bloxforge-baseplate-ef98c370
          test -f /tmp/bloxforge-real-ingest/source-preflight.json
          test -f /tmp/bloxforge-real-ingest/catalog-handoff.json
          test -f /tmp/bloxforge-real-ingest/capability-catalog.json
          test -f /tmp/bloxforge-real-ingest/capability-catalog.md
          test -f /tmp/bloxforge-real-ingest/ingestion-receipt.json
          grep -q '"status": "cataloged"' /tmp/bloxforge-real-ingest/ingestion-receipt.json
          grep -q '"migrationStarted": false' /tmp/bloxforge-real-ingest/ingestion-receipt.json
          grep -q '"studioMutationStarted": false' /tmp/bloxforge-real-ingest/ingestion-receipt.json
          grep -q '"publicationStarted": false' /tmp/bloxforge-real-ingest/ingestion-receipt.json
          grep -q '"schemaVersion": 2' /tmp/bloxforge-real-ingest/capability-catalog.json
          grep -q '"sourceFingerprintCount": 1' /tmp/bloxforge-real-ingest/capability-catalog.json
          node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          const catalog=JSON.parse(await readFile('/tmp/bloxforge-real-ingest/capability-catalog.json','utf8'));
          const receipt=JSON.parse(await readFile('/tmp/bloxforge-real-ingest/ingestion-receipt.json','utf8'));
          const inventoryCounts=Object.fromEntries(
            Object.entries(catalog.inventory || {}).map(([key,value]) => [
              key,
              Array.isArray(value) ? value.length : null
            ])
          );
          console.log('REAL_RBXL_CAPABILITY_REVIEW=' + JSON.stringify({
            sourceId:receipt.sourceId,
            catalogHash:catalog.catalogHash,
            summary:catalog.summary,
            inventoryCounts,
            nextStep:receipt.nextStep,
            migrationStarted:receipt.migrationStarted,
            studioMutationStarted:receipt.studioMutationStarted,
            publicationStarted:receipt.publicationStarted
          }));
          NODE
      - name: Prove rich real RBXL ingestion and capability review
        run: |
          rm -rf /tmp/rich-real-source /tmp/rich-real-ingest
          mkdir -p /tmp/rich-real-source
          base64 --decode tools/roblox_catalog_reader/fixtures/external/slash-mayhem-shadow-cc6aed05.rbxl.b64 > /tmp/rich-real-source/Slash-Meyhem-Shadow-Edition.rbxl
          test "$(git hash-object /tmp/rich-real-source/Slash-Meyhem-Shadow-Edition.rbxl)" = "134605d10270906eae89edbdaba006ce91963668"
          npm run roblox:ingest -- --input /tmp/rich-real-source/Slash-Meyhem-Shadow-Edition.rbxl --out-dir /tmp/rich-real-ingest --source-id slash-mayhem-shadow-cc6aed05
          test -f /tmp/rich-real-ingest/source-preflight.json
          test -f /tmp/rich-real-ingest/catalog-handoff.json
          test -f /tmp/rich-real-ingest/capability-catalog.json
          test -f /tmp/rich-real-ingest/capability-catalog.md
          test -f /tmp/rich-real-ingest/ingestion-receipt.json
          grep -q '"status": "cataloged"' /tmp/rich-real-ingest/ingestion-receipt.json
          grep -q '"migrationStarted": false' /tmp/rich-real-ingest/ingestion-receipt.json
          grep -q '"studioMutationStarted": false' /tmp/rich-real-ingest/ingestion-receipt.json
          grep -q '"publicationStarted": false' /tmp/rich-real-ingest/ingestion-receipt.json
          node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          const catalog=JSON.parse(await readFile('/tmp/rich-real-ingest/capability-catalog.json','utf8'));
          const receipt=JSON.parse(await readFile('/tmp/rich-real-ingest/ingestion-receipt.json','utf8'));
          const summary=catalog.summary || {};
          if(!(summary.instanceCount > 80)) throw new Error('expected richer place to contain more than 80 instances');
          if(!(summary.scriptCount > 0)) throw new Error('expected richer place to contain at least one script');
          if(!(summary.systemCandidateCount > 0)) throw new Error('expected richer place to produce system candidates');
          if(summary.sourceFingerprintCount !== 1) throw new Error('expected exactly one source fingerprint');
          if(receipt.migrationStarted !== false) throw new Error('migration must remain disabled');
          if(receipt.studioMutationStarted !== false) throw new Error('Studio mutation must remain disabled');
          if(receipt.publicationStarted !== false) throw new Error('publication must remain disabled');
          const inventoryCounts=Object.fromEntries(
            Object.entries(catalog.inventory || {}).map(([key,value]) => [
              key,
              Array.isArray(value) ? value.length : null
            ])
          );
          console.log('RICH_REAL_RBXL_CAPABILITY_REVIEW=' + JSON.stringify({
            sourceId:receipt.sourceId,
            catalogHash:catalog.catalogHash,
            summary,
            inventoryCounts,
            nextStep:receipt.nextStep,
            migrationStarted:receipt.migrationStarted,
            studioMutationStarted:receipt.studioMutationStarted,
            publicationStarted:receipt.publicationStarted
          }));
          NODE
      - name: Prepare one bounded real-source Studio cycle packet
        run: |
          rm -rf /tmp/m4-discovery /tmp/m4-plan /tmp/m4-export
          npm run roblox:migrate -- --ingestion-receipt /tmp/rich-real-ingest/ingestion-receipt.json --out-dir /tmp/m4-discovery --min-score 0
          npm run roblox:select-studio-unit -- --plan /tmp/m4-discovery/migration-plan.json --rules-out /tmp/m4-rules.json --selection-out /tmp/m4-selection.json
          npm run roblox:migrate -- --ingestion-receipt /tmp/rich-real-ingest/ingestion-receipt.json --out-dir /tmp/m4-plan --rules /tmp/m4-rules.json
          node --input-type=module - <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const selection=JSON.parse(await readFile('/tmp/m4-selection.json','utf8'));
          const plan=JSON.parse(await readFile('/tmp/m4-plan/migration-plan.json','utf8'));
          const chosen=plan.units.filter(unit => unit.selected);
          if(chosen.length !== 1) throw new Error('expected exactly one selected unit, found ' + chosen.length);
          if(chosen[0].unitId !== selection.unit.unitId) throw new Error('bounded plan selected wrong unit');
          if(chosen[0].migrationStrategy !== 'refactor') throw new Error('first Studio cycle must use refactor strategy');
          if(chosen[0].exportDisposition !== 'quarantine') throw new Error('first Studio cycle must remain quarantined');
          if(chosen[0].riskFlags.length !== 0) throw new Error('first Studio cycle must be risk-flag free');
          await writeFile('/tmp/m4-task.json',JSON.stringify({
            id:'milestone-4-real-studio-cycle',
            request:[
              'Adapt exactly the verified migrated quarantine unit for StarBlox.',
              'Preserve quarantine boundaries.',
              'Require Studio tests and a single-player playtest.',
              'Inspect runtime logs and capture viewport evidence.',
              'Do not publish, upload, purchase, or enable live activation.'
            ].join(' '),
            migration:{
              exportReceipt:'/tmp/m4-export/migration-export-receipt.json',
              unitIds:[chosen[0].unitId]
            }
          },null,2)+'\n');
          console.log('MILESTONE4_SELECTED_UNIT=' + JSON.stringify(selection.unit));
          NODE
          npm run roblox:migrate -- --planning-receipt /tmp/m4-plan/migration-planning-receipt.json --source-root /tmp/rich-real-source --out-dir /tmp/m4-export
          npm run studio:factory -- --task /tmp/m4-task.json --verify-migration-only --out /tmp/m4-factory-evidence.json
          grep -q '"status": "verified"' /tmp/m4-factory-evidence.json
          grep -q '"scope": "quarantine-refactor-only"' /tmp/m4-factory-evidence.json
          grep -q '"liveActivationAllowed": false' /tmp/m4-factory-evidence.json
          if npm run studio:factory -- --task /tmp/m4-task.json --adapter tools/dev_factory/fixtures/unattested-adapter.mjs --out /tmp/m4-run.json > /tmp/m4-unattested.log 2>&1; then
            echo "expected real migration task to fail without attested Studio"
            exit 1
          fi
          grep -q "requires an attested live Studio connector" /tmp/m4-unattested.log
          test ! -f /tmp/m4-run.json
      - name: Smoke-test Roblox capability catalog
        run: |
          npm run roblox:catalog -- --preflight /tmp/roblox-catalog-handoff.json --out /tmp/roblox-catalog.json --report /tmp/roblox-catalog.md
          grep -q "Licensed House System" /tmp/roblox-catalog.md
          grep -q '"instanceCount"' /tmp/roblox-catalog.json
          grep -q '"schemaVersion": 2' /tmp/roblox-catalog.json
          grep -q '"inventory"' /tmp/roblox-catalog.json
          grep -q '"uiTrees"' /tmp/roblox-catalog.json
          grep -Eq '"sha256": "[a-f0-9]{64}"' /tmp/roblox-catalog.json
          grep -q '"sourceFingerprintCount": 1' /tmp/roblox-catalog.json
      - name: Prove catalog handoff rejects post-preflight source drift
        run: |
          mkdir -p /tmp/roblox-handoff-drift
          cp tools/roblox_catalog_reader/fixtures/sample.rbxmx /tmp/roblox-handoff-drift/sample.rbxmx
          npm run roblox:source:preflight -- --input /tmp/roblox-handoff-drift --handoff /tmp/roblox-handoff-drift.json --out /tmp/roblox-handoff-drift-report.json
          printf '\n' >> /tmp/roblox-handoff-drift/sample.rbxmx
          if npm run roblox:catalog -- --preflight /tmp/roblox-handoff-drift.json --out /tmp/roblox-handoff-drift-catalog.json --report /tmp/roblox-handoff-drift-catalog.md; then
            echo "expected catalog handoff fingerprint mismatch"
            exit 1
          fi
      - name: Plan migration directly from ingestion receipt
        run: |
          rm -rf /tmp/roblox-receipt-plan
          npm run roblox:migrate -- --ingestion-receipt /tmp/roblox-safe-ingest/ingestion-receipt.json --out-dir /tmp/roblox-receipt-plan --min-score 0
          test -f /tmp/roblox-receipt-plan/migration-plan.json
          test -f /tmp/roblox-receipt-plan/migration-plan.md
          test -f /tmp/roblox-receipt-plan/migration-planning-receipt.json
          test ! -f /tmp/roblox-receipt-plan/migration-bundle.json
          grep -q '"catalogHash"' /tmp/roblox-receipt-plan/migration-plan.json
          grep -q '"version": "starblox-roblox-migration-planning-v1"' /tmp/roblox-receipt-plan/migration-planning-receipt.json
          grep -q '"exportStarted": false' /tmp/roblox-receipt-plan/migration-planning-receipt.json
          grep -q '"migrationBundleCreated": false' /tmp/roblox-receipt-plan/migration-planning-receipt.json
          grep -Eq '"receiptHash": "sha256:[a-f0-9]{64}"' /tmp/roblox-receipt-plan/migration-planning-receipt.json
          node --input-type=module - <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFile} from 'node:fs/promises';
          const receipt=JSON.parse(await readFile('/tmp/roblox-receipt-plan/migration-planning-receipt.json','utf8'));
          const plan=await readFile('/tmp/roblox-receipt-plan/migration-plan.json');
          const ingest=await readFile('/tmp/roblox-safe-ingest/ingestion-receipt.json');
          const digest=value => createHash('sha256').update(value).digest('hex');
          if(digest(plan)!==receipt.artifacts.migrationPlan.sha256) throw new Error('plan SHA mismatch');
          if(digest(ingest)!==receipt.input.ingestionReceipt.sha256) throw new Error('ingestion receipt SHA mismatch');
          const {receiptHash,...payload}=receipt;
          const expected='sha256:'+createHash('sha256').update(JSON.stringify(payload)).digest('hex');
          if(expected!==receiptHash) throw new Error('planning receipt payload hash mismatch');
          NODE
          mkdir -p /tmp/roblox-receipt-tamper
          cp -R /tmp/roblox-safe-ingest/. /tmp/roblox-receipt-tamper/
          printf '\n' >> /tmp/roblox-receipt-tamper/capability-catalog.json
          if npm run roblox:migrate -- --ingestion-receipt /tmp/roblox-receipt-tamper/ingestion-receipt.json --out-dir /tmp/roblox-receipt-tamper-plan --min-score 0; then
            echo "expected ingestion receipt catalog fingerprint mismatch"
            exit 1
          fi
      - name: Test Roblox migration exporter
        run: npm run roblox:migration:exporter:test
      - name: Prove export requires exact planning receipt
        run: |
          rm -rf /tmp/roblox-no-receipt-export
          if npm run roblox:migrate -- --catalog /tmp/roblox-catalog.json --source-root tools/roblox_catalog_reader/fixtures --out-dir /tmp/roblox-no-receipt-export --min-score 0; then
            echo "expected export without planning receipt to fail"
            exit 1
          fi
          rm -rf /tmp/roblox-tampered-plan
          cp -R /tmp/roblox-receipt-plan /tmp/roblox-tampered-plan
          printf '\n' >> /tmp/roblox-tampered-plan/migration-plan.json
          if npm run roblox:migrate -- --planning-receipt /tmp/roblox-tampered-plan/migration-planning-receipt.json --source-root tools/roblox_catalog_reader/fixtures --out-dir /tmp/roblox-tampered-plan-export; then
            echo "expected tampered approved plan to fail"
            exit 1
          fi
      - name: Smoke-test planning-receipt-gated migration export
        run: |
          rm -rf /tmp/roblox-migration
          npm run roblox:migrate -- --planning-receipt /tmp/roblox-receipt-plan/migration-planning-receipt.json --source-root tools/roblox_catalog_reader/fixtures --out-dir /tmp/roblox-migration
          test -f /tmp/roblox-migration/migration-plan.json
          test -f /tmp/roblox-migration/migration-plan.md
          test -f /tmp/roblox-migration/migration-planning-receipt.json
          test -f /tmp/roblox-migration/migration-bundle.json
          test -f /tmp/roblox-migration/migration-export-receipt.json
          grep -q '"liveActivationAllowed": false' /tmp/roblox-migration/migration-bundle.json
          grep -q '"activation": "staging-only"' /tmp/roblox-migration/migration-bundle.json
          grep -q '"exportCompleted": true' /tmp/roblox-migration/migration-export-receipt.json
          grep -q '"studioMutationStarted": false' /tmp/roblox-migration/migration-export-receipt.json
          grep -q '"publicationStarted": false' /tmp/roblox-migration/migration-export-receipt.json
          grep -Eq '"receiptHash": "sha256:[a-f0-9]{64}"' /tmp/roblox-migration/migration-export-receipt.json
          find /tmp/roblox-migration -name '*.rbxmx' -print -quit | grep -q .
          node --input-type=module - <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFile} from 'node:fs/promises';
          import {verifyMigrationBundleAgainstPlan} from './src/robloxMigration/migrationBundle.js';
          const digest=value => createHash('sha256').update(value).digest('hex');
          const receipt=JSON.parse(await readFile('/tmp/roblox-migration/migration-export-receipt.json','utf8'));
          const planning=await readFile('/tmp/roblox-migration/migration-planning-receipt.json');
          const planBytes=await readFile('/tmp/roblox-migration/migration-plan.json');
          const bundleBytes=await readFile('/tmp/roblox-migration/migration-bundle.json');
          const plan=JSON.parse(planBytes);
          const bundle=JSON.parse(bundleBytes);
          if(digest(planning)!==receipt.input.planningReceipt.sha256) throw new Error('planning receipt SHA mismatch');
          if(digest(planBytes)!==receipt.input.migrationPlan.sha256) throw new Error('plan SHA mismatch');
          if(digest(bundleBytes)!==receipt.bundle.sha256) throw new Error('bundle SHA mismatch');
          const binding=verifyMigrationBundleAgainstPlan(bundle,plan);
          if(!binding.ok) throw new Error(binding.errors.join('; '));
          if(binding.bindingHash!==receipt.bundle.planBindingHash) throw new Error('plan binding hash mismatch');
          const {receiptHash,...payload}=receipt;
          const expected='sha256:'+createHash('sha256').update(JSON.stringify(payload)).digest('hex');
          if(expected!==receiptHash) throw new Error('export receipt payload hash mismatch');
          NODE
      - name: Gate AI factory migration inputs on exact export evidence
        run: |
          node --input-type=module - <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const plan=JSON.parse(await readFile('/tmp/roblox-migration/migration-plan.json','utf8'));
          const eligible=plan.units
            .filter(unit =>
              unit.selected === true &&
              unit.exportDisposition === 'quarantine' &&
              ['refactor','quarantine'].includes(unit.migrationStrategy)
            )
            .map(unit => unit.unitId)
            .sort();
          if(!eligible.length) throw new Error('fixture produced no quarantine/refactor migration unit');
          await writeFile('/tmp/factory-migration-task.json',JSON.stringify({
            id:'ci-migration-adaptation',
            request:'Adapt verified migrated quarantine units',
            migration:{
              exportReceipt:'/tmp/roblox-migration/migration-export-receipt.json',
              unitIds:eligible
            }
          },null,2)+'\n');
          NODE
          npm run studio:factory -- --task /tmp/factory-migration-task.json --verify-migration-only --out /tmp/factory-migration-evidence.json
          grep -q '"version": "starblox-dev-factory-migration-input-v1"' /tmp/factory-migration-evidence.json
          grep -q '"status": "verified"' /tmp/factory-migration-evidence.json
          grep -q '"scope": "quarantine-refactor-only"' /tmp/factory-migration-evidence.json
          grep -q '"liveActivationAllowed": false' /tmp/factory-migration-evidence.json
          grep -Eq '"artifactSha256": "[a-f0-9]{64}"' /tmp/factory-migration-evidence.json
          rm -rf /tmp/roblox-migration-factory-tamper
          cp -R /tmp/roblox-migration /tmp/roblox-migration-factory-tamper
          node --input-type=module - <<'NODE'
          import {readFile,writeFile,appendFile} from 'node:fs/promises';
          import {resolve} from 'node:path';
          const task=JSON.parse(await readFile('/tmp/factory-migration-task.json','utf8'));
          const bundle=JSON.parse(await readFile('/tmp/roblox-migration-factory-tamper/migration-bundle.json','utf8'));
          const unitId=task.migration.unitIds[0];
          const artifact=bundle.artifacts.find(row => row.unitId===unitId);
          if(!artifact) throw new Error('eligible unit artifact missing');
          await appendFile(resolve('/tmp/roblox-migration-factory-tamper',artifact.file),'\n');
          task.migration.exportReceipt='/tmp/roblox-migration-factory-tamper/migration-export-receipt.json';
          await writeFile('/tmp/factory-migration-tamper-task.json',JSON.stringify(task,null,2)+'\n');
          NODE
          if npm run studio:factory -- --task /tmp/factory-migration-tamper-task.json --verify-migration-only --out /tmp/factory-migration-tamper-evidence.json; then
            echo "expected tampered migrated artifact to fail factory verification"
            exit 1
          fi
      - name: Prove Roblox migration rejects source-byte drift
        run: |
          rm -rf /tmp/roblox-source-drift /tmp/roblox-drift-migration
          mkdir -p /tmp/roblox-source-drift
          cp tools/roblox_catalog_reader/fixtures/sample.rbxmx /tmp/roblox-source-drift/sample.rbxmx
          printf '\n' >> /tmp/roblox-source-drift/sample.rbxmx
          if npm run roblox:migrate -- --planning-receipt /tmp/roblox-receipt-plan/migration-planning-receipt.json --source-root /tmp/roblox-source-drift --out-dir /tmp/roblox-drift-migration; then
            echo "expected source fingerprint mismatch"
            exit 1
          fi
      - name: Smoke-test automated content expansion planning
        run: |
          npm run content:expand -- --brief tools/content_expansion/fixtures/brief.json --catalog /tmp/roblox-catalog.json --chunks tools/content_expansion/fixtures/chunks.json --out /tmp/content-expansion-plan.json
          grep -q '"expansionId"' /tmp/content-expansion-plan.json
          grep -q '"levelHash"' /tmp/content-expansion-plan.json
          grep -q '"liveActivationAllowed"' /tmp/content-expansion-plan.json || true
      - name: Test migration adaptation and quarantine-exit boundaries
        run: |
          npx vitest run src/devFactory/developmentFactory.test.js
      - name: Verify pinned Roblox production backbone
        run: npm run roblox:backbone:verify
      - name: Run tests
        run: npm test
      - name: Run certification gate
        run: npm run certification:gate
      - name: Run balance gate
        run: npm run balance:gate
      - name: Build production bundle
        run: npm run build
      - name: Prove real Roblox runtime through Open Cloud
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: npm run roblox:open-cloud-proof
      - name: Publish Step 6 private StarBlox vertical slice
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release/roblox-vertical-slice-step6' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
