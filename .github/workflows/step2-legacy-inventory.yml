name: Step 2 uncapped legacy inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/step2-legacy-inventory.yml'
      - 'scripts/extract-legacy-brookhaven-source-inventory.mjs'
      - 'src/robloxWorld/legacyBrookhavenPathInventory.js'
      - 'src/robloxWorld/legacyBrookhavenPathInventory.test.js'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify uncapped inventory transformer
        run: npx vitest run src/robloxWorld/legacyBrookhavenPathInventory.test.js
      - name: Acquire and deserialize the pinned legacy source without executing scripts
        run: |
          npm run roblox:brookhaven-legacy:fetch -- \
            --out /tmp/Brookhaven.rbxl \
            --receipt /tmp/legacy-source-acquisition.json
          cargo run --quiet --manifest-path tools/roblox_catalog_reader/Cargo.toml -- \
            /tmp/Brookhaven.rbxl > /tmp/legacy-brookhaven-dom.json
      - name: Build uncapped path, asset, and runtime-mapping ledgers
        run: |
          mkdir -p /tmp/step2-uncapped
          node scripts/extract-legacy-brookhaven-source-inventory.mjs \
            --dom /tmp/legacy-brookhaven-dom.json \
            --out /tmp/step2-uncapped/source-inventory.json \
            --path-ledger /tmp/step2-uncapped/path-ledger.csv \
            --asset-ledger /tmp/step2-uncapped/asset-ledger.csv \
            --runtime-mapping /tmp/step2-uncapped/runtime-mapping.csv \
            --path-meta /tmp/step2-uncapped/path-meta.json
          node --input-type=module - <<'NODE'
          import {readFile} from 'node:fs/promises';
          const meta=JSON.parse(await readFile('/tmp/step2-uncapped/path-meta.json','utf8'));
          if(meta.sourceScriptsExecuted!==false || meta.sourceScriptsEvaluated!==false){
            throw new Error('legacy source scripts must remain unexecuted');
          }
          if(meta.instanceCount<=24349) throw new Error('uncapped ledger did not cover the full DOM');
          const requiredKinds=['audio','animation','image','mesh'];
          for(const kind of requiredKinds){
            const count=meta.countsByAssetKind?.[kind];
            if(!Number.isInteger(count) || count<1){
              throw new Error(`${kind} asset references missing`);
            }
          }
          const counted=Object.values(meta.countsByAssetKind).reduce((sum,count)=>sum+count,0);
          if(meta.assetReferenceCount!==counted || meta.assetReferenceCount<1){
            throw new Error('asset reference total is empty or inconsistent');
          }
          if(meta.currentLiveBrookhavenVersionPinned!==false) throw new Error('legacy/current boundary drift');
          if(meta.exactCurrentParityClaimAllowed!==false) throw new Error('parity boundary drift');
          console.log('STEP2_UNCAPPED_INVENTORY='+JSON.stringify(meta));
          NODE
      - name: Upload exact uncapped inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step2-uncapped-legacy-inventory
          path: /tmp/step2-uncapped
          if-no-files-found: error
          retention-days: 30
