name: StarBlox Final V11 Client Gate

on:
  push:
    branches:
      - release/step9-step6-final-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starblox-final-v11-client-gate
  cancel-in-progress: true

jobs:
  verify-client:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify final-client gate unit contract
        run: npx vitest run src/robloxRuntime/finalClientGate.test.js

      - name: Verify exact final phone session from Roblox Data Store
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: node scripts/verify-step9-final-client.mjs
