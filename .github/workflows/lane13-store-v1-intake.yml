name: StarBlox Lane 13 Store v1 Intake

on:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - '.github/workflows/lane13-store-v1-intake.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starblox-lane13-store-v1-intake
  cancel-in-progress: false

jobs:
  stage-scene:
    if: github.ref == 'refs/heads/screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction
          fetch-depth: 0

      - name: Install image verifier
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Stage exact Adobe outputs or verify existing identical bytes
        env:
          FULL_URL: 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:a9ec14ce-2dad-497c-894f-29a0bdd00445'
          DESKTOP_URL: 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:4adfdc54-b2ab-4699-86ef-054220181f16'
        run: |
          set -eu
          mkdir -p public/assets/visuals/lane-13 docs/preproduction/visuals
          FULL='public/assets/visuals/lane-13/store-boutique-w13-v1-full.png'
          DESKTOP='public/assets/visuals/lane-13/store-boutique-w13-v1-1408x1056.png'
          if [ ! -f "$FULL" ]; then curl -fL --retry 2 "$FULL_URL" -o "$FULL"; fi
          if [ ! -f "$DESKTOP" ]; then curl -fL --retry 2 "$DESKTOP_URL" -o "$DESKTOP"; fi
          python3 - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          import hashlib, json

          files=[
            ('full','public/assets/visuals/lane-13/store-boutique-w13-v1-full.png',(2304,1792)),
            ('desktop','public/assets/visuals/lane-13/store-boutique-w13-v1-1408x1056.png',(1408,1056)),
          ]
          out=[]
          for role,p,expected in files:
            b=Path(p).read_bytes()
            im=Image.open(p); im.load()
            if im.format != 'PNG': raise SystemExit(f'{p}: expected PNG, got {im.format}')
            if im.size != expected: raise SystemExit(f'{p}: expected {expected}, got {im.size}')
            rgb=im.convert('RGB')
            stat=ImageStat.Stat(rgb.resize((64,64)))
            if max(stat.var) < 10: raise SystemExit(f'{p}: image variance too low')
            out.append({
              'role':role,'path':p,'format':'PNG','dimensions':list(im.size),
              'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'variance64':stat.var
            })

          report={
            'schemaVersion':1,
            'candidateId':'store-boutique-w13-v1',
            'candidateType':'environment-background',
            'producer':'13',
            'targetScreen':'Store',
            'status':'STAGED_PENDING_ORIGIN_READBACK_AND_INDEPENDENT_REVIEW',
            'reference':{
              'path':'docs/preproduction/reference-screenshots/originals/store-1448x1086.jpeg',
              'sha256':'b26cb14947d85258bcfff211174e54f34f2e2a11b83c73560b2365167071071d'
            },
            'runningRenderEvidence':{
              'workflowRunId':35663655650,
              'artifactId':10668287632,
              'renderHead':'b187186e62519ffa77bd0f7b166c601c90bdc416',
              'file':'store-desktop-1408x1056.png'
            },
            'observedDefect':'Current Store shell is much flatter and more UI-dominant than the immutable reference, with limited boutique architecture/material depth around the catalog and try-on area. This candidate adds only a separate dimensional boutique background; it does not replace catalog cards, item metadata, avatar/equipment rendering or runtime state.',
            'provenance':{
              'sourceMethod':'Adobe image_generate from actual immutable Store reference inspection plus current branch-local Store render comparison; no reference pixels copied into output',
              'generationRequestId':'1f92b4a4-ed9d-41ec-9694-2a535d91055d',
              'sourceAdobeUrn':'urn:aaid:ps:US:a9ec14ce-2dad-497c-894f-29a0bdd00445',
              'sourceFireflyAssetId':'urn:aaid:sc:US:88cb4349-d511-413c-917d-0367c14afa5d',
              'desktopDerivativeMethod':'Adobe image_crop_and_resize center reframe only; source 2304x1792 crop y=32 height=1728 to exact 1408x1056',
              'cropRequestId':'3a6253e1-5209-438d-9204-b67beec5e50b',
              'desktopAdobeUrn':'urn:aaid:ps:US:4adfdc54-b2ab-4699-86ef-054220181f16'
            },
            'compositionContract':[
              'No people, avatars, mannequin, catalog UI, item cards, prices, text, counters, buttons, logos or third-party IP baked into the background.',
              'Warm blush/lilac/cream boutique architecture with warm wood, soft gold light and selective cobalt/cyan accents compatible with StarBlox chrome.',
              'Broad center-left and center kept comparatively calm behind existing catalog/filter UI.',
              'Far-right try-on/avatar zone softly lit and uncluttered behind separately composited equipped-character rendering.',
              'Richer boutique depth concentrated at far-left, upper perimeter and outer-right edges using wardrobe alcove, vanity, shelving, rails, plants, lamps and pedestal forms.',
              'Reference outfit/merchandise is visual guidance only and does not override owned/equipped choices.'
            ],
            'files':out,
            'producerVisualInspection':'PASS_PRODUCER_ONLY_NOT_INDEPENDENT_ACCEPT',
            'runtimeWired':False,
            'canonicalCatalogTouched':False,
            'workstream06AvatarTouched':False,
            'workstream09ActiveEnvironmentTouched':False,
            'replitOrFlootTouched':False,
            'mainTouched':False,
            'originReadback':'PENDING'
          }
          Path('docs/preproduction/visuals/lane-13-store-v1-intake.json').write_text(json.dumps(report,indent=2)+'\n')
          PY

      - name: Commit candidate bytes and intake evidence only
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/assets/visuals/lane-13/store-boutique-w13-v1-full.png public/assets/visuals/lane-13/store-boutique-w13-v1-1408x1056.png docs/preproduction/visuals/lane-13-store-v1-intake.json
          if ! git diff --cached --quiet; then
            git commit -m 'visuals: stage Store boutique v1 candidate'
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/screenshot-match-preproduction; then break; fi
              git fetch origin screenshot-match-preproduction
              git rebase origin/screenshot-match-preproduction
              if [ "$attempt" -eq 3 ]; then echo 'safe publish blocked; no force push' >&2; exit 1; fi
            done
          fi

      - name: Verify exact origin readback and publish PASS evidence
        run: |
          set -eu
          git fetch origin screenshot-match-preproduction
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          p=Path('docs/preproduction/visuals/lane-13-store-v1-intake.json')
          r=json.loads(p.read_text())
          for f in r['files']:
            data=subprocess.check_output(['git','show',f"origin/screenshot-match-preproduction:{f['path']}"])
            got=hashlib.sha256(data).hexdigest()
            if got != f['sha256']:
              raise SystemExit(f"origin readback mismatch {f['path']}: {got} != {f['sha256']}")
            f['originReadbackSha256']=got
            f['gitBlobSha']=subprocess.check_output(['git','rev-parse',f"origin/screenshot-match-preproduction:{f['path']}"]).decode().strip()
          r['originReadback']='PASS_2_OF_2_EXACT_SHA256'
          r['status']='STAGED_READY_FOR_INDEPENDENT_REVIEW'
          r['sourceHeadAfterBinaryPush']=subprocess.check_output(['git','rev-parse','origin/screenshot-match-preproduction']).decode().strip()
          p.write_text(json.dumps(r,indent=2)+'\n')
          PY
          git add -- docs/preproduction/visuals/lane-13-store-v1-intake.json
          if ! git diff --cached --quiet; then
            git commit -m 'visuals: record exact Store v1 origin readback'
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/screenshot-match-preproduction; then exit 0; fi
              git fetch origin screenshot-match-preproduction
              git rebase origin/screenshot-match-preproduction
            done
            echo 'readback evidence publication blocked; no force push' >&2
            exit 1
          fi
