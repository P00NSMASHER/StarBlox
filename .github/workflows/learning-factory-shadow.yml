name: Learning Factory Shadow QA

on:
  push:
    branches:
      - starblox-learning-factory-v1
    paths:
      - "src/learningSourceRegistry.js"
      - "src/currentLearningSourceSnapshots.js"
      - "src/learningContracts.js"
      - "src/contentProvenanceRuntime.js"
      - "src/adversarialQuestionQa.js"
      - "src/learningEventLedger.js"
      - "src/learningEventBridge.js"
      - "src/psiKtShadowAdapter.js"
      - "src/riffShadowAdapter.js"
      - "src/edGameClawShadowAdapter.js"
      - "src/sourceEvidenceRuntime.js"
      - "src/generatedQuestionCompiler.js"
      - "src/selectorV2Shadow.js"
      - "src/*learning*.test.js"
      - "src/adversarialQuestionQa.test.js"
      - "src/App.jsx"
      - "src/main.jsx"
      - "src/gameModel.js"
      - "scripts/validateLearningContent.mjs"
      - "scripts/selectorV2ShadowSimulation.mjs"
      - "scripts/assertLearningLiveSelectorBoundary.mjs"
      - "scripts/assertGeneratedContentLiveBoundary.mjs"
      - "docs/preproduction/learning-factory/current-promotion-decision.json"
      - "scripts/adaptEdGameClawCourse.mjs"
      - "scripts/bindEdGameClawEvidence.mjs"
      - "scripts/compileEdGameClawQuestions.mjs"
      - "scripts/exportPsiKtDataset.mjs"
      - "scripts/exportRiffReviews.mjs"
      - "docs/preproduction/learning-factory/fixtures/**"
      - "package.json"
      - ".github/workflows/learning-factory-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-learning-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install --global npm@11.6.2
          npm install --ignore-scripts --package-lock=false

      - name: Run learning-factory unit tests
        run: npm run test:learning-factory

      - name: Run existing StarBlox learning regression tests
        run: npm run test:learning-regression

      - name: Validate hardened question bank and provenance bundle
        run: npm run validate:learning -- --out=learning-validation-receipt.json

      - name: Run deterministic selector shadow simulation
        run: npm run simulate:learning-shadow

      - name: Smoke-test external learning interop
        run: |
          mkdir -p .learning-interop
          npm run interop:edgameclaw -- --input=docs/preproduction/learning-factory/fixtures/edgameclaw-course.json --out=.learning-interop/edgameclaw.json --content-version=fixture-v1 --source-ids=abvm-grade2-current-source-pack
          npm run interop:psikt -- --input=docs/preproduction/learning-factory/fixtures/learning-ledger.json --out=.learning-interop/interactions_200.csv
          npm run interop:riff -- --input=docs/preproduction/learning-factory/fixtures/learning-ledger.json --out=.learning-interop/riff-reviews.json
          test -s .learning-interop/edgameclaw.json
          test -s .learning-interop/interactions_200.csv
          test -s .learning-interop/riff-reviews.json

      - name: Assert research selectors remain out of live Quest paths
        run: npm run assert:learning-live-boundary

      - name: Smoke-test evidence-bound EdGameClaw candidates
        run: |
          mkdir -p .learning-evidence
          npm run interop:edgameclaw -- --input=docs/preproduction/learning-factory/fixtures/edgameclaw-evidence-course.json --out=.learning-evidence/unbound.json --content-version=evidence-fixture-v1 --source-ids=current-week-vocabulary
          npm run interop:edgameclaw-evidence -- --input=.learning-evidence/unbound.json --out=.learning-evidence/bound.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('.learning-evidence/bound.json','utf8'));
          if(r.issueCount!==0||r.evidenceBoundCount!==1){
            throw new Error('EdGameClaw evidence binding smoke test failed');
          }
          if(r.candidates[0]?.status!=='evidence-bound-shadow-candidate'){
            throw new Error('candidate did not reach evidence-bound status');
          }
          console.log(JSON.stringify({
            evidenceBoundCount:r.evidenceBoundCount,
            binding:r.candidates[0].evidenceBindings[0]
          },null,2));
          NODE

      - name: Compile evidence-bound EdGameClaw assessment
        run: |
          npm run interop:edgameclaw-question -- --input=.learning-evidence/bound.json --out=.learning-evidence/generated-question.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('.learning-evidence/generated-question.json','utf8'));
          if(r.issueCount!==0||r.qaReadyCount!==1){
            throw new Error('generated question compiler smoke test failed');
          }
          const q=r.artifacts[0]?.question;
          if(q?.masteryEligible!==false){
            throw new Error('generated question must remain non-mastery');
          }
          if(q?.qa?.provenance!=='evidence-bound'){
            throw new Error('generated question lost evidence provenance');
          }
          console.log(JSON.stringify({
            qaReadyCount:r.qaReadyCount,
            forcedNonMasteryCount:r.forcedNonMasteryCount,
            adversarialVariantCount:r.adversarialVariantCount,
            questionId:q?.id,
            masteryEligible:q?.masteryEligible,
            provenance:q?.qa?.provenance
          },null,2));
          NODE

      - name: Assert generated content tooling remains out of live runtime
        run: npm run assert:generated-content-live-boundary

      - name: Build StarBlox
        run: npm run build

      - name: Upload validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-validation-receipt
          path: learning-validation-receipt.json
          if-no-files-found: ignore
