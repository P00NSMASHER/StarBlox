name: Bind research bank to verified ABVM scan

on:
  push:
    branches:
      - questions/research-improvements-7-12
    paths:
      - .github/workflows/bind-research-question-bank-scanner.yml

permissions:
  contents: write

jobs:
  refresh-and-bind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout StarBlox
        uses: actions/checkout@v4
        with:
          ref: questions/research-improvements-7-12
          fetch-depth: 0

      - name: Checkout ABVM planner source
        uses: actions/checkout@v4
        with:
          repository: P00NSMASHER/abvmschoolstarworld
          ref: main
          path: .abvm
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run exact ABVM teacher-page scanner
        run: node .abvm/scripts/refresh-teacher-pages.mjs

      - name: Require fresh verified ABVM source
        run: node .abvm/scripts/check-refresh-health.mjs --require-today --max-age-hours 1

      - name: Regenerate with exact scanner commit
        shell: bash
        run: |
          set -euo pipefail
          SCANNER_COMMIT=$(git -C .abvm rev-parse HEAD)
          node scripts/sync-question-bank-from-abvm.mjs \
            --pack .abvm/pages/data/study-pack.json \
            --pack-out docs/phase6/ABVM_CURRENT_STUDY_PACK.json \
            --source-out docs/phase6/ABVM_GRADE2_ROTATING_QUESTION_SOURCE.json \
            --lua-out roblox/src/server/CoreQuestionBank.luau \
            --scanner-commit "$SCANNER_COMMIT"

      - name: Validate independent alignment
        run: node scripts/validate-question-alignment.mjs

      - name: Run focused QA
        run: |
          npm install --no-audit --no-fund
          npx vitest run \
            src/robloxRuntime/phase6QuestionBank.test.js \
            src/robloxRuntime/dailyQuestionSync.test.js \
            src/robloxRuntime/questionAlignmentValidator.test.js \
            src/robloxRuntime/questionItemReview.test.js \
            src/robloxRuntime/researchQuestionImprovements712.test.js \
            src/robloxRuntime/coreLoopProof.test.js

      - name: Commit verified scan binding and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/bind-research-question-bank-scanner.yml
          git add \
            docs/phase6/ABVM_CURRENT_STUDY_PACK.json \
            docs/phase6/ABVM_GRADE2_ROTATING_QUESTION_SOURCE.json \
            roblox/src/server/CoreQuestionBank.luau
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bind research question bank to verified ABVM scan"
          git push origin HEAD:questions/research-improvements-7-12
