name: StarBlox Reference Screenshot Capture

on:
  push:
    branches:
      - screenshot-match-preproduction
    paths:
      - 'catalog-art-manifest.json'
      - 'src/catalogArtRuntime.js'
      - 'src/mobileAccessibilityRuntime.js'
      - 'src/mobileAccessibility.css'
      - 'src/homeScreenshotMatchRuntime.js'
      - 'src/homeScreenshotMatch.css'
      - 'src/storeScreenshotMatchRuntime.js'
      - 'src/storeScreenshotMatch.css'
      - 'src/questScreenshotMatchRuntime.js'
      - 'src/questScreenshotMatch.css'
      - 'scripts/referenceScreenshotCapture.mjs'
      - '.github/workflows/reference-screenshot-capture.yml'
      - 'docs/preproduction/reference-screenshots/**'
  workflow_run:
    workflows:
      - 'Workstream 08 Catalog Integrate'
      - 'StarBlox Workstream 08 Exact-Hash Integration'
    types: [completed]
    branches: [screenshot-match-preproduction]
  workflow_dispatch:

concurrency:
  group: starblox-reference-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-capture:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest preproduction
        uses: actions/checkout@v4
        with:
          ref: screenshot-match-preproduction

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify authoritative desktop reference inputs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const manifestPath='docs/preproduction/reference-screenshots/original-reference-manifest.json';
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const expected=['home','store','quest'];
          for (const screen of expected) {
            const row=manifest.images.find(x=>x.screen===screen);
            if (!row) throw new Error(`${screen}: missing from authoritative reference manifest`);
            for (const [pathKey,hashKey] of [['originalRepositoryPath','originalSha256'],['comparisonRepositoryPath','comparisonSha256']]) {
              const p=row[pathKey];
              if (!p || !fs.existsSync(p)) throw new Error(`${screen}: required reference file missing at ${p}`);
              const actual=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
              if (actual!==row[hashKey]) throw new Error(`${screen}: ${pathKey} SHA-256 mismatch`);
            }
            if (JSON.stringify(row.originalDimensions)!=='[1448,1086]') throw new Error(`${screen}: unexpected original dimensions`);
            if (JSON.stringify(row.comparisonDimensions)!=='[1408,1056]') throw new Error(`${screen}: unexpected comparison dimensions`);
          }
          console.log('PASS: authoritative Home/Store/Quest originals and 1408x1056 comparison PNG hashes verified.');
          NODE

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install capture-only QA dependencies without changing package metadata
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0 @axe-core/playwright@4.10.2 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start local production preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/starblox-reference-preview.log 2>&1 &
          echo $! > /tmp/starblox-reference-preview.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/starblox-reference-preview.log
          exit 1

      - name: Capture deterministic Home Store Quest screenshots
        run: node scripts/referenceScreenshotCapture.mjs
        env:
          STARBLOX_QA_URL: http://127.0.0.1:4173
          STARBLOX_REFERENCE_OUTPUT: artifacts/reference-screenshot-capture
          STARBLOX_REFERENCE_DIR: docs/preproduction/reference-screenshots
          STARBLOX_REFERENCE_REQUIRED: '0'
          STARBLOX_REFERENCE_STRICT_DIFF: '0'

      - name: Bind capture evidence to actual checked-out commit
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const dir='artifacts/reference-screenshot-capture';
          fs.mkdirSync(dir,{recursive:true});
          const testedHead=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8').trim();
          const reportPath=`${dir}/report.json`;
          if(fs.existsSync(reportPath)){
            const data=JSON.parse(fs.readFileSync(reportPath,'utf8'));
            data.triggeringSha=data.triggeringSha || data.sourceHead || process.env.GITHUB_SHA || null;
            data.sourceHead=testedHead;
            fs.writeFileSync(reportPath,JSON.stringify(data,null,2)+'\n');
          }
          fs.writeFileSync(`${dir}/tested-head.txt`,testedHead+'\n');
          console.log(`TESTED_HEAD=${testedHead}`);
          NODE

      - name: Print capture summary
        if: always()
        run: |
          cat artifacts/reference-screenshot-capture/summary.txt || true
          if [ -f artifacts/reference-screenshot-capture/report.json ]; then
            node -e "const r=require('./artifacts/reference-screenshot-capture/report.json'); console.log(JSON.stringify({status:r.status,sourceHead:r.sourceHead,triggeringSha:r.triggeringSha,releaseBlockingCount:r.releaseBlockingCount,referencePresentCount:r.referencePresentCount,referenceExpectedCount:r.referenceExpectedCount,desktopDiffs:r.results.filter(x=>x.check==='reference-pixel-diff'&&x.viewport==='desktop-1408x1056').map(x=>({screen:x.screen,status:x.status,message:x.message,metrics:x.metrics})),contrast:r.results.filter(x=>x.check==='rendered-color-contrast').map(x=>({viewport:x.viewport,screen:x.screen,status:x.status,message:x.message})),keyboard:r.results.filter(x=>x.check==='keyboard-focus-reachability').map(x=>({viewport:x.viewport,screen:x.screen,status:x.status,message:x.message}))},null,2))"
          fi

      - name: Upload deterministic screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-screenshot-capture
          path: artifacts/reference-screenshot-capture
          if-no-files-found: warn
          retention-days: 7

      - name: Print preview log on failure
        if: failure()
        run: cat /tmp/starblox-reference-preview.log || true
