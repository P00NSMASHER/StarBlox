name: Diagnose Lantern Private Staging

on:
  push:
    branches:
      - lantern-private-staging-release-20260929
    paths:
      - ".github/workflows/diagnose-lantern-private-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect and explicitly start packaged Main in ephemeral headless session
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.ROBLOX_OPEN_CLOUD_API_KEY;
          const universe=process.env.ROBLOX_UNIVERSE_ID;
          const place=process.env.ROBLOX_PLACE_ID;
          async function parse(r,label){
            const text=await r.text();let p={};
            try{p=text?JSON.parse(text):{};}catch{throw new Error(label+' non-json '+r.status)}
            if(!r.ok)throw new Error(label+' '+r.status+' '+JSON.stringify(p).slice(0,2000));
            return p;
          }
          function taskUrl(path){return 'https://apis.roblox.com/cloud/v2/'+String(path||'').replace(/^https:\/\/apis\.roblox\.com\/cloud\/v2\//,'').replace(/^\/?cloud\/v2\//,'').replace(/^\//,'')}
          const script=[
            'local RS=game:GetService("ReplicatedStorage")',
            'local SS=game:GetService("ServerScriptService")',
            'local RunService=game:GetService("RunService")',
            'print("DIAG2 ids game="..tostring(game.GameId).." place="..tostring(game.PlaceId).." version="..tostring(game.PlaceVersion).." studio="..tostring(RunService:IsStudio()))',
            'local root=SS:WaitForChild("LanternIslandServer",5)',
            'local main=root and root:FindFirstChild("Main")',
            'print("DIAG2 main="..tostring(main).." class="..tostring(main and main.ClassName))',
            'if main then',
            '  local okD,disabled=pcall(function() return main.Disabled end)',
            '  local okE,enabled=pcall(function() return main.Enabled end)',
            '  print("DIAG2 before disabledOk="..tostring(okD).." disabled="..tostring(disabled).." enabledOk="..tostring(okE).." enabled="..tostring(enabled))',
            'end',
            'local rem=RS:FindFirstChild("LanternIslandRemotes")',
            'print("DIAG2 preToggle remotes="..tostring(rem))',
            'if main and not rem then',
            '  local okToggle,err=pcall(function() main.Disabled=true;task.wait(.2);main.Disabled=false end)',
            '  print("DIAG2 toggleDisabled ok="..tostring(okToggle).." err="..tostring(err))',
            'end',
            'for i=1,6 do',
            ' task.wait(2)',
            ' local r=RS:FindFirstChild("LanternIslandRemotes")',
            ' local w=workspace:FindFirstChild("LanternIslandWorld")',
            ' print("DIAG2 tick="..i.." remotes="..tostring(r).." status="..tostring(r and r:GetAttribute("RuntimeStatus")).." world="..tostring(w))',
            ' if r and r:GetAttribute("RuntimeStatus")=="READY" and w then print("LANTERN_EXPLICIT_BOOT_OK version="..tostring(game.PlaceVersion));break end',
            'end'
          ].join('\n');
          const response=await fetch('https://apis.roblox.com/cloud/v2/universes/'+universe+'/places/'+place+'/luau-execution-session-tasks',{method:'POST',headers:{'x-api-key':key,'content-type':'application/json'},body:JSON.stringify({script,timeout:'30s'})});
          let task=await parse(response,'create');const url=taskUrl(task.path);
          while(String(task.state||'')==='PROCESSING'){await new Promise(r=>setTimeout(r,1000));task=await parse(await fetch(url,{headers:{'x-api-key':key}}),'status')}
          const logs=await parse(await fetch(url+'/logs',{headers:{'x-api-key':key}}),'logs');
          console.log(JSON.stringify({task,logs},null,2));
          const text=JSON.stringify(logs);
          if(!text.includes('LANTERN_EXPLICIT_BOOT_OK'))throw new Error('explicit Main bootstrap did not reach READY');
          NODE
