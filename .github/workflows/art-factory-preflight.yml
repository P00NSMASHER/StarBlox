name: StarBlox Art Factory Preflight

on:
  workflow_dispatch:
  push:
    branches: [screenshot-match-preproduction]
    paths:
      - '.github/workflows/art-factory-preflight.yml'
      - 'scripts/artPromptOptimizer.mjs'
      - 'scripts/artPromptOptimizer.node-test.mjs'
      - 'scripts/artFactoryJob.mjs'
      - 'scripts/artFactoryJob.node-test.mjs'
      - 'scripts/artReviewNormalizer.mjs'
      - 'scripts/artReviewNormalizer.node-test.mjs'
      - 'scripts/artRegenerationQueue.mjs'
      - 'scripts/artRegenerationQueue.node-test.mjs'
      - 'scripts/catalogFallbackBacklog.mjs'
      - 'scripts/catalogFallbackBacklog.node-test.mjs'
      - 'scripts/artWorkflowAudit.mjs'
      - 'scripts/artWorkflowAudit.node-test.mjs'
      - 'scripts/catalogVisualPreflight.py'
      - 'scripts/catalogVisualCalibration.py'
      - 'docs/preproduction/art-factory/**'
      - 'docs/preproduction/catalog-sprint/reviews/*.json'
      - 'docs/preproduction/catalog-sprint/lane-*.json'
      - 'public/assets/catalog/**'
      - 'public/assets/catalog-candidates/**'
      - 'catalog-art-manifest.json'
      - 'src/gameModel.js'

permissions:
  contents: read

concurrency:
  group: starblox-art-factory-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-contract:
    if: github.ref_name == 'screenshot-match-preproduction'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify prompt, review-learning, queue, fallback, and workflow-audit tooling
        run: |
          node --test             scripts/artPromptOptimizer.node-test.mjs             scripts/artFactoryJob.node-test.mjs             scripts/artReviewNormalizer.node-test.mjs             scripts/catalogFallbackBacklog.node-test.mjs             scripts/artRegenerationQueue.node-test.mjs             scripts/artWorkflowAudit.node-test.mjs
          node scripts/artPromptOptimizer.mjs validate --repo-root .
          mkdir -p artifacts/art-factory-preflight
          node scripts/artReviewNormalizer.mjs             --repo-root .             --output artifacts/art-factory-preflight/review-corpus.json
          node scripts/catalogFallbackBacklog.mjs             --repo-root .             --output artifacts/art-factory-preflight/fallback-backlog.json
          node scripts/artRegenerationQueue.mjs             --repo-root .             --output artifacts/art-factory-preflight/regeneration-queue.json
          node scripts/artWorkflowAudit.mjs             --repo-root .             --output artifacts/art-factory-preflight/workflow-audit.json

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight image verifier dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Self-test exact-byte, visual-preflight, and calibration tools
        run: |
          python docs/preproduction/art-factory/verify_staged_output.py self-test
          python scripts/catalogVisualPreflight.py self-test
          python scripts/catalogVisualCalibration.py --self-test

      - name: Calibrate report-only visual evidence
        run: |
          python scripts/catalogVisualCalibration.py             --repo-root .             --corpus artifacts/art-factory-preflight/review-corpus.json             --output artifacts/art-factory-preflight/visual-calibration.json

      - name: Prove calibrated warnings round-trip into preflight
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          calibration_path = pathlib.Path('artifacts/art-factory-preflight/visual-calibration.json')
          calibration = json.loads(calibration_path.read_text())
          measured = calibration.get('measured') or []
          if not measured:
              raise SystemExit('Calibration produced no measurable reviewed rasters.')

          target = measured[0]['assetPath']
          output = pathlib.Path('artifacts/art-factory-preflight/calibrated-preflight-sample.json')
          subprocess.run([
              sys.executable,
              'scripts/catalogVisualPreflight.py',
              'scan',
              '--input', target,
              '--neighbors', 'public/assets/catalog',
              '--calibration', str(calibration_path),
              '--output', str(output),
          ], check=True)

          report = json.loads(output.read_text())
          if report['policy']['reportOnly'] is not True:
              raise SystemExit('Calibrated preflight must remain report-only.')
          if report['policy']['calibratedWarningsAreBlocking'] is not False:
              raise SystemExit('Calibrated warnings unexpectedly became blocking.')
          if report['calibrationEvidence']['blockingEnabled'] is not False:
              raise SystemExit('Calibration evidence unexpectedly enables blocking.')
          for warning in report.get('calibratedWarnings', []):
              if warning.get('blocking') is not False:
                  raise SystemExit('A calibrated warning unexpectedly became blocking.')
          print(json.dumps({
              'target': target,
              'warningReadyFeatureCount': report['calibrationEvidence']['warningReadyFeatureCount'],
              'triggeredWarningCount': report['calibrationEvidence']['triggeredWarningCount'],
              'blockingEnabled': report['calibrationEvidence']['blockingEnabled'],
          }, indent=2))
          PY

      - name: Upload fast deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starblox-art-factory-preflight-${{ github.sha }}
          path: artifacts/art-factory-preflight/
          retention-days: 14
          if-no-files-found: error
