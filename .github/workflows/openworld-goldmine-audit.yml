name: Open-world goldmine static audit

on:
  push:
    branches:
      - analysis/openworld-goldmine-audit
    paths:
      - .github/workflows/openworld-goldmine-audit.yml

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: robbing-simulator
            filename: Robbing-Simulator.rbxl
            url: https://devforum.roblox.com/uploads/short-url/beIcwQ8KgqJA5BlbmyCyu78a7g4.rbxl

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Download exact public candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-source audit-output
          curl --fail --location --retry 3 --output "audit-source/${{ matrix.filename }}" "${{ matrix.url }}"
          sha256sum "audit-source/${{ matrix.filename }}"
          stat --printf='%s bytes\n' "audit-source/${{ matrix.filename }}"

      - name: Run StarBlox safe static ingestion
        shell: bash
        run: |
          set -euo pipefail
          npm run roblox:ingest -- \
            --input "audit-source/${{ matrix.filename }}" \
            --out-dir "audit-output/${{ matrix.id }}" \
            --source-id "goldmine-${{ matrix.id }}"

      - name: Emit compact catalog summary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const id = process.env.CANDIDATE_ID;
          const base = `audit-output/${id}`;
          const catalog = JSON.parse(readFileSync(`${base}/capability-catalog.json`, 'utf8'));
          const receipt = JSON.parse(readFileSync(`${base}/ingestion-receipt.json`, 'utf8'));
          const compact = {
            candidate: id,
            receipt,
            summary: catalog.summary,
            systems: (catalog.systemCandidates || []).slice(0, 40).map(x => ({
              name: x.name,
              path: x.path,
              score: x.engineeringLeverageScore,
              tags: x.capabilityTags,
              reuse: x.reuseRecommendation,
              reviewRequired: x.reviewRequired,
              riskFlags: x.riskFlags,
              counts: {
                instances: x.instanceCount,
                scripts: x.scriptCount,
                remotes: x.remoteCount,
                assets: x.assetIdCount
              }
            })),
            inventoryCounts: Object.fromEntries(
              Object.entries(catalog.inventory || {}).map(([k,v]) => [k, Array.isArray(v) ? v.length : null])
            )
          };
          console.log(JSON.stringify(compact, null, 2));
          NODE
        env:
          CANDIDATE_ID: ${{ matrix.id }}

      - uses: actions/upload-artifact@v4
        with:
          name: goldmine-${{ matrix.id }}-catalog
          path: audit-output/${{ matrix.id }}
          retention-days: 7