name: Publish Licensed RHS Exact Working Copy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-rhs-exact.yml"

permissions:
  contents: read

concurrency:
  group: rhs-exact-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: "a70c3df16268663649c157649b43534fa73f92ac"
      EXPECTED_RHS_SHA256: "83df781ddf608f59933ca480e73092d495148ab45b42e78b1f3e0ddc10532054"
      EXPECTED_BASELINE_SHA256: "d71efe44c35a60cb1699c290aed708d901a3a532db74307ae502518616423360"
      ROBLOX_UNIVERSE_ID: "10768955678"
      ROBLOX_PLACE_ID: "87245440673982"
      ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}

    steps:
      - name: Checkout exact licensed RHS source
        uses: actions/checkout@v4
        with:
          repository: P00NSMASHER/PipsQuestWorld
          ref: ${{ env.SOURCE_SHA }}
          path: rhs-source
          fetch-depth: 1

      - name: Verify exact RHS working-copy identity
        shell: bash
        run: |
          set -euo pipefail
          FILE="rhs-source/rhs/working/ROBLOX High School.rbxl"
          test -s "$FILE"
          ACTUAL="$(sha256sum "$FILE" | awk '{print $1}')"
          echo "RHS_WORKING_SHA256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_RHS_SHA256"
          python3 <<'PY'
          import json, os
          from pathlib import Path
          root=Path("rhs-source")
          state=json.loads((root/"rhs/working/BUILD_STATE.json").read_text())
          receipt=json.loads((root/"rhs/working/BUILD_RECEIPT.json").read_text())
          allowed=[
            "sandbox-legacy-ranking-login",
            "sandbox-legacy-group-ranking",
            "sandbox-legacy-gameanalytics",
            "harden-car-instance-remotes",
            "compat-modern-touch-control-startup",
            "compat-house-load-preload-timeout",
          ]
          assert state["baselineSha256"] == os.environ["EXPECTED_BASELINE_SHA256"]
          assert state["expectedWorkingSha256"] == os.environ["EXPECTED_RHS_SHA256"]
          assert state["compatibilityRepairs"] == allowed
          assert receipt["workingSha256"] == os.environ["EXPECTED_RHS_SHA256"]
          assert receipt["baselineSha256"] == os.environ["EXPECTED_BASELINE_SHA256"]
          print("RHS_EXACT_WORKING_COPY_VERIFIED", state["compatibilityRepairs"])
          PY
          stat -c 'RHS_BYTES=%s' "$FILE"
          cp "$FILE" "ROBLOX High School.rbxl"
          sha256sum "ROBLOX High School.rbxl" > rhs-exact-sha256.txt

      - name: Publish RHS working copy to Pip High
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {readFile,writeFile}=await import("node:fs/promises");
          const key=String(process.env.ROBLOX_OPEN_CLOUD_API_KEY||"").trim();
          const universe=String(process.env.ROBLOX_UNIVERSE_ID||"").trim();
          const place=String(process.env.ROBLOX_PLACE_ID||"").trim();
          if(!key) throw new Error("ROBLOX_OPEN_CLOUD_API_KEY missing");
          if(universe!=="10768955678") throw new Error("refusing unexpected universe "+universe);
          if(place!=="87245440673982") throw new Error("refusing unexpected place "+place);
          const bytes=await readFile("ROBLOX High School.rbxl");
          const response=await fetch(
            "https://apis.roblox.com/universes/v1/"+universe+"/places/"+place+"/versions?versionType=Published",
            {
              method:"POST",
              headers:{"x-api-key":key,"content-type":"application/octet-stream"},
              body:bytes
            }
          );
          const body=await response.text();
          if(!response.ok) throw new Error("RHS publish HTTP "+response.status+": "+body.slice(0,2000));
          const payload=JSON.parse(body);
          const version=Number(payload.versionNumber);
          if(!Number.isInteger(version)||version<1) throw new Error("missing versionNumber");
          await writeFile("rhs-published-version.txt",String(version)+"\n");
          await writeFile("rhs-publish-response.json",JSON.stringify(payload,null,2)+"\n");
          await writeFile("rhs-publish-receipt.json",JSON.stringify({
            sourceSha:process.env.SOURCE_SHA,
            workingSha256:process.env.EXPECTED_RHS_SHA256,
            baselineSha256:process.env.EXPECTED_BASELINE_SHA256,
            universeId:universe,
            placeId:place,
            version
          },null,2)+"\n");
          console.log("RHS_EXACT_PUBLISHED version="+version+" sha256="+process.env.EXPECTED_RHS_SHA256);
          NODE

      - name: Probe exact published RHS version
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const key=process.env.ROBLOX_OPEN_CLOUD_API_KEY;
          const universe=process.env.ROBLOX_UNIVERSE_ID;
          const place=process.env.ROBLOX_PLACE_ID;
          const version=Number(fs.readFileSync("rhs-published-version.txt","utf8").trim());

          async function parse(r,label){
            const text=await r.text();
            let payload={};
            try{ payload=text?JSON.parse(text):{}; }
            catch{ throw new Error(label+" non-JSON "+r.status+" "+text.slice(0,800)); }
            if(!r.ok) throw new Error(label+" HTTP "+r.status+" "+JSON.stringify(payload).slice(0,1600));
            return payload;
          }
          async function request(url,opts,label){
            for(let attempt=0;attempt<7;attempt++){
              const r=await fetch(url,opts);
              if(r.status!==429) return parse(r,label);
              await new Promise(res=>setTimeout(res,Math.min(16000,1000*Math.pow(2,attempt))));
            }
            throw new Error(label+" remained rate-limited");
          }

          const script=[
            'assert(game.PlaceVersion=='+version+',"wrong version "..tostring(game.PlaceVersion))',
            'local descendants=game:GetDescendants()',
            'local gui=0 local scripts=0 local tools=0 local seats=0 local sounds=0',
            'for _,v in ipairs(descendants) do',
            ' if v:IsA("GuiObject") then gui+=1 end',
            ' if v:IsA("Script") or v:IsA("LocalScript") or v:IsA("ModuleScript") then scripts+=1 end',
            ' if v:IsA("Tool") then tools+=1 end',
            ' if v:IsA("Seat") or v:IsA("VehicleSeat") then seats+=1 end',
            ' if v:IsA("Sound") then sounds+=1 end',
            'end',
            'assert(#descendants>30000,"RHS world too small "..#descendants)',
            'assert(gui>1000,"RHS GUI surface missing "..gui)',
            'assert(scripts>900,"RHS scripts missing "..scripts)',
            'assert(tools>50,"RHS tools missing "..tools)',
            'assert(seats>250,"RHS seats/vehicles missing "..seats)',
            'assert(sounds>100,"RHS sounds missing "..sounds)',
            'assert(#game:GetService("Teams"):GetChildren()>=8,"RHS teams missing")',
            'print("RHS_EXACT_LIVE_OK version="..game.PlaceVersion.." descendants="..#descendants.." gui="..gui.." scripts="..scripts.." tools="..tools.." seats="..seats.." sounds="..sounds)'
          ].join("\n");

          let task=await request(
            `https://apis.roblox.com/cloud/v2/universes/${universe}/places/${place}/versions/${version}/luau-execution-session-tasks`,
            {method:"POST",headers:{"x-api-key":key,"content-type":"application/json"},body:JSON.stringify({script,timeout:"30s"})},
            "create"
          );
          const raw=String(task.path||"");
          if(!raw) throw new Error("probe task returned no path");
          const url="https://apis.roblox.com/cloud/v2/"+raw
            .replace(/^https:\/\/apis\.roblox\.com\/cloud\/v2\//,"")
            .replace(/^\/?cloud\/v2\//,"")
            .replace(/^\//,"");
          while(String(task.state||"")==="PROCESSING"){
            await new Promise(r=>setTimeout(r,1000));
            task=await request(url,{headers:{"x-api-key":key}},"status");
          }
          const logs=await request(url+"/logs",{headers:{"x-api-key":key}},"logs");
          const logText=JSON.stringify(logs);
          fs.writeFileSync("rhs-live-probe.json",JSON.stringify({version,task,logs},null,2)+"\n");
          if(task.error||String(task.state)!=="COMPLETE") throw new Error("probe failed "+JSON.stringify(task).slice(0,1800));
          if(!logText.includes("RHS_EXACT_LIVE_OK")) throw new Error("live sentinel absent "+logText.slice(0,2400));
          console.log("RHS_EXACT_LIVE_VERIFIED version="+version);
          NODE

      - name: Upload RHS publish receipts
        uses: actions/upload-artifact@v4
        with:
          name: rhs-exact-publish
          path: |
            rhs-exact-sha256.txt
            rhs-published-version.txt
            rhs-publish-response.json
            rhs-publish-receipt.json
            rhs-live-probe.json
          if-no-files-found: warn
          retention-days: 30
