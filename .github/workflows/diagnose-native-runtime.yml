name: Diagnose Native Brookhaven Runtime

on:
  push:
    branches: [repair/native-brookhaven-runtime-v51]
    paths:
      - ".github/workflows/diagnose-native-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect published runtime initialization
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          node <<'NODE'
          const key=process.env.ROBLOX_OPEN_CLOUD_API_KEY,universe=process.env.ROBLOX_UNIVERSE_ID,place=process.env.ROBLOX_PLACE_ID;
          async function parse(r,l){const t=await r.text();let p={};try{p=t?JSON.parse(t):{};}catch{throw new Error(l+" non-json "+r.status+" "+t.slice(0,500));}if(!r.ok)throw new Error(l+" "+r.status+" "+t.slice(0,1500));return p;}
          const script=[
            'local SSS=game:GetService("ServerScriptService")',
            'local SS=game:GetService("ServerStorage")',
            'local SG=game:GetService("StarterGui")',
            'local RS=game:GetService("ReplicatedStorage")',
            'local server=SSS:FindFirstChild("BrookhavenHouseCompat")',
            'local depRemoteEvents=RS:FindFirstChild("RemoteEvents")',
            'local depStartup=RS:FindFirstChild("PlayersStartup")',
            'local depLots=game.Workspace:FindFirstChild("001_Lots")',
            'local depCommon=game.Workspace:FindFirstChild("WorkspaceCom")',
            'local depCameras=depCommon and depCommon:FindFirstChild("001_MapCameras")',
            'print("NATIVE_EARLY_DEPS remoteEvents="..tostring(depRemoteEvents~=nil).." startup="..tostring(depStartup~=nil).." bag="..tostring(depStartup and depStartup:FindFirstChild("PlayersBag")~=nil).." lots="..tostring(depLots~=nil).." common="..tostring(depCommon~=nil).." cameras="..tostring(depCameras~=nil).." houseChoice="..tostring(depRemoteEvents and depRemoteEvents:FindFirstChild("PlayerHouseChoice")~=nil).." gettingHouse="..tostring(depRemoteEvents and depRemoteEvents:FindFirstChild("GettingHouse")~=nil).." playersHouse="..tostring(depRemoteEvents and depRemoteEvents:FindFirstChild("PlayersHouse")~=nil))',
            'local hidden=SS:FindFirstChild("StarBloxBrookhavenCompatibility")',
            'local probe=SS:FindFirstChild("StarBloxNativeRuntimeTest")',
            'local avatar=SG:FindFirstChild("AvatarEditor")',
            'local compileOk,compileErr=pcall(function() local fn,err=loadstring(server and server.Source or ""); if not fn then error(err or "loadstring failed") end end)',
            'print("NATIVE_COMPILE ok="..tostring(compileOk).." err="..tostring(compileErr))',
            'print("NATIVE_DIAG version="..tostring(game.PlaceVersion).." server="..tostring(server~=nil).." disabled="..tostring(server and server.Disabled).." source="..tostring(server and #server.Source or -1).." hidden="..tostring(hidden~=nil).." probe="..tostring(probe~=nil).." avatar="..tostring(avatar~=nil))',
            'local names={}',
            'for _,x in ipairs(RS.RemoteEvents:GetChildren()) do table.insert(names,x.Name..":"..x.ClassName) end',
            'table.sort(names)',
            'print("NATIVE_REMOTE_INVENTORY "..table.concat(names,","))',
            'local backup=RS:FindFirstChild("003_CarBackup")',
            'if backup then for _,m in ipairs(backup:GetChildren()) do if m:IsA("Model") then local parts=0;local anchored=0;local seats=0;local constraints=0;local scripts=0;local liveScripts=0; for _,d in ipairs(m:GetDescendants()) do if d:IsA("BasePart") then parts+=1;if d.Anchored then anchored+=1 end end; if d:IsA("VehicleSeat") then seats+=1 end; if d:IsA("Constraint") then constraints+=1 end; if d:IsA("LuaSourceContainer") then scripts+=1;if #d.Source>0 then liveScripts+=1 end end end; print("VEHICLE_TEMPLATE name="..m.Name.." parts="..parts.." anchored="..anchored.." seats="..seats.." constraints="..constraints.." scripts="..scripts.." sourceScripts="..liveScripts) end end end',
            'local amb=backup and backup:FindFirstChild("Ambulance"); if amb then for _,d in ipairs(amb:GetDescendants()) do if d:IsA("BasePart") and d.Anchored then print("AMB_ANCHORED "..d:GetFullName().." class="..d.ClassName) end; if d:IsA("VehicleSeat") then print("AMB_SEAT "..d:GetFullName().." anchored="..tostring(d.Anchored).." maxSpeed="..tostring(d.MaxSpeed).." torque="..tostring(d.Torque).." turnSpeed="..tostring(d.TurnSpeed).." headsUp="..tostring(d.HeadsUpDisplay)) end; if d:IsA("LuaSourceContainer") then local kids={};for _,k in ipairs(d:GetChildren()) do table.insert(kids,k.Name..":"..k.ClassName) end; print("AMB_SCRIPT "..d:GetFullName().." class="..d.ClassName.." disabled="..tostring(d:IsA("BaseScript") and d.Disabled or false).." chars="..tostring(#d.Source).." children="..table.concat(kids,",").." head="..string.sub(string.gsub(d.Source,"\\n"," "),1,220)) end; if d:IsA("Constraint") then print("AMB_CONSTRAINT "..d:GetFullName().." class="..d.ClassName) end end end',
            'if hidden then local h={}; for _,x in ipairs(hidden:GetChildren()) do table.insert(h,x.Name..":"..x.ClassName) end; print("NATIVE_HIDDEN "..table.concat(h,",")) end',
            'print("NATIVE_DIAG_DONE")'
          ].join("\n");
          let r=await fetch(`https://apis.roblox.com/cloud/v2/universes/${universe}/places/${place}/luau-execution-session-tasks`,{method:"POST",headers:{"x-api-key":key,"content-type":"application/json"},body:JSON.stringify({script,timeout:"30s"})});
          let task=await parse(r,"create");const raw=String(task.path||""),url="https://apis.roblox.com/cloud/v2/"+raw.replace(/^https:\/\/apis\.roblox\.com\/cloud\/v2\//,"").replace(/^\/?cloud\/v2\//,"").replace(/^\//,"");
          while(String(task.state||"")==="PROCESSING"){await new Promise(r=>setTimeout(r,1000));task=await parse(await fetch(url,{headers:{"x-api-key":key}}),"status");}
          const logs=await parse(await fetch(url+"/logs",{headers:{"x-api-key":key}}),"logs");
          console.log(JSON.stringify({task,logs},null,2));
          if(task.error) throw new Error(JSON.stringify(task.error));
          NODE
