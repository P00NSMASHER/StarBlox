<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="Daily Quests decorative illustration">
<title>Daily Quests</title><desc>Three-dimensional quest path with exactly three symbolic stations: a five-action quest card, a transfer bridge, and a reward parcel. Decorative only; no counters or completion claims.</desc>
<defs>
 <linearGradient id="dqSky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff7ff"/><stop offset=".48" stop-color="#d9d7ff"/><stop offset="1" stop-color="#ffe6a8"/></linearGradient>
 <linearGradient id="dqPath" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7ccdf1"/><stop offset=".55" stop-color="#6f7fe5"/><stop offset="1" stop-color="#6652b7"/></linearGradient>
 <linearGradient id="dqGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff59a"/><stop offset=".5" stop-color="#ffd84f"/><stop offset="1" stop-color="#f2a51c"/></linearGradient>
 <linearGradient id="dqCard" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eaf7ff"/></linearGradient>
 <linearGradient id="dqGift" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff90bd"/><stop offset="1" stop-color="#8e66d3"/></linearGradient>
 <filter id="dqShadow" x="-30%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#17366b" flood-opacity=".28"/></filter>
 <filter id="dqGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
