<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 1056" role="img" aria-labelledby="t d">
<title id="t">Brightside bedroom</title><desc id="d">An original warm pink and lilac StarBlox bedroom overlooking Brightside City.</desc>
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#ffd7e7"/><stop offset=".56" stop-color="#efc7ea"/><stop offset="1" stop-color="#cba8da"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#d7a679"/><stop offset="1" stop-color="#9f6a55"/></linearGradient>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#9fe8ff"/><stop offset=".55" stop-color="#f6c8ff"/><stop offset="1" stop-color="#ffd28e"/></linearGradient>
 <linearGradient id="bed" x2="0" y2="1"><stop stop-color="#ff8ec3"/><stop offset="1" stop-color="#bd68d9"/></linearGradient>
 <linearGradient id="wood" x2="1" y2="1"><stop stop-color="#f5c59c"/><stop offset="1" stop-color="#bd7d68"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fffbd8" stop-opacity=".98"/><stop offset="1" stop-color="#fff0b6" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#603e70" flood-opacity=".22"/></filter>
</defs>
<rect width="1408" height="1056" fill="url(#wall)"/>
<ellipse cx="330" cy="185" rx="340" ry="250" fill="url(#sun)" filter="url(#soft)"/>
