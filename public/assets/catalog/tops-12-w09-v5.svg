 <path d="M217 150c29-43 88-61 155 0" fill="none" stroke="#ffe6c0" stroke-opacity=".8" stroke-width="8" stroke-linecap="round"/>
 <path d="M151 523c51 21 107 27 169 15M324 541c39-1 77-10 112-26" fill="none" stroke="#6d492c" stroke-opacity=".45" stroke-width="4"/>
</g>
