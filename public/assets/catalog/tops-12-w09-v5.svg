 <path d="M194 187c31-20 66-27 106-22 38 4 71 18 98 40l-10 38c-30-16-60-24-91-26-31-2-63 4-95 18z" fill="#d17b9c" opacity=".26"/>
 <!-- near sleeve, substantial and forward -->
 <path d="M183 203c-57 16-94 55-112 115-14 46-18 96-13 149 3 32 24 50 54 54l46 6 37-52 27-239z" fill="url(#navy)" stroke="#17213f" stroke-width="5" filter="url(#fabric)"/>
 <!-- far sleeve foreshortened -->
 <path d="M416 219c41 13 66 44 79 88 10 35 13 71 9 107-3 25-18 39-39 42l-37 2-30-39-13-184z" fill="url(#navySide)" stroke="#0d152b" stroke-width="5"/>
 <!-- reinforced sleeve materials -->
 <path d="M88 300c29-18 58-23 87-13l-11 81c-26-13-51-11-76 5z" fill="url(#sand)" stroke="#a77d57" stroke-width="4"/>
 <path d="M75 386c29-15 58-15 86 1l-8 75c-29-11-56-10-82 5z" fill="url(#burg)" stroke="#582140" stroke-width="4"/>
 <path d="M451 290c19-8 36-6 52 6l4 66c-18-9-35-8-52 1z" fill="url(#sand)" stroke="#9f7652" stroke-width="3"/>
 <!-- unmistakable coat tails -->
 <path d="M162 445c43 18 87 24 132 19l-13 88c-42 4-80-1-112-15-24-11-35-32-30-58z" fill="url(#burg)" stroke="#55213f" stroke-width="4"/>
 <path d="M309 455c42 4 85-2 128-18l19 82c-38 19-79 29-123 28z" fill="url(#navySide)" stroke="#0b1429" stroke-width="4"/>
 <path d="M170 517c45 15 92 18 142 8M320 526c42 0 82-8 119-24" fill="none" stroke="#d3b182" stroke-width="7" opacity=".72"/>
 <!-- deep utility pockets -->
 <path d="M201 326l67-4 15 105-76 12z" fill="url(#sand)" stroke="#9d7653" stroke-width="4"/>
 <path d="M213 314l54-3 15 30-69 8z" fill="url(#navy)" stroke="#14213e" stroke-width="4"/>
 <path d="M349 332l61 5-6 105-68-9z" fill="#c9a27c" stroke="#8d6848" stroke-width="4"/>
 <path d="M349 320l49 4 13 31-65-7z" fill="#1a2748" stroke="#10182f" stroke-width="4"/>
 <!-- belt / tabs / buckles -->
 <path d="M205 290l81-7 3 37-82 8z" fill="#1a2748" stroke="#111a34" stroke-width="4"/>
 <path d="M399 300l-75-12-1 36 80 13z" fill="#182443" stroke="#10182f" stroke-width="4"/>
 <rect x="263" y="287" width="40" height="31" rx="7" fill="none" stroke="url(#gold)" stroke-width="7"/>
 <rect x="310" y="292" width="40" height="31" rx="7" fill="none" stroke="url(#gold)" stroke-width="7"/>
 <!-- zipper / storm hardware -->
 <path d="M318 160l20 382" stroke="#151f3d" stroke-width="19" stroke-linecap="round"/>
 <path d="M323 165l10 371" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
 <g fill="url(#gold)" stroke="#75440f" stroke-width="2"><rect x="339" y="223" width="31" height="14" rx="7"/><rect x="341" y="265" width="31" height="14" rx="7"/><rect x="347" y="430" width="31" height="14" rx="7"/></g>
 <!-- Adventure Club compass / star identity -->
 <g><circle cx="389" cy="250" r="31" fill="#28365e" stroke="url(#gold)" stroke-width="5"/><circle cx="389" cy="250" r="18" fill="#7b2e58" stroke="#efc55a" stroke-width="2"/><path d="M389 217l8 25 25 8-25 8-8 25-8-25-25-8 25-8z" fill="url(#gold)" stroke="#fff1aa" stroke-width="2"/><path d="M389 231l4 15 15 4-15 4-4 15-4-15-15-4 15-4z" fill="#fff7d3"/></g>
 <g fill="url(#gold)" stroke="#fff0a7" stroke-width="1.5"><path d="M229 468l7 14 16 2-12 11 3 16-14-7-14 7 3-16-12-11 16-2z"/><path d="M389 474l6 12 13 2-10 9 3 13-12-6-12 6 3-13-10-9 13-2z"/></g>
 <!-- tactile seam/fold/tension cues -->
 <path d="M207 216c30-15 61-21 94-18M206 356c20 7 40 9 61 7M367 372c15 6 30 8 45 7M153 276c-16 38-21 84-15 137" fill="none" stroke="#fff4df" stroke-opacity=".44" stroke-width="6" stroke-linecap="round"/>
 <path d="M441 246c21 18 33 44 36 77M434 370c8 24 10 47 7 69" fill="none" stroke="#b7d8ff" stroke-opacity=".58" stroke-width="7" stroke-linecap="round"/>
 <path d="M230 182l-12 337M378 187l33 339M275 175l-15 357" fill="none" stroke="#e2b364" stroke-opacity=".52" stroke-width="2" stroke-dasharray="5 7"/>
