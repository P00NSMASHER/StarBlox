<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Star Coat</title>
<desc id="desc">Premium dimensional Adventure Club tier five long coat product art.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf1f3"/><stop offset=".45" stop-color="#efe7fb"/><stop offset="1" stop-color="#dce5f4"/></linearGradient>
  <radialGradient id="halo" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#fff6e6" stop-opacity=".8"/><stop offset=".6" stop-color="#d08bb6" stop-opacity=".18"/><stop offset="1" stop-color="#6b568b" stop-opacity="0"/></radialGradient>
  <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a64875"/><stop offset=".48" stop-color="#7a2f58"/><stop offset="1" stop-color="#54203f"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33446d"/><stop offset=".52" stop-color="#202e55"/><stop offset="1" stop-color="#141c39"/></linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1d8"/><stop offset=".46" stop-color="#e6c9a4"/><stop offset="1" stop-color="#c39f78"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2a6"/><stop offset=".3" stop-color="#f6c953"/><stop offset=".7" stop-color="#c78324"/><stop offset="1" stop-color="#87500f"/></linearGradient>
  <linearGradient id="lining" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e6cb"/><stop offset=".5" stop-color="#dcc09d"/><stop offset="1" stop-color="#b9916b"/></linearGradient>
  <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#11182f"/><stop offset=".35" stop-color="#29395f"/><stop offset=".65" stop-color="#15213f"/><stop offset="1" stop-color="#0c1328"/></linearGradient>
  <pattern id="quilt" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="36" height="36" fill="#7b2f58"/><path d="M0 18h36M18 0v36" stroke="#ba6c8f" stroke-opacity=".32" stroke-width="2"/><circle cx="18" cy="18" r="2.2" fill="#f2bc62" opacity=".55"/></pattern>
  <pattern id="ribbing" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="url(#rib)"/><path d="M2 0v7M5 0v7" stroke="#fff" stroke-opacity=".12"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/><feOffset dy="13" result="o"/><feColorMatrix in="o" type="matrix" values="0 0 0 0 0.16 0 0 0 0 0.12 0 0 0 0 0.24 0 0 0 .3 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.35"/></filter>
</defs>
<rect width="600" height="600" rx="44" fill="url(#bg)"/>
<rect width="600" height="600" rx="44" fill="url(#halo)"/>
<ellipse cx="301" cy="535" rx="176" ry="27" fill="#2a2245" opacity=".17" filter="url(#soft)"/>
