  <path d="M85 366c29-15 58-15 86 0l-8 71c-29-10-57-9-84 6z" fill="url(#plum)" stroke="#5f2546" stroke-width="4"/>
  <path d="M529 366c-29-15-58-15-86 0l8 71c29-10 57-9 84 6z" fill="url(#plum)" stroke="#5f2546" stroke-width="4"/>
