 <path d="M112 158l10 23 23 10-23 10-10 23-10-23-23-10 23-10z"/>
 <path d="M676 166l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"/>
 <circle cx="122" cy="598" r="7"/><circle cx="674" cy="610" r="9"/>
