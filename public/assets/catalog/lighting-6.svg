  <path d="M338 279c32-28 78-36 118-18" fill="none" stroke="#fff8d9" stroke-width="18" stroke-linecap="round" opacity=".7"/>
  <circle cx="372" cy="336" r="19" fill="#f09a55" opacity=".7"/><circle cx="443" cy="389" r="13" fill="#f09a55" opacity=".65"/>
