<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Sunny Pop Planet Lamp">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff9ea" offset="0"/><stop stop-color="#fff0b8" offset=".5"/><stop stop-color="#ff7a56" stop-opacity=".62" offset="1"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="43%" r="52%">
    <stop stop-color="#fff" stop-opacity=".96" offset="0"/><stop stop-color="#f5b92e" stop-opacity=".32" offset=".42"/><stop stop-color="#ff7a56" stop-opacity="0" offset="1"/>
  </radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff" offset="0"/><stop stop-color="#dfe6f1" offset=".24"/><stop stop-color="#8090a9" offset=".58"/><stop stop-color="#f6fbff" offset=".82"/><stop stop-color="#5b677a" offset="1"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff6b0"/><stop stop-color="#ffd34f" offset=".35"/><stop stop-color="#c67c14" offset=".72"/><stop stop-color="#ffe982" offset="1"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff" stop-opacity=".92"/><stop stop-color="#f5b92e" stop-opacity=".58" offset=".48"/><stop stop-color="#ff7a56" stop-opacity=".78" offset="1"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
