<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Cloud Jacket</title>
<desc id="desc">Premium dimensional Candy Core tier four puffer jacket product art.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8fb"/><stop offset=".5" stop-color="#f8ebff"/><stop offset="1" stop-color="#e9f5ff"/></linearGradient>
  <radialGradient id="halo" cx="50%" cy="42%" r="54%"><stop offset="0" stop-color="#ffffff" stop-opacity=".92"/><stop offset=".65" stop-color="#ffd8ef" stop-opacity=".22"/><stop offset="1" stop-color="#b9cfff" stop-opacity="0"/></radialGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb7dc"/><stop offset=".45" stop-color="#f47cc0"/><stop offset="1" stop-color="#cf5db1"/></linearGradient>
  <linearGradient id="pinkHi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0f1"/><stop offset=".38" stop-color="#ffa7d2"/><stop offset="1" stop-color="#e066b6"/></linearGradient>
  <linearGradient id="lilac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ded4ff"/><stop offset=".45" stop-color="#b89cff"/><stop offset="1" stop-color="#876fe1"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9efff"/><stop offset=".5" stop-color="#9cc9ff"/><stop offset="1" stop-color="#6e9ee9"/></linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffefc"/><stop offset=".7" stop-color="#f8eaf4"/><stop offset="1" stop-color="#e9d8ea"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a3"/><stop offset=".34" stop-color="#f7c452"/><stop offset=".72" stop-color="#d69022"/><stop offset="1" stop-color="#9c5f13"/></linearGradient>
  <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7052bf"/><stop offset=".28" stop-color="#a689ea"/><stop offset=".52" stop-color="#ff91c5"/><stop offset=".74" stop-color="#a689ea"/><stop offset="1" stop-color="#6c52b7"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/><feOffset dy="12" result="o"/><feColorMatrix in="o" type="matrix" values="0 0 0 0 0.25 0 0 0 0 0.16 0 0 0 0 0.42 0 0 0 .25 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.25"/></filter>
  <pattern id="ribbing" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="url(#rib)"/><path d="M2 0v8M6 0v8" stroke="#fff" stroke-opacity=".18" stroke-width="1"/></pattern>
</defs>
<rect width="600" height="600" rx="44" fill="url(#bg)"/>
<rect width="600" height="600" rx="44" fill="url(#halo)"/>
<ellipse cx="302" cy="531" rx="180" ry="28" fill="#6a4b9f" opacity=".14" filter="url(#soft)"/>
