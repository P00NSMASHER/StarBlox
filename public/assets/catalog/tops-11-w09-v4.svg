  <path d="M197 282c27-14 54-18 79-12 20 5 35 15 46 31 13-17 31-27 52-30 25-4 48 1 67 15l8 70c-21-8-41-9-60-2-18 6-33 18-43 36-15-17-34-27-57-29-29-2-55 8-78 31z" fill="url(#cream)" stroke="#e2d2df" stroke-width="3"/>
  <path d="M205 363c24-12 49-15 74-8 20 6 35 17 46 33 13-16 31-26 52-28 27-3 51 5 72 24l7 53c-20 17-46 25-75 24-20-1-39-6-56-16-18 11-39 17-63 18-22 1-41-5-56-17z" fill="url(#blue)" stroke="#6f9fdb" stroke-width="3"/>
