  <path d="M547 369c-19-10-39-12-57-5-16 6-28 18-35 34-10-13-23-21-41-23l7 54c18 0 33 8 43 22 10-14 24-22 43-23 16-1 29 3 41 12z" fill="url(#blue)" stroke="#7caee7" stroke-width="3"/>
