<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Workstream 07 room-tier material progression board</title>
  <desc id="desc">A reference-only StarBlox art study showing five increasingly rich room material families from Tiny Starter Studio through Star Mansion. No gameplay state, counters, prices, rewards, ownership, or canonical runtime wiring are represented.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f7ff"/><stop offset=".55" stop-color="#eef5ff"/><stop offset="1" stop-color="#fff5e9"/></linearGradient>
    <linearGradient id="t1wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#dfeafa"/></linearGradient>
    <linearGradient id="t2wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9f1"/><stop offset="1" stop-color="#eadff7"/></linearGradient>
    <linearGradient id="t3wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4efff"/><stop offset="1" stop-color="#d7e8fb"/></linearGradient>
    <linearGradient id="t4wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef5ff"/><stop offset=".55" stop-color="#d6e2f0"/><stop offset="1" stop-color="#f1e1d2"/></linearGradient>
    <linearGradient id="t5wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f4ff"/><stop offset=".48" stop-color="#e5ebff"/><stop offset="1" stop-color="#ffe7ca"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9b38d"/><stop offset=".45" stop-color="#a97658"/><stop offset="1" stop-color="#6d4a3f"/></linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8d6352"/><stop offset=".5" stop-color="#5f3f39"/><stop offset="1" stop-color="#352d35"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a4"/><stop offset=".45" stop-color="#dab458"/><stop offset="1" stop-color="#8b612b"/></linearGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a7bc7"/><stop offset="1" stop-color="#493d72"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bff7ff" stop-opacity=".82"/><stop offset=".5" stop-color="#5ca7dc" stop-opacity=".64"/><stop offset="1" stop-color="#463d7f" stop-opacity=".8"/></linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9f5f0"/><stop offset=".55" stop-color="#d9d5d7"/><stop offset="1" stop-color="#b7adb9"/></linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 2h8M0 6h8M2 0v8M6 0v8" stroke="#fff" stroke-opacity=".18" stroke-width=".8"/></pattern>
    <pattern id="linen" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 2h10M0 7h10M3 0v10M8 0v10" stroke="#6a7184" stroke-opacity=".12" stroke-width=".7"/></pattern>
    <pattern id="marbleVein" width="52" height="38" patternUnits="userSpaceOnUse"><path d="M-8 31c20-14 34-26 71-27M-3 9c20 8 31 22 66 20" fill="none" stroke="#806f8c" stroke-opacity=".14" stroke-width="1.2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#25304d" flood-opacity=".18"/></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .h1{font:700 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#27345f}.sub{font:500 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#5b6688}.tier{font:700 19px system-ui,-apple-system,Segoe UI,sans-serif;fill:#26345e}.name{font:600 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#506080}.cap{font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#51617f}.tiny{font:500 11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#697590}.hash{font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7d87a0}.rule{stroke:#dce3f3;stroke-width:1}.sw{stroke:#fff;stroke-width:2}.label{font:700 10px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1215" cy="95" r="140" fill="#8dcfff" opacity=".12" filter="url(#soft)"/>
  <circle cx="125" cy="800" r="160" fill="#d9a9ff" opacity=".11" filter="url(#soft)"/>

  <text x="70" y="72" class="h1">Home Tier Material &amp; Lighting Progression</text>
  <text x="70" y="102" class="sub">Reference-only visual study for later shared finishing. Increase material richness, depth and spectacle without introducing gameplay state.</text>
  <line x1="70" y1="130" x2="1370" y2="130" class="rule"/>

  <!-- Tier cards -->
  <g transform="translate(70 165)">
    <!-- T1 -->
    <g filter="url(#shadow)">
      <rect width="244" height="625" rx="24" fill="#ffffff"/>
      <rect x="16" y="16" width="212" height="188" rx="18" fill="url(#t1wall)"/>
      <path d="M16 151L228 128V204H16Z" fill="#c7b89e"/>
      <rect x="31" y="72" width="80" height="69" rx="7" fill="#fff" stroke="#c9d4e7" stroke-width="3"/>
      <rect x="39" y="78" width="64" height="54" rx="4" fill="#b7dcf7"/>
      <path d="M39 117l17-18 17 13 14-17 16 22v15H39z" fill="#7bb77f"/>
      <path d="M45 148l93-4 8 28-103 6z" fill="#f8f9fb" stroke="#d6dce8" stroke-width="2"/>
      <path d="M132 128h61v49h-61z" fill="#b88665"/>
      <rect x="141" y="139" width="43" height="22" rx="4" fill="#d8ecfa"/>
      <ellipse cx="95" cy="186" rx="54" ry="10" fill="#6e86a8" opacity=".18"/>
    </g>
    <text x="18" y="237" class="tier">1 · Tiny Starter Studio</text>
    <text x="18" y="260" class="name">Clean, friendly, low-complexity baseline</text>
    <line x1="18" y1="278" x2="226" y2="278" class="rule"/>
    <text x="18" y="304" class="cap">MATERIAL SIGNALS</text>
    <g transform="translate(18 316)">
      <rect width="48" height="48" rx="11" fill="#eef5fb" class="sw"/><rect x="54" width="48" height="48" rx="11" fill="#d6c4aa" class="sw"/><rect x="108" width="48" height="48" rx="11" fill="#f8f9fb" class="sw"/><rect x="162" width="48" height="48" rx="11" fill="#91b9d4" class="sw"/>
      <text x="24" y="69" text-anchor="middle" class="tiny">paint</text><text x="78" y="69" text-anchor="middle" class="tiny">soft wood</text><text x="132" y="69" text-anchor="middle" class="tiny">cotton</text><text x="186" y="69" text-anchor="middle" class="tiny">glass</text>
    </g>
    <text x="18" y="420" class="cap">LIGHT</text><text x="18" y="441" class="tiny">Broad daylight · one warm accent</text>
    <text x="18" y="473" class="cap">DEPTH TARGET</text><text x="18" y="494" class="tiny">3 clear planes · soft contact shadows</text>
    <text x="18" y="526" class="cap">AVOID</text><text x="18" y="547" class="tiny">Luxury trim · dense props · hard bloom</text>
    <text x="18" y="592" class="hash">asset 2d3060ac1e260a53…</text>
  </g>

  <!-- T2 -->
  <g transform="translate(332 165)">
    <g filter="url(#shadow)">
      <rect width="244" height="625" rx="24" fill="#ffffff"/>
      <rect x="16" y="16" width="212" height="188" rx="18" fill="url(#t2wall)"/>
      <path d="M16 150L228 132V204H16Z" fill="#ba987a"/>
      <rect x="35" y="66" width="74" height="74" rx="9" fill="#fefcf7" stroke="#d8c7b2" stroke-width="3"/>
      <path d="M42 126l19-29 17 17 12-13 12 25v7H42z" fill="#8db792"/>
      <path d="M45 147l105-5 8 32-116 7z" fill="#f9f2e8" stroke="#dfd1c4" stroke-width="2"/>
      <path d="M43 169c38 10 74 6 111-8" fill="none" stroke="#c89ec9" stroke-width="5" opacity=".55"/>
      <path d="M146 122h51l8 55h-65z" fill="url(#wood)"/>
      <circle cx="176" cy="111" r="12" fill="#ffd67d"/><circle cx="176" cy="111" r="27" fill="#ffd67d" opacity=".17" filter="url(#soft)"/>
      <ellipse cx="99" cy="189" rx="60" ry="9" fill="#563c52" opacity=".2"/>
    </g>
    <text x="18" y="237" class="tier">2 · Cozy Loft</text>
    <text x="18" y="260" class="name">Warm textile layering and crafted wood</text>
    <line x1="18" y1="278" x2="226" y2="278" class="rule"/>
    <text x="18" y="304" class="cap">MATERIAL SIGNALS</text>
    <g transform="translate(18 316)">
      <rect width="48" height="48" rx="11" fill="#e9dccb" class="sw"/><rect x="54" width="48" height="48" rx="11" fill="url(#wood)" class="sw"/><rect x="108" width="48" height="48" rx="11" fill="#c49bc6" class="sw"/><rect x="162" width="48" height="48" rx="11" fill="#f0c66b" class="sw"/>
      <text x="24" y="69" text-anchor="middle" class="tiny">plaster</text><text x="78" y="69" text-anchor="middle" class="tiny">oak</text><text x="132" y="69" text-anchor="middle" class="tiny">woven</text><text x="186" y="69" text-anchor="middle" class="tiny">warm metal</text>
    </g>
    <text x="18" y="420" class="cap">LIGHT</text><text x="18" y="441" class="tiny">Window key · warm practical pool</text>
    <text x="18" y="473" class="cap">DEPTH TARGET</text><text x="18" y="494" class="tiny">4 planes · layered textiles + desk</text>
    <text x="18" y="526" class="cap">AVOID</text><text x="18" y="547" class="tiny">Metal everywhere · glossy toy finish</text>
    <text x="18" y="592" class="hash">asset 21410fe2456a1605…</text>
  </g>

  <!-- T3 -->
  <g transform="translate(594 165)">
    <g filter="url(#shadow)">
      <rect width="244" height="625" rx="24" fill="#ffffff"/>
      <rect x="16" y="16" width="212" height="188" rx="18" fill="url(#t3wall)"/>
      <path d="M16 150L228 129V204H16Z" fill="#9c7f7b"/>
      <rect x="128" y="47" width="77" height="88" rx="9" fill="#fdfdff" stroke="#b8c8df" stroke-width="4"/>
      <rect x="137" y="57" width="59" height="68" rx="5" fill="url(#glass)"/>
      <path d="M39 145l98-4 10 35-109 7z" fill="#eee4ff" stroke="#cab6de" stroke-width="2"/>
      <path d="M44 166c30 8 65 6 96-7" fill="none" stroke="#8f75b9" stroke-width="5" opacity=".55"/>
      <path d="M138 140h59l9 38h-74z" fill="#514266"/>
      <rect x="149" y="111" width="47" height="32" rx="5" fill="#63c7db" stroke="#57496e" stroke-width="3"/>
      <rect x="43" y="72" width="62" height="47" rx="10" fill="#fff" stroke="#c7b7df" stroke-width="3"/>
      <path d="M58 103l12-17 11 12 12-17" fill="none" stroke="#8164bf" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="105" cy="190" rx="64" ry="10" fill="#463850" opacity=".22"/>
    </g>
    <text x="18" y="237" class="tier">3 · Creator Bedroom</text>
    <text x="18" y="260" class="name">Sharper tech/material separation</text>
    <line x1="18" y1="278" x2="226" y2="278" class="rule"/>
    <text x="18" y="304" class="cap">MATERIAL SIGNALS</text>
    <g transform="translate(18 316)">
      <rect width="48" height="48" rx="11" fill="#e9e1f7" class="sw"/><rect x="54" width="48" height="48" rx="11" fill="#69516a" class="sw"/><rect x="108" width="48" height="48" rx="11" fill="#75cfdf" class="sw"/><rect x="162" width="48" height="48" rx="11" fill="#8b75b6" class="sw"/>
      <text x="24" y="69" text-anchor="middle" class="tiny">linen</text><text x="78" y="69" text-anchor="middle" class="tiny">dark wood</text><text x="132" y="69" text-anchor="middle" class="tiny">display</text><text x="186" y="69" text-anchor="middle" class="tiny">accent</text>
    </g>
    <text x="18" y="420" class="cap">LIGHT</text><text x="18" y="441" class="tiny">Cool window fill · controlled RGB accent</text>
    <text x="18" y="473" class="cap">DEPTH TARGET</text><text x="18" y="494" class="tiny">5 planes · tech, bed, wall art separated</text>
    <text x="18" y="526" class="cap">AVOID</text><text x="18" y="547" class="tiny">Neon wash · flat screen-card collage</text>
    <text x="18" y="592" class="hash">asset 87cded45608fed85…</text>
  </g>

  <!-- T4 -->
  <g transform="translate(856 165)">
    <g filter="url(#shadow)">
      <rect width="244" height="625" rx="24" fill="#ffffff"/>
      <rect x="16" y="16" width="212" height="188" rx="18" fill="url(#t4wall)"/>
      <path d="M16 149L228 123V204H16Z" fill="url(#walnut)"/>
      <path d="M126 37h82v94h-82z" fill="#f8fbff" stroke="#b3c3d3" stroke-width="4"/><rect x="135" y="46" width="64" height="76" rx="4" fill="url(#glass)"/>
      <path d="M40 145l106-6 12 39-121 7z" fill="#f4efe8" stroke="#bcaea4" stroke-width="2"/>
      <path d="M44 166c36 10 74 7 109-9" fill="none" stroke="#ab8b70" stroke-width="6" opacity=".65"/>
      <path d="M138 139h64l8 40h-79z" fill="url(#walnut)"/>
      <rect x="150" y="101" width="48" height="37" rx="5" fill="#4b5a71" stroke="url(#brass)" stroke-width="3"/><rect x="156" y="108" width="36" height="22" rx="3" fill="#6bd5dd"/>
      <path d="M59 60h46v57H59z" fill="#fcfaf6" stroke="#c9b68c" stroke-width="3"/><path d="M68 106l13-21 13 14 7-10" fill="none" stroke="#9c7655" stroke-width="4"/>
      <ellipse cx="111" cy="190" rx="71" ry="10" fill="#2f2938" opacity=".25"/>
    </g>
    <text x="18" y="237" class="tier">4 · Skyline Penthouse</text>
    <text x="18" y="260" class="name">Architectural glazing, walnut and metal</text>
    <line x1="18" y1="278" x2="226" y2="278" class="rule"/>
    <text x="18" y="304" class="cap">MATERIAL SIGNALS</text>
    <g transform="translate(18 316)">
      <rect width="48" height="48" rx="11" fill="url(#glass)" class="sw"/><rect x="54" width="48" height="48" rx="11" fill="url(#walnut)" class="sw"/><rect x="108" width="48" height="48" rx="11" fill="#d5c5b7" class="sw"/><rect x="162" width="48" height="48" rx="11" fill="url(#brass)" class="sw"/>
      <text x="24" y="69" text-anchor="middle" class="tiny">glass</text><text x="78" y="69" text-anchor="middle" class="tiny">walnut</text><text x="132" y="69" text-anchor="middle" class="tiny">tailored</text><text x="186" y="69" text-anchor="middle" class="tiny">brass</text>
    </g>
    <text x="18" y="420" class="cap">LIGHT</text><text x="18" y="441" class="tiny">Skyline key · warm edge/practical light</text>
    <text x="18" y="473" class="cap">DEPTH TARGET</text><text x="18" y="494" class="tiny">6 planes · framing architecture visible</text>
    <text x="18" y="526" class="cap">AVOID</text><text x="18" y="547" class="tiny">Hotel-beige uniformity · overbloom</text>
    <text x="18" y="592" class="hash">asset 9963a3abdc242660…</text>
  </g>

  <!-- T5 -->
  <g transform="translate(1118 165)">
    <g filter="url(#shadow)">
      <rect width="244" height="625" rx="24" fill="#ffffff"/>
      <rect x="16" y="16" width="212" height="188" rx="18" fill="url(#t5wall)"/>
      <path d="M16 149L228 121V204H16Z" fill="url(#marble)"/><path d="M16 149L228 121V204H16Z" fill="url(#marbleVein)"/>
      <path d="M123 34h87v97h-87z" fill="#fff" stroke="url(#brass)" stroke-width="5"/><rect x="133" y="45" width="67" height="75" rx="3" fill="url(#glass)"/>
      <path d="M35 145l109-7 14 40-126 8z" fill="#eadcff" stroke="url(#brass)" stroke-width="2"/>
      <path d="M43 163c36 13 74 10 111-7" fill="none" stroke="#c0a4dc" stroke-width="7" opacity=".72"/>
      <path d="M143 139h62l9 40h-79z" fill="#433b69" stroke="url(#brass)" stroke-width="2"/>
      <rect x="151" y="102" width="52" height="37" rx="5" fill="#3c3960" stroke="url(#brass)" stroke-width="3"/><rect x="158" y="109" width="38" height="22" rx="3" fill="#6ce5da"/>
      <path d="M52 64h47v56H52z" fill="#fffdf9" stroke="url(#brass)" stroke-width="3"/><path d="M61 108l13-22 11 13 10-18" fill="none" stroke="#7c63b9" stroke-width="4"/>
      <circle cx="112" cy="51" r="8" fill="#ffe480"/><path d="M112 31v11M112 60v11M92 51h11M121 51h11" stroke="#c69534" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="111" cy="191" rx="73" ry="10" fill="#2b2440" opacity=".27"/>
    </g>
    <text x="18" y="237" class="tier">5 · Star Mansion</text>
    <text x="18" y="260" class="name">Spectacle through material contrast, not noise</text>
    <line x1="18" y1="278" x2="226" y2="278" class="rule"/>
    <text x="18" y="304" class="cap">MATERIAL SIGNALS</text>
    <g transform="translate(18 316)">
      <rect width="48" height="48" rx="11" fill="url(#marble)" class="sw"/><rect x="54" width="48" height="48" rx="11" fill="url(#velvet)" class="sw"/><rect x="108" width="48" height="48" rx="11" fill="url(#brass)" class="sw"/><rect x="162" width="48" height="48" rx="11" fill="url(#glass)" class="sw"/>
      <text x="24" y="69" text-anchor="middle" class="tiny">marble</text><text x="78" y="69" text-anchor="middle" class="tiny">velvet</text><text x="132" y="69" text-anchor="middle" class="tiny">gold trim</text><text x="186" y="69" text-anchor="middle" class="tiny">night glass</text>
    </g>
    <text x="18" y="420" class="cap">LIGHT</text><text x="18" y="441" class="tiny">Night-sky key · chandelier + warm rim</text>
    <text x="18" y="473" class="cap">DEPTH TARGET</text><text x="18" y="494" class="tiny">7+ planes · premium but readable</text>
    <text x="18" y="526" class="cap">AVOID</text><text x="18" y="547" class="tiny">Gold flood · particle noise · fake UI glow</text>
    <text x="18" y="592" class="hash">asset c5eb44f34604737…</text>
  </g>

  <g transform="translate(70 818)">
    <rect width="1300" height="48" rx="15" fill="#27345f" opacity=".94"/>
    <text x="22" y="21" class="label">SHARED FINISHING RULE</text>
    <text x="22" y="38" class="label" style="font-weight:500;letter-spacing:0">Progress = stronger material separation + spatial depth + controlled light hierarchy. Never fake counters, completion, prices, ownership, rewards, mastery or canonical state in the artwork.</text>
  </g>
</svg>